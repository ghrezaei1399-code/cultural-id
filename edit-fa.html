<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ویرایش اطلاعات | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0a0a1a;
        }

        body.dark {
            color: #f0f0f0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a1a2a;
            text-align: center;
            margin-bottom: 0.3rem;
        }

        body.dark h1 {
            color: #f9e79f;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #2a2a3a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 1rem;
        }

        body.dark .subtitle {
            color: #d0d0e0;
            border-bottom-color: rgba(255,255,255,0.05);
        }

        .warning-box {
            background: rgba(255, 200, 50, 0.1);
            border: 1px solid rgba(255, 200, 50, 0.1);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5a4a0a;
        }

        body.dark .warning-box {
            color: #f9e79f;
            background: rgba(255, 200, 50, 0.05);
        }

        .warning-box strong {
            color: #8a2a0a;
        }

        body.dark .warning-box strong {
            color: #f9e79f;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a1a2a;
            margin-bottom: 0.3rem;
        }

        body.dark .form-group label {
            color: #f0f0f0;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.1);
            font-family: inherit;
            font-size: 0.95rem;
            color: #0a0a1a;
            transition: all 0.3s ease;
            outline: none;
        }

        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            background: rgba(255, 255, 255, 0.05);
            color: #f0f0f0;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.15);
        }

        body.dark .form-group input:focus,
        body.dark .form-group select:focus,
        body.dark .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a4a5a;
            opacity: 0.5;
        }

        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder {
            color: #a0a0b0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-primary {
            background: rgba(0, 0, 0, 0.03);
            color: #0a0a1a;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.05);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .btn-primary:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.02);
        }

        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-back {
            background: rgba(0, 0, 0, 0.02);
            color: #3a3a4a;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        body.dark .btn-back {
            background: rgba(255, 255, 255, 0.02);
            color: #a0a0b0;
            border-color: rgba(255, 255, 255, 0.02);
        }

        .btn-back:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: scale(1.02);
        }

        body.dark .btn-back:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #0a0a1a;
            border-top: 1px solid rgba(0,0,0,0.02);
            padding-top: 1rem;
        }

        body.dark .note {
            color: #d0d0e0;
            border-top-color: rgba(255,255,255,0.02);
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,0,0,0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #0a0a1a;
        }

        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0,0,0,0.1);
            border-color: rgba(255,255,255,0.02);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>✏️ ویرایش اطلاعات</h1>
        <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="warning-box">
            ⚠️ <strong>توجه:</strong> فقط <strong>یک بار</strong> امکان ویرایش اطلاعات وجود دارد. لطفاً با دقت وارد کنید.
        </div>

        <form>
            <div class="form-group">
                <label>کد کارت (غیرقابل تغییر)</label>
                <input type="text" value="CIM-۱۲۳۴-۵۶۷۸-الف" disabled style="opacity:0.5;" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۱</label>
                    <input type="text" placeholder="مثلاً: صلح‌دوستی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۲</label>
                    <input type="text" placeholder="مثلاً: احترام به تنوع" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۳</label>
                    <input type="text" placeholder="مثلاً: همکاری جمعی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۴</label>
                    <input type="text" placeholder="مثلاً: دانش‌محوری" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۵</label>
                    <input type="text" placeholder="مثلاً: عدالت‌خواهی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۶</label>
                    <input type="text" placeholder="مثلاً: مهربانی" />
                </div>
            </div>

            <div class="form-group">
                <label>ارزش فرهنگی ۷</label>
                <input type="text" placeholder="مثلاً: مسئولیت‌پذیری" />
            </div>

            <div class="form-group">
                <label>بخش اختیاری (۵ کاراکتر دلخواه)</label>
                <input type="text" maxlength="5" placeholder="مثلاً: الف-ب-ج-د-ه" />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">💾 ذخیره تغییرات</button>
                <a href="index.html" class="btn btn-back">↩ بازگشت</a>
            </div>
        </form>

        <div class="note">
            ⚡ این ویرایش فقط یک بار امکان‌پذیر است. پس از تأیید، قابل بازگشت نیست.
        </div>
    </div>

    <script>
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();
    </script>
</body>
</html>
