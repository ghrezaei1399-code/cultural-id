<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ویرایش اطلاعات | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .warning-box {
            background: rgba(180, 80, 30, 0.02);
            border: 1px solid rgba(180, 80, 30, 0.02);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5a2a0a;
        }
        body.dark .warning-box { color: #f9e79f; background: rgba(255, 200, 50, 0.02); }
        .warning-box strong { color: #8a2a0a; }
        body.dark .warning-box strong { color: #f9e79f; }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a3a2a;
            opacity: 0.5;
        }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder {
            color: #908070;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover {
            background: rgba(60, 30, 10, 0.04);
            transform: scale(1.02);
        }
        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover {
            background: rgba(60, 30, 10, 0.03);
            transform: scale(1.02);
        }
        body.dark .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50, 200, 50, 0.05);
            border: 1px solid rgba(50, 200, 50, 0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success {
            color: #80b080;
            background: rgba(50, 200, 50, 0.01);
            border-color: rgba(50, 200, 50, 0.01);
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error {
            color: #b08080;
            background: rgba(200, 50, 50, 0.01);
            border-color: rgba(200, 50, 50, 0.01);
        }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .value-item {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border: 1px solid rgba(30, 10, 0, 0.02);
        }
        body.dark .value-item { border-color: rgba(255, 255, 255, 0.02); }
        .value-item .value-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
            display: block;
        }
        body.dark .value-item .value-title { color: #e8d8c8; }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
        .hidden { display: none; }
        .loading {
            text-align: center;
            padding: 2rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>✏️ ویرایش اطلاعات</h1>
        <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="warning-box">
            ⚠️ <strong>توجه:</strong> فقط <strong>یک بار</strong> امکان ویرایش اطلاعات وجود دارد. لطفاً با دقت وارد کنید.
        </div>

        <div id="messageBox" class="message-box"></div>

        <form id="editForm">
            <div class="form-group">
                <label>کد کارت (غیرقابل تغییر)</label>
                <input type="text" id="cardCodeDisplay" disabled style="opacity:0.5;" />
            </div>

            <div class="value-item">
                <label class="value-title">۱. ارزش‌های بومی</label>
                <input type="text" id="v1" placeholder="مثلاً: صلح‌دوستی، مهمان‌نوازی" required />
            </div>

            <div class="value-item">
                <label class="value-title">۲. دانش فردی</label>
                <input type="text" id="v2" placeholder="مثلاً: دانش بومی، مهارت‌های سنتی" required />
            </div>

            <div class="value-item">
                <label class="value-title">۳. همکاری جمعی</label>
                <input type="text" id="v3" placeholder="مثلاً: کار گروهی، مشارکت اجتماعی" required />
            </div>

            <div class="value-item">
                <label class="value-title">۴. تنوع فرهنگی</label>
                <input type="text" id="v4" placeholder="مثلاً: احترام به فرهنگ‌های مختلف" required />
            </div>

            <div class="value-item">
                <label class="value-title">۵. صلح پایدار جهانی</label>
                <input type="text" id="v5" placeholder="مثلاً: گفت‌وگو، حل تعارض" required />
            </div>

            <div class="value-item">
                <label class="value-title">۶. محو خشونت</label>
                <input type="text" id="v6" placeholder="مثلاً: کاهش تعصب، ترویج مدارا" required />
            </div>

            <div class="value-item">
                <label class="value-title">۷. اتحاد فرهنگی</label>
                <input type="text" id="v7" placeholder="مثلاً: پل‌های ارتباطی میان فرهنگ‌ها" required />
            </div>

            <div class="form-group">
                <label>کد اختیاری (۵ کاراکتر دلخواه)</label>
                <input type="text" id="optionalCode" maxlength="5" placeholder="مثلاً: الف-ب-ج-د-ه" />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">💾 ذخیره تغییرات</button>
                <a href="index.html" class="btn btn-secondary">↩ بازگشت</a>
            </div>
        </form>

        <div class="note">
            ⚡ این ویرایش فقط یک بار امکان‌پذیر است. پس از تأیید، قابل بازگشت نیست.
        </div>
    </div>

    <script>
        // ===== Theme =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== Show Message =====
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message-box';
        }

        // ===== Read from Repository =====
        async function loadFromRepository(cardCode) {
            const REPO_OWNER = 'ghrezaei1399-code';
            const REPO_NAME = 'cultural-id';
            const FILE_PATH = `data/active/${cardCode}.json`;

            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const response = await fetch(url, {
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('کارت با این کد یافت نشد.');
                }
                const errorData = await response.json();
                throw new Error(`خطا در خواندن فایل: ${errorData.message || 'ناشناخته'}`);
            }

            const data = await response.json();
            const content = JSON.parse(atob(data.content));
            return content;
        }

        // ===== Save to Repository =====
        async function saveToRepository(data) {
            const GITHUB_TOKEN = process.env.GH_TOKEN;
            const REPO_OWNER = 'ghrezaei1399-code';
            const REPO_NAME = 'cultural-id';
            const FILE_PATH = `data/active/${data.cardCode}.json`;
            const COMMIT_MESSAGE = `ویرایش اطلاعات کاربر: ${data.cardCode}`;

            const content = JSON.stringify(data, null, 2);

            const checkUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const checkResponse = await fetch(checkUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (checkResponse.status === 200) {
                const existingData = await checkResponse.json();
                const sha = existingData.sha;
                const updateResponse = await fetch(checkUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: COMMIT_MESSAGE,
                        content: btoa(unescape(encodeURIComponent(content))),
                        sha: sha
                    })
                });
                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json();
                    throw new Error(`خطا در به‌روزرسانی فایل: ${errorData.message || 'ناشناخته'}`);
                }
                return await updateResponse.json();
            }

            const createResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: COMMIT_MESSAGE,
                    content: btoa(unescape(encodeURIComponent(content)))
                })
            });

            if (!createResponse.ok) {
                const errorData = await createResponse.json();
                throw new Error(`خطا در ایجاد فایل: ${errorData.message || 'ناشناخته'}`);
            }

            return await createResponse.json();
        }

        // ===== Load Data =====
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');

            let cardCode = codeFromUrl || localStorage.getItem('culturalCardCode');

            if (!cardCode) {
                showMessage('❌ کد کارت یافت نشد. لطفاً از طریق ثبت‌نام اقدام کنید.', 'error');
                return;
            }

            try {
                const cardData = await loadFromRepository(cardCode);
                
                document.getElementById('cardCodeDisplay').value = cardData.cardCode;
                document.getElementById('v1').value = cardData.values[0] || '';
                document.getElementById('v2').value = cardData.values[1] || '';
                document.getElementById('v3').value = cardData.values[2] || '';
                document.getElementById('v4').value = cardData.values[3] || '';
                document.getElementById('v5').value = cardData.values[4] || '';
                document.getElementById('v6').value = cardData.values[5] || '';
                document.getElementById('v7').value = cardData.values[6] || '';
                document.getElementById('optionalCode').value = cardData.optionalCode || '';

                // ذخیره کد برای استفاده در فرم
                document.getElementById('editForm').dataset.cardCode = cardData.cardCode;

            } catch (error) {
                console.error('Error loading data:', error);
                showMessage(`❌ خطا در بارگذاری اطلاعات: ${error.message}`, 'error');
            }
        })();

        // ===== Form Submission =====
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessage();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ذخیره...';

            try {
                const cardCode = this.dataset.cardCode;
                
                const values = [
                    document.getElementById('v1').value.trim(),
                    document.getElementById('v2').value.trim(),
                    document.getElementById('v3').value.trim(),
                    document.getElementById('v4').value.trim(),
                    document.getElementById('v5').value.trim(),
                    document.getElementById('v6').value.trim(),
                    document.getElementById('v7').value.trim()
                ];

                for (let v of values) {
                    if (!v) {
                        throw new Error('لطفاً تمام ۷ ارزش فرهنگی را وارد کنید.');
                    }
                }

                const optionalCode = document.getElementById('optionalCode').value.trim() || '';

                // خواندن اطلاعات قبلی برای حفظ سایر فیلدها
                const oldData = await loadFromRepository(cardCode);
                
                const updatedData = {
                    cardCode: cardCode,
                    optionalCode: optionalCode,
                    values: values,
                    registrationDate: oldData.registrationDate,
                    status: 'edited',
                    referrals: oldData.referrals || 0,
                    achievements: oldData.achievements || []
                };

                await saveToRepository(updatedData);

                // ذخیره در localStorage
                localStorage.setItem('culturalCardData', JSON.stringify(updatedData));

                showMessage('✅ اطلاعات با موفقیت ذخیره شد.', 'success');
                submitBtn.textContent = '✅ ذخیره شد';
                submitBtn.disabled = true;

            } catch (error) {
                console.error('Error saving data:', error);
                showMessage(`❌ خطا در ذخیره‌سازی: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 ذخیره تغییرات';
            }
        });
    </script>
</body>
</html>
