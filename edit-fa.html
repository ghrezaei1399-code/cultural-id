<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ویرایش اطلاعات | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/نماد صلح.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #2a2a3a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .warning-box {
            background: rgba(255, 200, 50, 0.15);
            border: 1px solid rgba(255, 200, 50, 0.2);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5a4a0a;
        }

        .warning-box strong {
            color: #8a2a0a;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0a0a1a;
            margin-bottom: 0.3rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 0.95rem;
            color: #0a0a1a;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a4a5a;
            opacity: 0.5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.15);
            color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: rgba(200, 50, 50, 0.1);
            color: #6a1a1a;
            border: 1px solid rgba(200, 50, 50, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(200, 50, 50, 0.15);
            transform: scale(1.02);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #3a3a4a;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #0a0a1a;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1rem;
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ ویرایش اطلاعات</h1>
        <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="warning-box">
            ⚠️ <strong>توجه:</strong> فقط <strong>یک بار</strong> امکان ویرایش اطلاعات وجود دارد. لطفاً با دقت وارد کنید.
        </div>

        <form>
            <div class="form-group">
                <label>کد کارت (غیرقابل تغییر)</label>
                <input type="text" value="CIM-۱۲۳۴-۵۶۷۸-الف" disabled style="opacity:0.5;" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۱</label>
                    <input type="text" placeholder="مثلاً: صلح‌دوستی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۲</label>
                    <input type="text" placeholder="مثلاً: احترام به تنوع" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۳</label>
                    <input type="text" placeholder="مثلاً: همکاری جمعی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۴</label>
                    <input type="text" placeholder="مثلاً: دانش‌محوری" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ارزش فرهنگی ۵</label>
                    <input type="text" placeholder="مثلاً: عدالت‌خواهی" />
                </div>
                <div class="form-group">
                    <label>ارزش فرهنگی ۶</label>
                    <input type="text" placeholder="مثلاً: مهربانی" />
                </div>
            </div>

            <div class="form-group">
                <label>ارزش فرهنگی ۷</label>
                <input type="text" placeholder="مثلاً: مسئولیت‌پذیری" />
            </div>

            <div class="form-group">
                <label>بخش اختیاری (۵ کاراکتر دلخواه)</label>
                <input type="text" maxlength="5" placeholder="مثلاً: الف-ب-ج-د-ه" />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">💾 ذخیره تغییرات</button>
                <a href="index.html" class="btn btn-back">↩ بازگشت</a>
            </div>
        </form>

        <div class="note">
            ⚡ این ویرایش فقط یک بار امکان‌پذیر است. پس از تأیید، قابل بازگشت نیست.
        </div>
    </div>
</body>
</html>
