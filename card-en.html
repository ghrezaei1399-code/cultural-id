<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural ID Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Vazir', 'IRANSans', sans-serif;
            background: #eef4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 380px;
            width: 100%;
            background: linear-gradient(145deg, #ffffff, #f4f9fc);
            border-radius: 28px;
            padding: 1.8rem 1.5rem 1.8rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hologram-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.03) 0%, rgba(255, 215, 0, 0.06) 25%, rgba(255, 215, 0, 0.02) 50%, rgba(255, 215, 0, 0.07) 75%, rgba(255, 215, 0, 0.02) 100%);
            background-size: 400% 400%;
            animation: hologramShine 8s ease infinite;
            pointer-events: none;
            z-index: 0;
            border-radius: 28px;
        }

        @keyframes hologramShine {
            0% { background-position: 0% 50%; opacity: 0.3; }
            50% { background-position: 100% 50%; opacity: 0.8; }
            100% { background-position: 0% 50%; opacity: 0.3; }
        }

        .hologram-circle {
            position: absolute;
            bottom: 1rem;
            left: 1.2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f9e79f, #f7dc6f, #f9e79f);
            background-size: 200% 200%;
            animation: hologramCircle 4s ease infinite;
            opacity: 0.15;
            z-index: 1;
            border: 1px solid rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.04);
        }

        @keyframes hologramCircle {
            0% { background-position: 0% 50%; transform: rotate(0deg); }
            50% { background-position: 100% 50%; transform: rotate(180deg); }
            100% { background-position: 0% 50%; transform: rotate(360deg); }
        }

        .hologram-strip {
            position: absolute;
            bottom: 0.6rem;
            right: 1.2rem;
            width: 50px;
            height: 16px;
            background: linear-gradient(90deg, #f9e79f, #f7dc6f, #f9e79f);
            background-size: 200% 100%;
            animation: hologramStrip 3s ease infinite;
            opacity: 0.08;
            border-radius: 30px;
            z-index: 1;
        }

        @keyframes hologramStrip {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        .card-logo {
            max-height: 70px;
            width: auto;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 12px rgba(26, 123, 158, 0.08));
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b3b54;
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }

        .card-id {
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1.6rem;
            border-radius: 60px;
            display: inline-block;
            direction: ltr;
            color: #0b3b54;
            border: 1px solid rgba(26, 123, 158, 0.06);
            margin: 0.2rem 0 0.4rem;
            letter-spacing: 1.5px;
        }

        .card-id-parts {
            font-size: 0.65rem;
            opacity: 0.4;
            direction: ltr;
            margin-bottom: 0.6rem;
        }

        .card-id-parts .highlight {
            background: #f9e79f;
            padding: 0 0.3rem;
            border-radius: 12px;
            color: #7d6608;
            font-weight: 600;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.2rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
        }

        .card-footer .slogan {
            font-size: 0.85rem;
            font-weight: 700;
            background: linear-gradient(to right, #1a4b6d, #1a7b9e, #6a3f9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(26, 123, 158, 0.08);
        }

        .card-footer .slogan-icon {
            font-size: 0.8rem;
            opacity: 0.25;
        }

        @media (max-width: 480px) {
            .card { padding: 1.4rem 1rem 1.6rem; }
            .card-id { font-size: 0.95rem; padding: 0.2rem 1rem; }
            .card-title { font-size: 1rem; }
            .card-footer .slogan { font-size: 0.7rem; }
            .card-logo { max-height: 55px; }
            .hologram-circle { width: 35px; height: 35px; bottom: 0.7rem; left: 0.8rem; }
            .hologram-strip { width: 40px; height: 12px; right: 0.8rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="card">
    <div class="hologram-bg"></div>
    <div class="hologram-circle"></div>
    <div class="hologram-strip"></div>

    <div class="card-content">
       <img src="assets/img/logo-en.png" alt="Global Cultural ID" class="logo" />
        <div class="card-title">Global Cultural ID</div>
        <div class="card-id">CIM-1234-5678-A</div>
        <div class="card-id-parts">
            CIM • 1234 • 5678 • <span class="highlight">A</span>
            <span style="display:block; font-size:0.55rem; opacity:0.4;">(Optional: 5 custom characters)</span>
        </div>
        <div class="card-footer">
            <span class="slogan-icon">✦</span>
            <span class="slogan">Our Culture, Our Connection, Our Shared Future</span>
            <span class="slogan-icon">✦</span>
        </div>
    </div>
</div>
</body>
</html>
