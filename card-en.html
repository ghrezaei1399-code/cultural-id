<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural ID Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f0f0f0;
        }
        .card-container {
            width: 340px; min-height: 520px; background: #0a0a0a; border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.15);
            border-radius: 20px; padding: 1.5rem 1.2rem; display: none; flex-direction: column;
            align-items: center; text-align: center; gap: 1.2rem; position: relative;
        }
        .logo-container {
            width: 90px; height: 90px; border-radius: 50%; border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 10px rgba(212, 175, 55, 0.3);
            display: flex; align-items: center; justify-content: center; background: transparent;
        }
        .card-logo { width: 55px; height: 55px; object-fit: contain; background: transparent !important; }
        .card-title { font-size: 1.1rem; font-weight: 800; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); line-height: 1.4; }
        .card-code-box {
            width: 100%; background: rgba(212, 175, 55, 0.08); border: 1px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); border-radius: 10px; padding: 0.9rem; text-align: center;
        }
        .card-code-display {
            font-family: 'Courier New', Courier, monospace; font-size: 1.1rem; color: #f0f0f0;
            letter-spacing: 1px; font-weight: bold;
        }
        .values-section {
            width: 100%; background: rgba(212, 175, 55, 0.05); border: 1px solid #d4af37;
            border-radius: 10px; padding: 0.8rem;
        }
        .values-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .value-item {
            background: rgba(212, 175, 55, 0.15); border: 1px solid #d4af37; border-radius: 6px;
            padding: 4px 10px; font-size: 0.72rem; color: #d4af37; white-space: nowrap; font-weight: 600;
        }
        .hologram-box {
            width: 65px; height: 65px; border: 2px solid #d4af37; border-radius: 10px;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(212, 175, 55, 0.2);
            display: flex; align-items: center; justify-content: center; background: rgba(212, 175, 55, 0.1); margin-top: auto;
        }
        .hologram { width: 42px; height: 42px; opacity: 0.9; }
        
        .bottom-modules {
            display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1.5rem; width: 340px; align-items: center;
        }
        .action-btn {
            width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #d4af37 0%, #f4d03f 50%, #b8962e 100%);
            color: #0a0a0a; border: 1px solid #f9d976; border-radius: 12px; font-family: 'Segoe UI', 'Vazir', sans-serif;
            font-weight: 800; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6); }
        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.1); color: #f0f0f0; border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .action-btn.secondary:hover { background: rgba(255, 255, 255, 0.2); }

        .error-message {
            color: #dc2626; background: rgba(0, 0, 0, 0.9); padding: 1.5rem; border-radius: 12px;
            display: none; text-align: center; font-weight: 600; max-width: 340px; width: 100%;
            border: 2px solid #dc2626; box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
        }
        .rejected-container {
            width: 340px; background: #0a0a0a; border: 2px solid #dc2626; border-radius: 20px;
            padding: 2rem 1.5rem; display: none; flex-direction: column; align-items: center; text-align: center; gap: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContent">
        <div class="logo-container">
            <img src="assets/logo-en.png" alt="Logo" class="card-logo" onerror="this.style.display='none'">
        </div>
        <div class="card-title">Global Smart Cultural Identity Card</div>

        <div class="card-code-box">
            <div class="card-code-display" id="displayCardCode">---</div>
        </div>

        <div class="values-section">
            <div class="values-list" id="displayValues"></div>
        </div>

        <div class="hologram-box">
            <img src="assets/hologram.png" alt="Hologram" class="hologram" onerror="this.style.display='none'">
        </div>
    </div>

    <div class="rejected-container" id="rejectedContent">
        <div style="font-size: 4rem;">❌</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: #dc2626;">Membership Not Accepted</div>
        <div style="font-size: 0.95rem; color: #f0f0f0; line-height: 1.8;">
            Unfortunately, your membership request was reviewed and not approved by the system administrator.
        </div>
        <a href="index-en.html" class="action-btn" style="background: #dc2626; color: white; border: none;">↩ Back to Main Page</a>
    </div>

    <div class="bottom-modules" id="bottomModules" style="display: none;">
        <a id="backCardLink" href="#" class="action-btn secondary">🔄 Back of Card</a>
        <button class="action-btn" onclick="saveCard()">💾 Save Card</button>
        <a href="index-en.html" class="action-btn secondary">↩ Back to Main Site</a>
    </div>

    <div class="error-message" id="cardErrorMessage">❌ Card not found with this code.</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardCode = urlParams.get('code');

        async function loadCardData() {
            if (!cardCode || cardCode === 'undefined') {
                document.getElementById('cardErrorMessage').style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`/api/get-user?code=${cardCode}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Error loading data');
                const user = data.user;

                if (user.status === 'rejected') {
                    document.getElementById('cardContent').style.display = 'none';
                    document.getElementById('bottomModules').style.display = 'none';
                    document.getElementById('rejectedContent').style.display = 'flex';
                    return;
                }

                // Format: CIM - 4 digits - 4 digits - optionalCode
                let finalCode = user.cardCode || '---';
                if (user.optionalCode && user.optionalCode.trim() !== '') {
                    const parts = user.cardCode.split('-');
                    const p1 = parts[1] ? parts[1].substring(0, 4) : '0000';
                    const p2 = parts[2] ? parts[2].substring(0, 4) : '0000';
                    finalCode = `CIM - ${p1} - ${p2} - ${user.optionalCode}`;
                }
                document.getElementById('displayCardCode').textContent = finalCode;

                // Link to back of card
                document.getElementById('backCardLink').href = `card-back-en.html?code=${cardCode}`;

                // Display actual user values
                const valuesContainer = document.getElementById('displayValues');
                valuesContainer.innerHTML = '';
                if (user.values && user.values.length > 0) {
                    user.values.forEach(v => {
                        const div = document.createElement('div');
                        div.className = 'value-item';
                        div.textContent = v;
                        valuesContainer.appendChild(div);
                    });
                }

                document.getElementById('cardErrorMessage').style.display = 'none';
                document.getElementById('cardContent').style.display = 'flex';
                document.getElementById('bottomModules').style.display = 'flex';

            } catch (error) {
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = `❌ ${error.message}`;
            }
        }

        function saveCard() {
            const cardElement = document.getElementById('cardContent');
            html2canvas(cardElement, { backgroundColor: '#0a0a0a', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'cultural-id-card-front.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
