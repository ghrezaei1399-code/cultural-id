<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural Identity Card | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        
        /* ===== Real Card Sample ===== */
        .real-card-sample {
            width: 100%; 
            background: #0a0a0a; 
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.1);
            border-radius: 18px; 
            padding: 1.5rem 1rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            gap: 1rem;
            position: relative;
        }
        .rc-header { display: flex; align-items: center; gap: 1rem; width: 100%; justify-content: center; }
        .rc-logo-container { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #d4af37; display: flex; align-items: center; justify-content: center; }
        .rc-logo { width: 40px; height: 40px; object-fit: contain; }
        .rc-title { font-size: 0.9rem; font-weight: 800; color: #d4af37; line-height: 1.3; text-align: left; }
        
        /* ===== Code and QR Section ===== */
        .rc-code-section {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 0.8rem;
            gap: 1rem;
        }
        .rc-code-box {
            flex: 1;
            text-align: center;
        }
        .rc-code { 
            font-family: 'Courier New', monospace; 
            font-size: 1.1rem; 
            color: #f0f0f0; 
            letter-spacing: 1px; 
            font-weight: bold; 
        }
        .qr-container {
            background: white;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #qrcode { width: 60px; height: 60px; }
        .qr-label {
            font-size: 0.55rem;
            color: #0a0a0a;
            margin-top: 2px;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
        }
        
        .rc-values { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            justify-content: center; 
            width: 100%; 
        }
        .rc-tag { 
            background: rgba(212, 175, 55, 0.15); 
            border: 1px solid #d4af37; 
            border-radius: 5px; 
            padding: 4px 10px; 
            font-size: 0.7rem; 
            color: #d4af37; 
            white-space: nowrap; 
            font-weight: 600; 
        }

        .rc-footer {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .hologram-placeholder {
            width: 50px;
            height: 50px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
        }
        .hologram-placeholder img { width: 35px; height: 35px; opacity: 0.9; }

        .btn-group { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        body.dark .btn-primary:hover { background: rgba(255, 255, 255, 0.04); }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover { background: rgba(60, 30, 10, 0.03); transform: scale(1.02); }
        body.dark .btn-secondary:hover { background: rgba(255, 255, 255, 0.03); }
        
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        @font-face { font-family: 'Vazir'; src: local('Vazir'), local('IRANSans'); }
    </style>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>🪪 Your Cultural ID</h1>
        <div class="subtitle">Global Smart Cultural Identity Card</div>

        <div class="real-card-sample">
            <div class="rc-header">
                <div class="rc-logo-container">
                    <img src="assets/logo-en.png" alt="Logo" class="rc-logo" onerror="this.style.display='none'">
                </div>
                <div class="rc-title">Global Smart Cultural<br>Identity Card</div>
            </div>
            
            <!-- Code and QR Section -->
            <div class="rc-code-section">
                <div class="rc-code-box">
                    <div class="rc-code" id="cardCodeDisplay">CIM - .... - .... - ....</div>
                </div>
                <div class="qr-container">
                    <div id="qrcode"></div>
                    <div class="qr-label">View<br>Charter</div>
                </div>
            </div>
            
            <div class="rc-values" id="valuesContainer">
                <!-- Values will be loaded here -->
            </div>

            <div class="rc-footer">
                <div class="hologram-placeholder">
                    <img src="assets/hologram.png" alt="Hologram" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a href="index-en.html" class="btn btn-primary">↩ Back to Home</a>
            <a href="edit-en.html" class="btn btn-secondary">✏️ Edit Info</a>
        </div>

        <div class="note">
            🔒 Completely Anonymous • No Personal Info • Only Cultural Data
        </div>
    </div>

    <script>
        // ===== Theme =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== Load Card Data =====
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            
            if (!code) {
                document.querySelector('.container').innerHTML = '<h2 style="text-align:center; color:red;">Card Code Not Found!</h2>';
                return;
            }

            // Generate QR Code linking to "About Project" page
            const qrUrl = window.location.origin + '/about-en.html';
            new QRCode(document.getElementById("qrcode"), {
                text: qrUrl,
                width: 60,
                height: 60,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Fetch user data from API to display values and full code
            fetch(`/api/get-user?code=${encodeURIComponent(code)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.user) {
                        // Display full code (including optional code if exists)
                        const displayElement = document.getElementById('cardCodeDisplay');
                        if (data.user.displayCode) {
                            displayElement.textContent = data.user.displayCode;
                        } else {
                            displayElement.textContent = code.replace(/-/g, ' - ');
                        }

                        // Display cultural values
                        if (data.user.values) {
                            const container = document.getElementById('valuesContainer');
                            container.innerHTML = '';
                            data.user.values.forEach(val => {
                                if (val) {
                                    const span = document.createElement('span');
                                    span.className = 'rc-tag';
                                    span.textContent = val;
                                    container.appendChild(span);
                                }
                            });
                        }
                    } else {
                        // If user not found, at least show the URL code
                        document.getElementById('cardCodeDisplay').textContent = code.replace(/-/g, ' - ');
                    }
                })
                .catch(err => {
                    console.error('Error loading user data:', err);
                    document.getElementById('cardCodeDisplay').textContent = code.replace(/-/g, ' - ');
                });
        });
    </script>
</body>
</html>
