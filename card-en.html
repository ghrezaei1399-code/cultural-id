<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural ID Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f0f0f0;
        }
        
        /* Card Container: Vertical, centered, golden borders */
        .card-container {
            width: 340px;
            min-height: 520px;
            background: #0a0a0a;
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 1.5rem 1.2rem;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.2rem;
            position: relative;
        }
        
        /* Logo: Top, larger, golden circle, transparent bg */
        .logo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 10px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        
        .card-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: transparent !important;
        }
        
        .card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            line-height: 1.4;
            letter-spacing: 0.5px;
        }
        
        /* Code Box */
        .card-code-box {
            width: 100%;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 0.9rem;
            text-align: center;
        }
        
        .optional-code-formatted {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.15rem;
            color: #f0f0f0;
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        
        /* Values Section: Compact, centered */
        .values-section {
            width: 100%;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 0.8rem;
        }
        
        .values-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        
        .value-item {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.7rem;
            color: #d4af37;
            white-space: nowrap;
            font-weight: 600;
        }
        
        /* Hologram: Bottom, golden box */
        .hologram-box {
            width: 65px;
            height: 65px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            margin-top: auto;
        }
        
        .hologram {
            width: 42px;
            height: 42px;
            opacity: 0.9;
        }
        
        /* Bottom Modules */
        .bottom-modules {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1.5rem;
            width: 340px;
            align-items: center;
        }
        
        /* Beautiful Buttons */
        .action-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 50%, #b8962e 100%);
            color: #0a0a0a;
            border: 1px solid #f9d976;
            border-radius: 12px;
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: left 0.6s;
        }
        
        .action-btn:hover::before {
            left: 100%;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6), inset 0 1px 0 rgba(255,255,255,0.4);
        }
        
        /* Notice Box */
        .notice-box {
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
        }
        
        .notice-text {
            font-size: 0.8rem;
            color: #f0f0f0;
            line-height: 1.6;
        }
        
        .notice-text a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed #d4af37;
            transition: all 0.3s;
        }
        
        .notice-text a:hover {
            color: #f4d03f;
            border-bottom-style: solid;
        }
        
        /* Error & Loading */
        .message-box {
            display: none;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            max-width: 340px;
            width: 100%;
        }
        
        .message-box.error {
            display: block;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #dc2626;
            color: #dc2626;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #d4af37;
            font-weight: 600;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">⏳ Loading Card Data...</div>

    <div class="card-container" id="cardContent">
        <!-- Logo at Top -->
        <div class="logo-container">
            <img src="assets/logo-en.png" alt="Logo" class="card-logo" onerror="this.style.display='none'">
        </div>
        
        <div class="card-title">Global Smart Cultural Identity Card</div>

        <!-- Single Code Box with CIM format -->
        <div class="card-code-box">
            <div class="optional-code-formatted" id="displayOptionalCode">---</div>
        </div>

        <!-- Compact Values Section -->
        <div class="values-section">
            <div class="values-list" id="displayValues"></div>
        </div>

        <!-- Hologram at Bottom -->
        <div class="hologram-box">
            <img src="assets/hologram.png" alt="Hologram" class="hologram" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- Bottom Modules -->
    <div class="bottom-modules" id="bottomModules" style="display: none;">
        <button class="action-btn" onclick="window.location.href='index.html'">
            <span>↩</span> Back to Main Page
        </button>
        <button class="action-btn" onclick="saveCard()">
            <span>💾</span> Save Card
        </button>
        
        <!-- Notice Box -->
        <div class="notice-box">
            <div class="notice-text">
                If you are among the first 200 people, return to the <a href="index.html">main site page</a> and upload your achievement.
            </div>
        </div>
    </div>

    <div class="message-box error" id="errorMessage">
        ❌ Card code not found or invalid.
    </div>

    <script>
        // Get Card Code from URL or LocalStorage
        function getCardCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('code') || localStorage.getItem('culturalCardCode');
        }

        const cardCode = getCardCode();

        async function loadCardData() {
            if (!cardCode) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = '❌ Card code not found. Please register first.';
                return;
            }

            try {
                // Fetching from GitHub as per original English version logic
                const response = await fetch(
                    `https://api.github.com/repos/ghrezaei1399-code/cultural-id/contents/data/active/${cardCode}.json`,
                    { headers: { 'Accept': 'application/vnd.github.v3+json' } }
                );

                if (!response.ok) {
                    throw new Error(response.status === 404 ? 'Card not found.' : 'Error loading data.');
                }

                const data = await response.json();
                const decoded = atob(data.content);
                const content = decodeURIComponent(decoded);
                const user = JSON.parse(content);

                // Generate CIM format with random numbers as requested
                const r1 = Math.floor(1000 + Math.random() * 9000);
                const r2 = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('displayOptionalCode').textContent = `CIM - ${r1} - ${r2} - 66666`;

                // Render 5 symbolic cultural values in English
                const valuesContainer = document.getElementById('displayValues');
                valuesContainer.innerHTML = '';
                const hardcodedValues = [
                    'Indigenous Values',
                    'Individual Knowledge',
                    'Collective Cooperation',
                    'Cultural Diversity',
                    'Global Peace'
                ];
                
                hardcodedValues.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'value-item';
                    div.textContent = v;
                    valuesContainer.appendChild(div);
                });

                // Show card, hide loading/error
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('cardContent').style.display = 'flex';
                document.getElementById('bottomModules').style.display = 'flex';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = `❌ ${error.message}`;
            }
        }

        // Save Card as Image
        function saveCard() {
            const cardElement = document.getElementById('cardContent');
            html2canvas(cardElement, {
                backgroundColor: '#0a0a0a',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `cultural-id-card-${cardCode}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
