<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Card Back | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 { color: #8a6d1f; margin-bottom: 1.5rem; }
        
        /* Card Back Design */
        .card-back {
            background: #f8f9fa;
            border: 2px dashed #d4af37;
            border-radius: 16px;
            padding: 2rem 1rem;
            position: relative;
        }
        
        .back-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .code-display {
            flex: 1;
            text-align: left;
            padding-right: 1rem;
        }
        .code-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
        .cim-code {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2a1a0a;
            display: inline-block;
        }
        
        .qr-box {
            width: 80px;
            height: 80px;
            background: white;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #555;
            line-height: 1.6;
        }
        
        .btn-back {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background: #d4af37;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>🪪 Cultural Identity Card Back</h2>
        
        <div class="card-back">
            <div class="back-row">
                <div class="code-display">
                    <div class="code-label">Unique Cultural ID:</div>
                    <div class="cim-code" id="cardCode">CIM - .... - .... - ....</div>
                </div>
                <div class="qr-box" id="qrcode"></div>
            </div>
            
            <div class="note">
                This card belongs to the Global Smart Cultural Identity Network.<br>
                Scan QR Code to view the Charter and Theoretical Documents.
            </div>
        </div>

        <a href="card-en.html" class="btn-back">↩ Back to Card Front</a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code') || 'CIM-0000-0000-0000';
            
            document.getElementById('cardCode').textContent = code.replace(/-/g, ' - ');
            
            // Generate QR Code linking to "About Project"
            const qrUrl = window.location.origin + '/about-en.html';
            new QRCode(document.getElementById("qrcode"), {
                text: qrUrl,
                width: 72,
                height: 72,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
