<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload Achievement | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a3a2a;
            opacity: 0.5;
        }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder {
            color: #908070;
        }
        .upload-zone {
            border: 2px dashed rgba(60, 30, 10, 0.02);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .upload-zone { border-color: rgba(255, 255, 255, 0.02); }
        .upload-zone:hover { background: rgba(255, 255, 255, 0.01); }
        .upload-zone .icon { font-size: 2.5rem; display: block; margin-bottom: 0.3rem; }
        .upload-zone p { font-size: 0.85rem; opacity: 0.6; }
        .upload-zone .small { font-size: 0.7rem; opacity: 0.3; margin-top: 0.2rem; }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover {
            background: rgba(60, 30, 10, 0.04);
            transform: scale(1.02);
        }
        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover {
            background: rgba(60, 30, 10, 0.03);
            transform: scale(1.02);
        }
        body.dark .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50, 200, 50, 0.05);
            border: 1px solid rgba(50, 200, 50, 0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success {
            color: #80b080;
            background: rgba(50, 200, 50, 0.01);
            border-color: rgba(50, 200, 50, 0.01);
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error {
            color: #b08080;
            background: rgba(200, 50, 50, 0.01);
            border-color: rgba(200, 50, 50, 0.01);
        }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
        .hidden { display: none; }
        .file-name { font-size: 0.8rem; opacity: 0.6; margin-top: 0.3rem; display: block; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>📤 Upload Achievement</h1>
        <div class="subtitle">Gallery of First 200 Ambassadors</div>

        <div id="messageBox" class="message-box"></div>

        <div class="upload-zone" id="uploadZone">
            <span class="icon">📁</span>
            <p>Drag & drop your file here</p>
            <p class="small">or click to select</p>
            <p class="small" style="margin-top:0.5rem;">Allowed formats: JPG, PNG, MP4, PDF (Max 10MB)</p>
            <span class="file-name" id="fileName"></span>
        </div>

        <form id="uploadForm">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g. Peace Painting" required />
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" placeholder="Describe your achievement..."></textarea>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="category" placeholder="e.g. Art, Science, Culture" />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">📤 Upload</button>
                <a href="index.html" class="btn btn-secondary">↩ Back</a>
            </div>
        </form>

        <div class="note">
            🏆 Only first 200 ambassadors can upload. Featured works will appear in the main gallery.
        </div>
    </div>

  <script>
    // ... (کد تم و آپلود فایل بدون تغییر) ...
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ در حال ارسال...';

        try {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value.trim();
            const fileName = document.getElementById('uploadZone').dataset.fileName;

            if (!title || !fileName) throw new Error('لطفاً عنوان و فایل را انتخاب کنید.');

            // دریافت کد از URL یا localStorage
            const urlParams = new URLSearchParams(window.location.search);
            const cardCode = urlParams.get('code') || localStorage.getItem('culturalCardCode');
            
            if (!cardCode) throw new Error('کد کارت یافت نشد. لطفاً ابتدا وارد شوید.');

            const achievementData = { title, description, category, fileName };

            const response = await fetch('/api/upload-achievement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cardCode, achievement: achievementData })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error);

            alert('✅ فایل شما ارسال شد و پس از تایید ادمین در گالری نمایش داده می‌شود.');
            window.location.href = 'index.html';

        } catch (error) {
            alert('❌ ' + error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = '📤 آپلود';
        }
    });
</script> 
</body>
</html>
