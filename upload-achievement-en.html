<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload Achievement | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/نماد صلح.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #2a2a3a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-zone .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .upload-zone p {
            font-size: 0.9rem;
            color: #2a2a3a;
            opacity: 0.7;
        }

        .upload-zone .small {
            font-size: 0.75rem;
            opacity: 0.4;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0a0a1a;
            margin-bottom: 0.3rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 0.95rem;
            color: #0a0a1a;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a4a5a;
            opacity: 0.5;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.15);
            color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #3a3a4a;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #0a0a1a;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1rem;
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload Achievement</h1>
        <div class="subtitle">Gallery of First 200 Ambassadors</div>

        <div class="upload-zone">
            <span class="icon">📁</span>
            <p>Drag & drop your file here</p>
            <p class="small">or click to select</p>
            <p class="small" style="margin-top:0.5rem; opacity:0.3;">Allowed formats: JPG, PNG, MP4, PDF (Max 10MB)</p>
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" placeholder="e.g. Peace Painting" />
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea placeholder="Describe your achievement..."></textarea>
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" placeholder="e.g. Art, Science, Culture" />
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">📤 Upload</button>
            <a href="index.html" class="btn btn-back">↩ Back</a>
        </div>

        <div class="note">
            🏆 Only first 200 ambassadors can upload. Featured works will appear in the main gallery.
        </div>
    </div>
</body>
</html>
