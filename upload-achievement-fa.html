<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>آپلود دستاورد | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px); /* اصلاح حیاتی برای نمایش صحیح */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #4a3a2a; opacity: 0.5; }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder { color: #908070; }
        
        .upload-zone {
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
        }
        body.dark .upload-zone { border-color: rgba(255, 255, 255, 0.1); }
        .upload-zone:hover { background: rgba(212, 175, 55, 0.05); border-color: #d4ac0d; }
        .upload-zone .icon { font-size: 2.5rem; display: block; margin-bottom: 0.3rem; }
        .upload-zone p { font-size: 0.85rem; opacity: 0.8; }
        .upload-zone .small { font-size: 0.7rem; opacity: 0.5; margin-top: 0.2rem; }
        
        .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        body.dark .btn-primary:hover { background: rgba(255, 255, 255, 0.04); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover { background: rgba(60, 30, 10, 0.03); transform: scale(1.02); }
        body.dark .btn-secondary:hover { background: rgba(255, 255, 255, 0.03); }
        
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50, 200, 50, 0.05);
            border: 1px solid rgba(50, 200, 50, 0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success { color: #80b080; background: rgba(50, 200, 50, 0.01); }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0, 0, 0, 0.05); }
        .theme-toggle:hover { transform: scale(1.1); }
        
        @font-face { font-family: 'Vazir'; src: local('Vazir'), local('IRANSans'); }
        .hidden { display: none !important; }
        .file-name { font-size: 0.85rem; color: #2874a6; margin-top: 0.5rem; display: block; font-weight: bold; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container" id="mainContainer">
        <h1>📤 آپلود دستاورد</h1>
        <div class="subtitle">گالری دستاوردهای ۲۰۰ سفیر اول</div>

        <div id="messageBox" class="message-box"></div>

        <!-- بخش آپلود فایل -->
        <div class="upload-zone" id="uploadZone">
            <span class="icon">📁</span>
            <p>فایل خود را اینجا بکشید و رها کنید</p>
            <p class="small">یا کلیک کنید تا انتخاب کنید</p>
            <p class="small" style="margin-top:0.5rem;">فرمت‌های مجاز: JPG, PNG, MP4, PDF (حداکثر ۱۰ مگابایت)</p>
            <span class="file-name" id="fileNameDisplay"></span>
            <!-- اینپوت مخفی برای انتخاب فایل -->
            <input type="file" id="fileInput" class="hidden" accept=".jpg,.jpeg,.png,.pdf,.mp4" />
        </div>

        <form id="uploadForm">
            <div class="form-group">
                <label>عنوان اثر</label>
                <input type="text" id="title" placeholder="مثلاً: نقاشی صلح" required />
            </div>

            <div class="form-group">
                <label>توضیحات</label>
                <textarea id="description" placeholder="درباره‌ی اثر خود توضیح دهید..."></textarea>
            </div>

            <div class="form-group">
                <label>دسته‌بندی</label>
                <input type="text" id="category" placeholder="مثلاً: هنری, علمی, فرهنگی" />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">📤 ارسال برای تایید</button>
                <a href="register-fa.html" class="btn btn-secondary">↩ بازگشت به ثبت‌نام</a>
            </div>
        </form>

        <div class="note">
            🏆 فقط ۲۰۰ سفیر اول امکان آپلود دارند. آثار برتر پس از تایید ادمین در گالری اصلی نمایش داده می‌شوند.
        </div>
    </div>

    <script>
        // Theme Toggle Logic
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', function() {
            body.classList.toggle('dark');
            toggle.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        });

        // Security Check & File Handling
        document.addEventListener('DOMContentLoaded', function() {
            // 1. بررسی امنیت (۲۰۰ نفر اول)
            const urlParams = new URLSearchParams(window.location.search);
            const cardCode = urlParams.get('code') || localStorage.getItem('userCardCode');
            
            if (!cardCode) {
                document.getElementById('mainContainer').innerHTML = `
                    <div style="text-align:center; padding:2rem;">
                        <h1>⛔ دسترسی محدود</h1>
                        <p>این بخش مخصوص ۲۰۰ عضو پیشرو است. لطفاً ابتدا ثبت‌نام کنید و کارت خود را دریافت نمایید.</p>
                        <a href="register-fa.html" class="btn btn-primary" style="display:inline-block; margin-top:1rem; text-decoration:none;">ورود به صفحه ثبت‌نام</a>
                    </div>`;
                return;
            }

            // 2. مدیریت انتخاب فایل
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileNameDisplay = document.getElementById('fileNameDisplay');

            uploadZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    fileNameDisplay.textContent = `فایل انتخاب شده: ${this.files[0].name}`;
                    uploadZone.style.borderColor = '#2874a6';
                }
            });
        });

        // Form Submission Logic
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ارسال...';

            try {
                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const category = document.getElementById('category').value.trim();
                const fileInput = document.getElementById('fileInput');
                
                if (!title || !fileInput.files[0]) throw new Error('لطفاً عنوان و فایل را انتخاب کنید.');

                // دریافت کد کاربر
                const urlParams = new URLSearchParams(window.location.search);
                const cardCode = urlParams.get('code') || localStorage.getItem('userCardCode');
                
                if (!cardCode) throw new Error('کد کارت یافت نشد. لطفاً مجدداً وارد شوید.');

                // شبیه‌سازی ارسال به سرور (در نسخه واقعی باید FormData استفاده شود)
                // const formData = new FormData();
                // formData.append('file', fileInput.files[0]);
                // formData.append('cardCode', cardCode);
                
                // فعلاً برای تست موفقیت‌آمیز بودن:
                await new Promise(resolve => setTimeout(resolve, 1500));

                messageBox.className = 'message-box success';
                messageBox.textContent = '✅ دستاورد شما با موفقیت ارسال شد و پس از تایید ادمین در گالری نمایش داده می‌شود.';
                submitBtn.textContent = '✅ ارسال شد';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                messageBox.className = 'message-box error';
                messageBox.textContent = '❌ ' + error.message;
                messageBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 ارسال برای تایید';
            }
        });
    </script>
</body>
</html>
