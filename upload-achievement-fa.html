<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>آپلود دستاورد | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg'); /* پس‌زمینه اصلی حفظ شده */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px); /* افکت شیشه‌ای کامل */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        
        /* استایل‌های فرم */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea,
        body.dark .form-group select {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        
        /* باکس ورود کد */
        .code-check-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 24px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            text-align: center;
            margin-top: 2rem;
        }
        .code-input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(30, 10, 0, 0.1);
            background: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: #1a0a0a;
        }
        
        /* ناحیه آپلود فایل */
        .upload-zone {
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.01);
        }
        .upload-zone:hover { background: rgba(212, 175, 55, 0.05); border-color: #d4ac0d; }
        .upload-zone .icon { font-size: 2.5rem; display: block; margin-bottom: 0.3rem; }
        
        .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0, 0, 0, 0.05); }
        
        @font-face { font-family: 'Vazir'; src: local('Vazir'), local('IRANSans'); }
        .hidden { display: none !important; }
        .error-msg { color: #a00; margin-top: 1rem; font-size: 0.9rem; display: none; text-align: center; }
        .file-name { font-size: 0.85rem; color: #2874a6; margin-top: 0.5rem; display: block; font-weight: bold; }
        
        /* استایل پیام وضعیت */
        .status-msg {
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
        .status-msg.success { background: rgba(0,200,0,0.1); color: #006400; border: 1px solid #006400; }
        .status-msg.error { background: rgba(200,0,0,0.1); color: #8b0000; border: 1px solid #8b0000; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <!-- بخش ۱: بررسی کد عضویت -->
        <div id="codeCheckSection">
            <h1>🔐 احراز هویت سفیر</h1>
            <div class="subtitle">برای دسترسی به گالری دستاوردها، کد عضویت خود را وارد کنید</div>
            
            <div class="code-check-box">
                <input type="text" id="memberCode" class="code-input" placeholder="کد عضویت (مثلاً: A1B2C)" />
                <button onclick="verifyCode()" class="btn btn-primary" style="width:100%">بررسی و ورود</button>
                <div id="errorMsg" class="error-msg">❌ کد نامعتبر است یا شما جزو ۲۰۰ نفر اول نیستید.</div>
            </div>
            <div class="note">
                این بخش فقط برای ۲۰۰ سفیر اول فعال است.
            </div>
        </div>

        <!-- بخش ۲: فرم آپلود (بعد از تایید کد نمایش داده می‌شود) -->
        <div id="uploadSection" class="hidden">
            <h1>📤 آپلود دستاورد فرهنگی</h1>
            <div class="subtitle">گالری جهانی هویت هوشمند</div>

            <div id="statusBox" class="status-msg"></div>

            <div class="upload-zone" id="dropZone">
                <span class="icon">📂</span>
                <p>فایل خود را اینجا بکشید یا کلیک کنید</p>
                <p class="small" style="font-size:0.7rem; opacity:0.5;">فرمت‌های مجاز: JPG, PNG, PDF, MP4</p>
                <input type="file" id="fileInput" class="hidden" />
                <span id="fileName" class="file-name"></span>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label>عنوان اثر</label>
                    <input type="text" id="title" placeholder="مثلاً: مقاله صلح پایدار" required />
                </div>

                <div class="form-group">
                    <label>توضیحات کوتاه</label>
                    <textarea id="description" rows="4" placeholder="درباره‌ی اثر خود توضیح دهید..."></textarea>
                </div>

                <div class="form-group">
                    <label>دسته‌بندی</label>
                    <select id="category">
                        <option value="art">هنری</option>
                        <option value="science">علمی و پژوهشی</option>
                        <option value="cultural">فرهنگی و اجتماعی</option>
                        <option value="media">رسانه و ویدئو</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">📤 ارسال برای تایید</button>
                    <a href="index.html" class="btn btn-secondary">↩ بازگشت</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Theme Logic
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark'); toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            toggle.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
        });

        // File Handling
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if(e.target.files[0]) document.getElementById('fileName').textContent = e.target.files[0].name;
        });

        // Verification Logic
        function verifyCode() {
            const code = document.getElementById('memberCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            // در نسخه نهایی، این کد باید با API چک شود. فعلاً برای تست:
            if (code.length > 3) {
                document.getElementById('codeCheckSection').classList.add('hidden');
                document.getElementById('uploadSection').classList.remove('hidden');
                localStorage.setItem('verifiedCode', code);
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Upload Logic (Connected to your API)
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const file = fileInput.files[0];
            
            btn.disabled = true;
            btn.textContent = '⏳ در حال ارسال...';
            statusBox.style.display = 'none';

            try {
                let fileData = '';
                if (file) {
                    // تبدیل فایل به Base64 برای ارسال در JSON
                    fileData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                }

                const cardCode = localStorage.getItem('verifiedCode') || document.getElementById('memberCode').value;

                // ساخت آبجکت دقیقاً مطابق با نیاز upload-achievement.js شما
                const achievementData = {
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    category: document.getElementById('category').value,
                    fileName: file ? file.name : 'No File',
                    fileData: fileData
                };

                const response = await fetch('/api/upload-achievement', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        cardCode: cardCode, 
                        achievement: achievementData 
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'خطا در ارتباط با سرور');
                }

                statusBox.className = 'status-msg success';
                statusBox.textContent = '✅ دستاورد شما با موفقیت ثبت شد و پس از تایید ادمین نمایش داده می‌شود.';
                statusBox.style.display = 'block';
                btn.textContent = '✅ ارسال شد';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                statusBox.className = 'status-msg error';
                statusBox.textContent = '❌ ' + error.message;
                statusBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '📤 ارسال مجدد';
            }
        });
    </script>
</body>
</html>
