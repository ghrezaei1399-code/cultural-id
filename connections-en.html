<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural Connections | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            font-size: 1.8rem; font-weight: 800; color: #2a1a0a;
            text-align: center; margin-bottom: 0.5rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center; font-size: 0.9rem; color: #6a5a3a;
            opacity: 0.8; margin-bottom: 2rem;
        }
        body.dark .subtitle { color: #c8b890; }
        
        .request-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }
        body.dark .request-card {
            background: rgba(74, 58, 40, 0.7);
            border-color: rgba(212, 175, 55, 0.5);
        }
        .request-card:hover { transform: translateY(-2px); }
        .request-card h3 {
            font-size: 1.1rem; color: #8a6d1f; margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
        }
        body.dark .request-card h3 { color: #f9e79f; }
        .request-card p {
            font-size: 0.9rem; color: #3a2a1a; margin-bottom: 0.5rem; line-height: 1.6;
        }
        body.dark .request-card p { color: #e8dcc0; }
        .request-card .meta {
            font-size: 0.75rem; color: #6a5a3a; opacity: 0.7;
        }
        body.dark .request-card .meta { color: #c8b890; }
        
        .requester-email-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #1e7a1e;
            font-weight: 700;
        }
        body.dark .requester-email-status { background: rgba(40, 167, 69, 0.15); color: #82e0aa; }
        .requester-email-status.no-email {
            background: rgba(220, 53, 69, 0.1);
            color: #a93226;
        }
        body.dark .requester-email-status.no-email { background: rgba(220, 53, 69, 0.15); color: #f1948a; }

        .matches-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px dashed rgba(212, 175, 55, 0.3);
        }
        .matches-title { font-size: 1rem; font-weight: 800; color: #2874a6; margin-bottom: 1rem; }
        body.dark .matches-title { color: #85c1e9; }
        
        .match-item {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        body.dark .match-item { background: rgba(212, 175, 55, 0.05); border-color: rgba(212, 175, 55, 0.15); }
        .match-info { flex: 1; min-width: 200px; }
        .match-code { font-family: 'Courier New', monospace; font-size: 0.9rem; color: #8a6d1f; font-weight: 700; }
        body.dark .match-code { color: #f9e79f; }
        .match-details { font-size: 0.75rem; color: #6a5a3a; margin-top: 0.3rem; }
        body.dark .match-details { color: #c8b890; }
        
        .match-score {
            background: linear-gradient(135deg, #d4af37, #f9e79f);
            color: #2a1a0a;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            min-width: 60px;
            text-align: center;
        }
        body.dark .match-score { background: linear-gradient(135deg, #8a6d1f, #d4af37); color: #fff; }
        
        .email-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-weight: 700;
            margin-top: 0.5rem;
            display: inline-block;
        }
        .email-yes { background: rgba(40, 167, 69, 0.2); color: #1e7a1e; }
        body.dark .email-yes { background: rgba(40, 167, 69, 0.15); color: #82e0aa; }
        .email-no { background: rgba(220, 53, 69, 0.2); color: #a93226; }
        body.dark .email-no { background: rgba(220, 53, 69, 0.15); color: #f1948a; }

        .hidden-email { display: none; margin-top: 0.5rem; font-size: 0.8rem; color: #2874a6; font-family: monospace; }
        body.dark .hidden-email { color: #85c1e9; }

        .btn-group { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn {
            padding: 0.7rem 1.5rem; border-radius: 30px; font-weight: 700;
            font-size: 0.9rem; border: none; cursor: pointer; transition: all 0.3s;
        }
        .btn-approve { background: rgba(39, 174, 96, 0.2); color: #1e7a1e; }
        body.dark .btn-approve { background: rgba(39, 174, 96, 0.2); color: #82e0aa; }
        .btn-approve:hover { background: rgba(39, 174, 96, 0.3); }
        .btn-reject { background: rgba(220, 80, 60, 0.2); color: #a93226; }
        body.dark .btn-reject { background: rgba(220, 80, 60, 0.2); color: #f1948a; }
        .btn-reject:hover { background: rgba(220, 80, 60, 0.3); }
        .btn-show-email { background: rgba(40, 167, 69, 0.2); color: #1e7a1e; font-size: 0.8rem; padding: 0.4rem 1rem; margin-top: 0.5rem; }
        body.dark .btn-show-email { background: rgba(40, 167, 69, 0.15); color: #82e0aa; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-back {
            display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem;
            background: rgba(212, 175, 55, 0.2); color: #8a6d1f;
            border-radius: 30px; text-decoration: none; font-weight: 700;
            transition: all 0.3s;
        }
        body.dark .btn-back { background: rgba(212, 175, 55, 0.2); color: #f9e79f; }
        .btn-back:hover { transform: scale(1.05); }
        .empty-state { text-align: center; padding: 3rem; color: #6a5a3a; opacity: 0.6; }
        body.dark .empty-state { color: #c8b890; }
        
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }
        .status-pending { background: rgba(255, 200, 50, 0.2); color: #8a7a0a; }
        body.dark .status-pending { background: rgba(255, 200, 50, 0.15); color: #f9e79f; }
        .status-approved { background: rgba(50, 200, 50, 0.2); color: #0a6a0a; }
        body.dark .status-approved { background: rgba(50, 200, 50, 0.15); color: #82e0aa; }
        .status-rejected { background: rgba(200, 50, 50, 0.2); color: #6a1a1a; }
        body.dark .status-rejected { background: rgba(200, 50, 50, 0.15); color: #f1948a; }
        
        .connections-count {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #8a6d1f;
        }
        body.dark .connections-count { background: rgba(212, 175, 55, 0.1); color: #f9e79f; }
    </style>
</head>
<body>
<div class="container">
    <h1>🤝 Cultural Connection Requests</h1>
    <div class="subtitle">Requests pending admin review</div>

    <div id="requestsList"></div>

    <a href="admin.html" class="btn-back">↩ Back to Admin Panel</a>
</div>

<script>
    async function loadRequests() {
        try {
            const response = await fetch('/api/get-connection-requests');
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Error loading requests');
            }

            const requestsList = document.getElementById('requestsList');

            if (data.requests.length === 0) {
                requestsList.innerHTML = '<div class="empty-state">No connection requests found</div>';
                return;
            }

            requestsList.innerHTML = data.requests.map(req => {
                // Requester email status
                const reqEmailStatus = req.senderEmail 
                    ? `<div class="requester-email-status">✅ Requester has email: ${req.senderEmail}</div>`
                    : `<div class="requester-email-status no-email">❌ Requester has no registered email (email cannot be sent)</div>`;

                // ===== Change: Display connections list =====
                const connectionsHtml = req.connections && req.connections.length > 0
                    ? req.connections.map(email => `
                        <div class="match-item" style="border-color: #27ae60; background: rgba(39, 174, 96, 0.05);">
                            <div class="match-info">
                                <div style="font-family: monospace; font-size: 0.9rem; color: #1e7a1e;">📧 ${email}</div>
                            </div>
                            <span class="email-badge email-yes">✅ Has Email</span>
                        </div>
                    `).join('')
                    : '<div class="empty-state" style="padding:0.5rem;">No like-minded people with registered emails found</div>';

                // ===== Cultural matches list with more details =====
                const matchesHtml = req.culturalMatches && req.culturalMatches.length > 0 
                    ? req.culturalMatches.map((match, idx) => `
                        <div class="match-item">
                            <div class="match-info">
                                <div class="match-code">${match.displayCode}</div>
                                <div class="match-details">🌍 ${match.country || 'Unknown'} • Rank #${match.rank}</div>
                                <span class="email-badge ${match.hasEmail ? 'email-yes' : 'email-no'}">
                                    ${match.hasEmail ? '✅ Has Email' : '❌ No Email'}
                                </span>
                                ${match.hasEmail ? `<button class="btn btn-show-email" onclick="toggleEmail('email-${req.fileName}-${idx}')">👁️ Show Email</button>
                                <div id="email-${req.fileName}-${idx}" class="hidden-email">${match.email}</div>` : ''}
                            </div>
                            <div class="match-score">${match.similarityScore}% Priority Match</div>
                        </div>
                    `).join('')
                    : '<div class="empty-state" style="padding:0.5rem;">No cultural matches with similar priorities found</div>';

                // ===== Display connections count =====
                const connectionsCount = req.connections ? req.connections.length : 0;
                const connectionsInfo = connectionsCount > 0 
                    ? `<span class="connections-count">👥 ${connectionsCount} like-minded with email</span>`
                    : '';

                // ===== Request status =====
                const statusClass = req.status === 'approved' ? 'status-approved' : 
                                   req.status === 'rejected' ? 'status-rejected' : 'status-pending';
                const statusText = req.status === 'approved' ? '✅ Approved' : 
                                  req.status === 'rejected' ? '❌ Rejected' : '⏳ Pending';

                return `
                    <div class="request-card">
                        <h3>Card Code: ${req.senderCode}</h3>
                        <p><strong>Request Type:</strong> ${req.type === 'connection' ? 'Connect with cultural kin' : req.type}</p>
                        ${req.reason ? `<p><strong>Reason:</strong> ${req.reason}</p>` : ''}
                        ${req.description ? `<p><strong>Description:</strong> ${req.description}</p>` : ''}
                        <div class="meta">Date: ${new Date(req.createdAt || req.requestDate).toLocaleString('en-US')}</div>
                        <div style="margin-top:0.5rem;">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            ${connectionsInfo}
                        </div>
                        
                        ${reqEmailStatus}
                        
                        <!-- ===== List of like-minded with email ===== -->
                        <div class="matches-section" style="border-top-color: #27ae60;">
                            <div class="matches-title" style="color: #27ae60;">📧 Like-minded Emails (${connectionsCount} people):</div>
                            ${connectionsHtml}
                        </div>
                        
                        <!-- ===== Full matches list ===== -->
                        <div class="matches-section">
                            <div class="matches-title">🎯 Full Matches List (Based on Priorities):</div>
                            ${matchesHtml}
                        </div>

                        ${req.status === 'pending' ? `
                        <div class="btn-group">
                            <button class="btn btn-approve" onclick="handleRequest('${req.fileName}', 'approve')">✓ Approve & Send List</button>
                            <button class="btn btn-reject" onclick="handleRequest('${req.fileName}', 'reject')">✗ Reject Request</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error('Error:', error);
            document.getElementById('requestsList').innerHTML = 
                `<div class="empty-state" style="color: red;">Error: ${error.message}</div>`;
        }
    }

    function toggleEmail(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    async function handleRequest(fileName, action) {
        if (!confirm(`Are you sure you want to ${action === 'approve' ? 'approve' : 'reject'} this request?`)) return;

        const buttons = event.target.parentElement.querySelectorAll('button');
        buttons.forEach(btn => btn.disabled = true);

        try {
            const response = await fetch('/api/approve-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileName, action })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Error processing request');
            }

            alert(result.message);
            loadRequests();

        } catch (error) {
            alert('Error: ' + error.message);
            buttons.forEach(btn => btn.disabled = false);
        }
    }

    loadRequests();
</script>
</body>
</html>
