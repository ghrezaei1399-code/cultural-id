<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cultural Connections | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            font-size: 1.8rem; font-weight: 800; color: #2a1a0a;
            text-align: center; margin-bottom: 0.5rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center; font-size: 0.9rem; color: #6a5a3a;
            opacity: 0.8; margin-bottom: 2rem;
        }
        body.dark .subtitle { color: #c8b890; }
        .request-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }
        body.dark .request-card {
            background: rgba(74, 58, 40, 0.7);
            border-color: rgba(212, 175, 55, 0.5);
        }
        .request-card:hover { transform: translateY(-2px); }
        .request-card h3 {
            font-size: 1.1rem; color: #8a6d1f; margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
        }
        body.dark .request-card h3 { color: #f9e79f; }
        .request-card p {
            font-size: 0.9rem; color: #3a2a1a; margin-bottom: 0.5rem; line-height: 1.6;
        }
        body.dark .request-card p { color: #e8dcc0; }
        .request-card .meta {
            font-size: 0.75rem; color: #6a5a3a; opacity: 0.7;
        }
        body.dark .request-card .meta { color: #c8b890; }
        .btn-group {
            display: flex; gap: 0.5rem; margin-top: 1rem;
        }
        .btn {
            padding: 0.6rem 1.2rem; border-radius: 30px; font-weight: 700;
            font-size: 0.85rem; border: none; cursor: pointer; transition: all 0.3s;
        }
        .btn-approve {
            background: rgba(39, 174, 96, 0.2); color: #1e7a1e;
        }
        body.dark .btn-approve { background: rgba(39, 174, 96, 0.3); color: #82e0aa; }
        .btn-approve:hover { background: rgba(39, 174, 96, 0.3); }
        .btn-reject {
            background: rgba(220, 80, 60, 0.2); color: #a93226;
        }
        body.dark .btn-reject { background: rgba(220, 80, 60, 0.3); color: #f1948a; }
        .btn-reject:hover { background: rgba(220, 80, 60, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-back {
            display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem;
            background: rgba(212, 175, 55, 0.2); color: #8a6d1f;
            border-radius: 30px; text-decoration: none; font-weight: 700;
            transition: all 0.3s;
        }
        body.dark .btn-back { background: rgba(212, 175, 55, 0.3); color: #f9e79f; }
        .btn-back:hover { transform: scale(1.05); }
        .empty-state {
            text-align: center; padding: 3rem; color: #6a5a3a; opacity: 0.6;
        }
        body.dark .empty-state { color: #c8b890; }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }
        .status-pending { background: rgba(255, 200, 50, 0.2); color: #8a7a0a; }
        .status-approved { background: rgba(50, 200, 50, 0.2); color: #0a6a0a; }
        .status-rejected { background: rgba(200, 50, 50, 0.2); color: #6a1a1a; }
    </style>
</head>
<body>
<div class="container">
    <h1>🤝 Cultural Connection Requests</h1>
    <div class="subtitle">Requests pending admin review</div>

    <div id="requestsList"></div>

    <a href="admin.html" class="btn-back">↩ Back to Admin Panel</a>
</div>

<script>
    async function loadRequests() {
        try {
            const response = await fetch('/api/get-connection-requests');
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Error loading requests');
            }

            const requestsList = document.getElementById('requestsList');

            if (data.requests.length === 0) {
                requestsList.innerHTML = '<div class="empty-state">No connection requests found</div>';
                return;
            }

            requestsList.innerHTML = data.requests.map(req => {
                const statusClass = req.status === 'approved' ? 'status-approved' : 
                                   req.status === 'rejected' ? 'status-rejected' : 'status-pending';
                const statusText = req.status === 'approved' ? '✅ Approved' : 
                                  req.status === 'rejected' ? '❌ Rejected' : '⏳ Pending';
                
                const actionButtons = req.status === 'pending' ? `
                    <div class="btn-group">
                        <button class="btn btn-approve" onclick="handleRequest('${req.fileName}', 'approve')">✓ Approve</button>
                        <button class="btn btn-reject" onclick="handleRequest('${req.fileName}', 'reject')"> Reject</button>
                    </div>
                ` : '';

                return `
                    <div class="request-card">
                        <h3>Card Code: ${req.cardCode}</h3>
                        <p><strong>Request Type:</strong> ${req.type === 'connection' ? 'Connect with cultural kin' : req.type}</p>
                        ${req.description ? `<p><strong>Description:</strong> ${req.description}</p>` : ''}
                        <div class="meta">Date: ${new Date(req.requestDate).toLocaleString('en-US')}</div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        ${actionButtons}
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error('Error:', error);
            document.getElementById('requestsList').innerHTML = 
                `<div class="empty-state" style="color: red;">Error: ${error.message}</div>`;
        }
    }

    async function handleRequest(fileName, action) {
        if (!confirm(`Are you sure you want to ${action === 'approve' ? 'approve' : 'reject'} this request?`)) return;

        const buttons = event.target.parentElement.querySelectorAll('button');
        buttons.forEach(btn => btn.disabled = true);

        try {
            const response = await fetch('/api/approve-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileName, action })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Error processing request');
            }

            alert(result.message);
            loadRequests(); // Reload

        } catch (error) {
            alert('Error: ' + error.message);
            buttons.forEach(btn => btn.disabled = false);
        }
    }

    loadRequests();
</script>
</body>
</html>
