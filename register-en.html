<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | Global Smart Cultural Identity Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Vazir', 'IRANSans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/acropolis.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(0px);
            border-radius: 60px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.02);
        }

        .back-module {
            display: inline-block;
            background: rgba(255,255,255,0.02);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #0a1a2a;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.02);
            margin-bottom: 1.5rem;
        }

        .back-module:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(-4px);
        }

        .form-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .form-box h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0a1a2a;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid rgba(0, 0, 0, 0.02);
            padding-bottom: 0.4rem;
            text-align: center;
            text-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0a1a2a;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 8px rgba(255,255,255,0.05);
        }

        .form-group textarea,
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
            resize: vertical;
            min-height: 60px;
            color: #0a1a2a;
        }

        .form-group textarea:focus,
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(26, 42, 74, 0.2);
            outline: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group .hint {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 0.2rem;
            color: #0a1a2a;
        }

        .btn-submit {
            display: inline-block;
            background: rgba(255, 255, 255, 0.02);
            color: #0a1a2a;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: 0.25s ease;
            width: 100%;
            margin-top: 0.5rem;
            text-decoration: none;
            text-align: center;
        }

        .btn-submit:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.02);
        }

        .note {
            font-size: 0.8rem;
            opacity: 0.5;
            text-align: center;
            margin-top: 0.8rem;
            color: #0a1a2a;
        }

        @media (max-width: 768px) {
            .container { padding: 1.5rem 1rem; }
            .form-box { padding: 1.2rem 1rem; }
            .form-box h2 { font-size: 1.2rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="container">

    <a href="index.html" class="back-module">← Back to Home</a>

    <div class="form-box">
        <h2>📝 Register & Get Your ID</h2>

        <div class="form-group">
            <label>🧭 Indigenous Values</label>
            <textarea placeholder="Write your indigenous values..."></textarea>
        </div>

        <div class="form-group">
            <label>📚 Individual Knowledge</label>
            <textarea placeholder="Write your individual knowledge and expertise..."></textarea>
        </div>

        <div class="form-group">
            <label>🤝 Collective Collaboration</label>
            <textarea placeholder="Write about your experiences in collective collaboration..."></textarea>
        </div>

        <div class="form-group">
            <label>🌍 Cultural Diversity</label>
            <textarea placeholder="Your perspective on cultural diversity..."></textarea>
        </div>

        <div class="form-group">
            <label>🕊️ Global Sustainable Peace</label>
            <textarea placeholder="Your ideas for sustainable global peace..."></textarea>
        </div>

        <div class="form-group">
            <label>🚫 Eliminate Violence</label>
            <textarea placeholder="Your solutions to eliminate violence..."></textarea>
        </div>

        <div class="form-group">
            <label>🤝 Cultural Unity</label>
            <textarea placeholder="Your vision for cultural unity..."></textarea>
        </div>

        <div class="form-group">
            <label>📬 Contact (Optional)</label>
            <select>
                <option value="email">Email</option>
                <option value="linkedin">LinkedIn</option>
                <option value="website">Website</option>
                <option value="phone">Phone</option>
                <option value="telegram">Telegram</option>
                <option value="whatsapp">WhatsApp</option>
            </select>
            <input type="text" placeholder="Enter your contact value (e.g., email)" style="margin-top:0.3rem; width:100%; padding:0.5rem 1rem; border-radius:16px; border:1px solid rgba(255,255,255,0.05); background:rgba(255,255,255,0.02); font-family:inherit;" />
            <div class="hint">* This section is optional and only used to connect with others.</div>
        </div>

        <a href="card-en.html" class="btn-submit">🎯 Get Your ID</a>
        <div class="note">No personal identity data (name, nationality, ID) is stored.</div>
    </div>

</div>
</body>
</html>
