<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea,
        body.dark .form-group select {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus,
        body.dark .form-group select:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea { min-height: 60px; resize: vertical; }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #4a3a2a; opacity: 0.5; }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder { color: #908070; }
        .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        body.dark .btn-primary:hover { background: rgba(255, 255, 255, 0.04); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover { background: rgba(60, 30, 10, 0.03); transform: scale(1.02); }
        body.dark .btn-secondary:hover { background: rgba(255, 255, 255, 0.03); }
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .success-message {
            display: none;
            background: rgba(50, 200, 50, 0.02);
            border: 1px solid rgba(50, 200, 50, 0.02);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            margin-top: 1.5rem;
            color: #0a5a0a;
        }
        body.dark .success-message {
            color: #80b080;
            background: rgba(50, 200, 50, 0.01);
            border-color: rgba(50, 200, 50, 0.01);
        }
        .success-message.show { display: block; }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .value-item {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border: 1px solid rgba(30, 10, 0, 0.02);
        }
        body.dark .value-item { border-color: rgba(255, 255, 255, 0.02); }
        .value-item .value-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
            display: block;
        }
        body.dark .value-item .value-title { color: #e8d8c8; }
        @font-face { font-family: 'Vazir'; src: local('Vazir'), local('IRANSans'); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>📝 Register & Get ID</h1>
        <div class="subtitle">Global Smart Cultural Identity Card</div>

        <form id="registerForm">
            <!-- ۷ ارزش فرهنگی با اشارات نامرئی به نظریه‌ها -->
            <div class="value-item">
                <label class="value-title">1. Indigenous Values (Smart Cultural Resistance)</label>
                <input type="text" id="v1" placeholder="e.g. Preserving heritage, local identity, rootedness..." required />
            </div>

            <div class="value-item">
                <label class="value-title">2. Individual Knowledge (Enlightenment Companions)</label>
                <input type="text" id="v2" placeholder="e.g. Lived experience, tacit wisdom, indigenous skills..." required />
            </div>

            <div class="value-item">
                <label class="value-title">3. Collective Collaboration (Entrepreneurial Nexus)</label>
                <input type="text" id="v3" placeholder="e.g. Network synergy, distributed trust, teamwork..." required />
            </div>

            <div class="value-item">
                <label class="value-title">4. Cultural Diversity (Unity in Plurality)</label>
                <input type="text" id="v4" placeholder="e.g. Respect for differences, dialogue of civilizations, tolerance..." required />
            </div>

            <div class="value-item">
                <label class="value-title">5. Global Peace (Intelligent Peace)</label>
                <input type="text" id="v5" placeholder="e.g. Data-driven diplomacy, preemptive conflict resolution, active calm..." required />
            </div>

            <div class="value-item">
                <label class="value-title">6. Eliminating Violence (Systemic Love)</label>
                <input type="text" id="v6" placeholder="e.g. Reducing prejudice, promoting tolerance, invisible cultural engineering..." required />
            </div>

            <div class="value-item">
                <label class="value-title">7. Cultural Unity (Galaxy of Wisdom)</label>
                <input type="text" id="v7" placeholder="e.g. Bridges between cultures, collective wisdom, co-evolution..." required />
            </div>

            <div class="form-group">
                <label>Optional Code (5 custom characters)</label>
                <input type="text" id="optionalCode" maxlength="5" placeholder="e.g. A-B-C-D-E" />
                <small style="opacity:0.5; font-size:0.7rem;">Optional - you can leave it empty</small>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">🎯 Get Your ID</button>
                <a href="index-en.html" class="btn btn-secondary">↩ Back</a>
            </div>
        </form>

        <div class="success-message" id="successMessage">
            ✅ Your information has been saved. Redirecting to your card...
        </div>

        <div class="note">
            No personal info • Completely anonymous • 3 minutes
        </div>
    </div>

    <script>
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Registering...';

            try {
                const values = [
                    document.getElementById('v1').value.trim(),
                    document.getElementById('v2').value.trim(),
                    document.getElementById('v3').value.trim(),
                    document.getElementById('v4').value.trim(),
                    document.getElementById('v5').value.trim(),
                    document.getElementById('v6').value.trim(),
                    document.getElementById('v7').value.trim()
                ];

                const optionalCode = document.getElementById('optionalCode').value.trim();

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ values, optionalCode })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Registration error');

                document.getElementById('successMessage').classList.add('show');
                submitBtn.textContent = '✅ Registered';
                
                setTimeout(() => {
                    window.location.href = `card-en.html?code=${result.cardCode}`;
                }, 1500);

            } catch (error) {
                alert('❌ ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '🎯 Get Your ID';
            }
        });
    </script>
</body>
</html>
