<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>درخواست ارتباط | شناسنامه فرهنگی جهانی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #d4e8f5 0%, #b8d4e8 40%, #a0c4d8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #0f1a2a 40%, #0a0f1a 100%);
            color: #d0d8e0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 1.5rem 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.3s, border-color 0.3s;
        }

        body.dark .container {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .date-display {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0b3b54;
            opacity: 0.7;
            background: rgba(255,255,255,0.15);
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        body.dark .date-display { color: #b8d4e8; }

        .theme-toggle {
            background: rgba(255,255,255,0.15);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #0b3b54;
        }

        body.dark .theme-toggle { color: #f9e79f; }
        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.25);
        }

        .lang-switch {
            text-align: center;
            margin: 1rem 0;
        }

        .lang-switch a {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1a4b6d;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lang-switch a:hover { background: rgba(255,255,255,0.25); }
        body.dark .lang-switch a { color: #b8d4e8; background: rgba(255,255,255,0.05); }
        body.dark .lang-switch a:hover { background: rgba(255,255,255,0.1); }

        .back-module {
            display: inline-block;
            background: rgba(26, 75, 109, 0.15);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1a4b6d;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(26, 75, 109, 0.1);
            margin-bottom: 1.5rem;
        }

        body.dark .back-module {
            background: rgba(255,255,255,0.05);
            color: #b8d4e8;
            border-color: rgba(255,255,255,0.05);
        }

        .back-module:hover {
            background: rgba(26, 75, 109, 0.25);
            transform: translateX(-4px);
        }

        body.dark .back-module:hover { background: rgba(255,255,255,0.1); }

        .request-box {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        body.dark .request-box {
            background: rgba(30, 40, 50, 0.4);
            border-color: rgba(255,255,255,0.05);
        }

        .request-box h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b3b54;
            margin-bottom: 1rem;
            border-bottom: 2px solid rgba(26,123,158,0.1);
            padding-bottom: 0.4rem;
        }

        body.dark .request-box h2 { color: #b8d4e8; border-bottom-color: rgba(255,255,255,0.05); }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0b3b54;
            margin-bottom: 0.3rem;
        }

        body.dark .form-group label { color: #b8d4e8; }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
            resize: vertical;
            color: #0b3b54;
        }

        body.dark .form-group input,
        body.dark .form-group textarea {
            background: rgba(30, 40, 50, 0.3);
            border-color: rgba(255,255,255,0.05);
            color: #d0d8e0;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1a7b9e;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
        }

        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus {
            background: rgba(30, 40, 50, 0.5);
            border-color: #1a7b9e;
        }

        .btn-submit {
            display: inline-block;
            background: linear-gradient(135deg, #1a7b9e, #6a3f9e);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 4px 16px rgba(26,123,158,0.2);
            width: 100%;
            margin-top: 0.5rem;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(26,123,158,0.3);
        }

        .note {
            font-size: 0.8rem;
            opacity: 0.5;
            text-align: center;
            margin-top: 0.8rem;
        }

        body.dark .note { opacity: 0.3; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .request-box { padding: 1.2rem 1rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <div class="date-display" id="dateDisplay">📅 جمعه ۲۰ مرداد ۱۴۰۵</div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <!-- ===== LANGUAGE SWITCH ===== -->
    <div class="lang-switch">
        <a href="request-en.html">🇬🇧 English</a>
    </div>

    <a href="index.html" class="back-module">← بازگشت به صفحه‌ی اصلی</a>

    <!-- ===== REQUEST FORM ===== -->
    <div class="request-box">
        <h2>🤝 درخواست ارتباط با هم‌فکران</h2>

        <p style="opacity:0.7; margin-bottom:1.2rem;">
            برای ثبت درخواست ارتباط با هم‌فکران، کد خود را وارد کنید. ادمین پس از بررسی امتیاز شما، نتیجه را به شما اعلام خواهد کرد.
        </p>

        <div class="form-group">
            <label>🔑 کد شناسنامه</label>
            <input type="text" placeholder="مثال: CIM-1234-5678-الف" />
        </div>

        <button class="btn-submit">📨 ارسال درخواست به ادمین</button>
        <div class="note">✦ درخواست شما توسط ادمین بررسی می‌شود و نتیجه از طریق ایمیل به شما اعلام می‌گردد ✦</div>
    </div>

</div>

<script>
    (function() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        const persianDate = now.toLocaleDateString('fa-IR', options);
        document.getElementById('dateDisplay').textContent = '📅 ' + persianDate;
    })();

    (function() {
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', function() {
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) {
                toggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                toggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });
    })();
</script>
</body>
</html>
