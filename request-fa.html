<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>درخواست ارتباط | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea,
        body.dark .form-group select {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus,
        body.dark .form-group select:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a3a2a;
            opacity: 0.5;
        }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder {
            color: #908070;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover {
            background: rgba(60, 30, 10, 0.04);
            transform: scale(1.02);
        }
        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover {
            background: rgba(60, 30, 10, 0.03);
            transform: scale(1.02);
        }
        body.dark .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50, 200, 50, 0.05);
            border: 1px solid rgba(50, 200, 50, 0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success {
            color: #80b080;
            background: rgba(50, 200, 50, 0.01);
            border-color: rgba(50, 200, 50, 0.01);
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error {
            color: #b08080;
            background: rgba(200, 50, 50, 0.01);
            border-color: rgba(200, 50, 50, 0.01);
        }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>🤝 درخواست ارتباط با هم‌فکران</h1>
        <div class="subtitle">ارتباط با دیگران بر اساس ارزش‌های فرهنگی مشترک</div>

        <div id="messageBox" class="message-box"></div>

        <form id="requestForm">
            <div class="form-group">
                <label>کد کارت شما</label>
                <input type="text" id="cardCode" placeholder="مثلاً: CIM-1234-5678-A" required />
            </div>

            <div class="form-group">
                <label>نوع درخواست</label>
                <select id="requestType" required>
                    <option value="">انتخاب کنید...</option>
                    <option value="connection">ارتباط با هم‌فکران</option>
                    <option value="delete">انصراف از عضویت</option>
                </select>
            </div>

            <div class="form-group">
                <label>توضیحات درخواست</label>
                <textarea id="description" placeholder="توضیح دهید که چه نوع ارتباطی یا چه دلیلی برای انصراف دارید..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">📨 ارسال درخواست</button>
                <a href="index.html" class="btn btn-secondary">↩ بازگشت</a>
            </div>
        </form>

        <div class="note">
            🔒 درخواست شما به ادمین ارسال می‌شود و پس از بررسی، نتیجه به شما اعلام خواهد شد.
        </div>
    </div>

    <script>
        // ===== Theme =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== Show Message =====
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message-box';
        }

        // ===== Save Request to Repository =====
        async function saveRequest(requestData) {
            const GITHUB_TOKEN = process.env.GH_TOKEN;
            const REPO_OWNER = 'ghrezaei1399-code';
            const REPO_NAME = 'cultural-id';
            const FILE_NAME = `request-${Date.now()}.json`;
            const FILE_PATH = `data/requests/${FILE_NAME}`;
            const COMMIT_MESSAGE = `درخواست جدید: ${requestData.cardCode}`;

            const content = JSON.stringify(requestData, null, 2);

            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: COMMIT_MESSAGE,
                    content: btoa(unescape(encodeURIComponent(content)))
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`خطا در ارسال درخواست: ${errorData.message || 'ناشناخته'}`);
            }

            return await response.json();
        }

        // ===== Form Submission =====
        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessage();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ارسال...';

            try {
                const cardCode = document.getElementById('cardCode').value.trim();
                const requestType = document.getElementById('requestType').value;
                const description = document.getElementById('description').value.trim();

                if (!cardCode) {
                    throw new Error('لطفاً کد کارت خود را وارد کنید.');
                }

                if (!requestType) {
                    throw new Error('لطفاً نوع درخواست را انتخاب کنید.');
                }

                const requestData = {
                    cardCode: cardCode,
                    type: requestType,
                    description: description,
                    requestDate: new Date().toISOString(),
                    status: 'pending'
                };

                await saveRequest(requestData);

                showMessage('✅ درخواست شما با موفقیت به ادمین ارسال شد.', 'success');
                submitBtn.textContent = '✅ ارسال شد';

            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ خطا: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '📨 ارسال درخواست';
            }
        });
    </script>
</body>
</html>
