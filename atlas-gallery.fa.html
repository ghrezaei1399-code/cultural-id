<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>اطلس ظهور و گالری نام‌آوران | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            background-attachment: fixed;
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f0e8d0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        body.dark .container {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
            padding: 0.3rem;
        }
        .gallery-grid::-webkit-scrollbar { width: 6px; }
        .gallery-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 10px; }
        .gallery-card {
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        body.dark .gallery-card { background: rgba(0,0,0,0.15); }
        .gallery-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); }
        body.dark .gallery-card:hover { background: rgba(255,255,255,0.02); }
        .gallery-card.atlas { border-color: rgba(212,175,55,0.3); }
        .gallery-card.achievement { border-color: rgba(40,116,166,0.3); }
        .card-media {
            height: 180px;
            background: rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .card-media { background: rgba(0,0,0,0.2); }
        .card-media img, .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-media .no-media {
            font-size: 3rem;
            color: #888;
        }
        .card-content { padding: 1rem; }
        .card-title { font-weight: 800; color: #0a0a1a; font-size: 0.95rem; margin-bottom: 0.3rem; }
        body.dark .card-title { color: #f0e8e0; }
        .card-desc {
            font-size: 0.8rem;
            color: #4a4a5a;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .card-desc { color: #b0b0c0; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .card-meta .card-owner { font-weight: 700; color: #2874a6; }
        body.dark .card-meta .card-owner { color: #85c1e9; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .badge-atlas { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        .badge-achievement { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-atlas { color: #f9e79f; background: rgba(212,175,55,0.1); }
        body.dark .badge-achievement { color: #85c1e9; background: rgba(40,116,166,0.05); }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active {
            background: rgba(212,175,55,0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #0a0a1a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0,0,0,0.2); }
        .theme-toggle:hover { transform: scale(1.1); }
        
        /* استایل دکمه پرونده کامل */
        .btn-full-profile {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.4rem;
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #8a6d1f;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }
        .btn-full-profile:hover { background: rgba(212,175,55,0.2); }
        body.dark .btn-full-profile { color: #f9e79f; border-color: #f9e79f; }

        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-link">↩ بازگشت به صفحه اصلی</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>

        <h1 class="page-title">🏛️ اطلس ظهور و گالری نام‌آوران</h1>
        <div class="page-subtitle">مشاهدات برگزیده با امتیاز ۵ و دستاوردهای نام‌آوران تأییدشده</div>

        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalAtlas">۰</span><div class="label">🏛️ اطلس ظهور</div></div>
            <div class="stat-mini"><span class="number" id="totalAchievements">۰</span><div class="label">🏆 نام‌آوران</div></div>
            <div class="stat-mini"><span class="number" id="totalItems">۰</span><div class="label">📋 مجموع</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 همه</button>
            <button class="filter-btn" data-filter="atlas" onclick="setFilter('atlas')">🏛️ اطلس ظهور</button>
            <button class="filter-btn" data-filter="achievement" onclick="setFilter('achievement')">🏆 نام‌آوران</button>
        </div>

        <div id="galleryGrid" class="gallery-grid">
            <div class="empty-state">در حال بارگذاری...</div>
        </div>
    </div>
  <script>
let allAtlasItems = [];
let allAchievements = [];
let currentFilter = 'all';

function toggleTheme() {
    document.body.classList.toggle('dark');
    const btn = document.getElementById('themeToggle');
    btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggle').textContent = '☀️';
}

// ============================================================
// نرمال‌سازی
// ============================================================
function normalizeGuide(item) {
    if (item.guide && (item.guide.individual || item.guide.network || item.guide.policy)) {
        return {
            individual: item.guide.individual || '',
            social: item.guide.network || '',
            institutional: item.guide.policy || ''
        };
    }
    return null;
}

function normalizeMatrix(item) {
    if (item.matrix_emergence || item.matrix_layers || item.matrix_connections ||
        item.matrix_scale || item.matrix_capacity) {
        return {
            emergence: item.matrix_emergence || '',
            layer: item.matrix_layers || '',
            connection: item.matrix_connections || '',
            scale: item.matrix_scale || '',
            capacity: item.matrix_capacity || '',
            analysis: item.analysis || '',
            cluster: item.cluster || '',
            score: item.score || null
        };
    }
    return null;
}

function normalizeAi3(item) {
    return item.ai3Final || '';
}

// ============================================================
// بارگذاری داده
// ============================================================
async function loadData() {
    const grid = document.getElementById('galleryGrid');

    // ===== ۱. اطلس ظهور =====
    try {
        const atlasRes = await fetch('/api/get-connection-requests?type=observations&t=' + Date.now());
        const atlasData = await atlasRes.json();
        if (atlasRes.ok) {
            allAtlasItems = (atlasData.observations || []).filter(obs => obs.status === 'approved');
        } else {
            console.error('Atlas error:', atlasData.error);
            allAtlasItems = [];
        }
    } catch (e) {
        console.error('Atlas fetch error:', e);
        allAtlasItems = [];
    }

    // ===== ۲. دستاوردها =====
    try {
        const usersRes = await fetch('/api/get-users?t=' + Date.now());
        const usersData = await usersRes.json();
        if (usersRes.ok) {
            allAchievements = [];
            if (usersData.users) {
                usersData.users.forEach(user => {
                    if (user.achievements && Array.isArray(user.achievements)) {
                        user.achievements.forEach(ach => {
                            if (ach.section === 'emergence' && ach.status === 'approved') {
                                allAchievements.push({
                                    ...ach,
                                    owner: user.cardCode,
                                    ownerEmail: user.communicationEmail || '',
                                    ownerRank: user.rank || 0
                                });
                            }
                        });
                    }
                });
            }
        }
    } catch (e) {
        console.error('Users fetch error:', e);
        allAchievements = [];
    }

    updateStats();
    renderGallery();
}

function updateStats() {
    document.getElementById('totalAtlas').textContent = allAtlasItems.length.toLocaleString('fa-IR');
    document.getElementById('totalAchievements').textContent = allAchievements.length.toLocaleString('fa-IR');
    document.getElementById('totalItems').textContent = (allAtlasItems.length + allAchievements.length).toLocaleString('fa-IR');
}

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderGallery();
}

function renderGallery() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) {
        console.error('galleryGrid not found');
        return;
    }

    const atlasItems = allAtlasItems.map((obs, idx) => ({
        type: 'atlas',
        _idx: idx,
        id: obs.number,
        title: obs.observation ? obs.observation.substring(0, 80) + '...' : 'مشاهده',
        description: obs.observation || '',
        owner: obs.cardCode || 'ناشناس',
        score: obs.score || '---',
        date: obs.createdAt,
        category: 'atlas'
    }));

    const achievementItems = allAchievements.map((ach, idx) => ({
        type: 'achievement',
        _idx: idx,
        id: ach.id || ach.fileName || 'unknown',
        title: ach.title || 'بدون عنوان',
        description: ach.description || '',
        owner: ach.owner || 'ناشناس',
        date: ach.createdAt || ach.uploadDate,
        category: ach.category || 'other',
        fileUrl: ach.fileUrl || ach.fileData || ''
    }));

    let items = [];
    if (currentFilter === 'all') items = [...atlasItems, ...achievementItems];
    else if (currentFilter === 'atlas') items = atlasItems;
    else if (currentFilter === 'achievement') items = achievementItems;

    items.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">هیچ موردی در این دسته وجود ندارد</div>`;
        return;
    }

    grid.innerHTML = items.map(item => {
        const isAtlas = item.type === 'atlas';
        const isAchievement = item.type === 'achievement';

        let mediaHtml = '';
        if (isAchievement && item.fileUrl) {
            mediaHtml = `<img src="${item.fileUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='<span class=\\'no-media\\'>📄</span>'" />`;
        } else {
            mediaHtml = `<span class="no-media">${isAtlas ? '🏛️' : '📄'}</span>`;
        }

        const date = item.date ? new Date(item.date).toLocaleString('fa-IR') : '---';

        let detailButton = '';
        if (isAtlas) {
            detailButton = `<button onclick="showAtlasDetail(${item._idx})" class="btn-full-profile">📊 مشاهده پرونده کامل ظهور</button>`;
        }

        return `
            <div class="gallery-card ${isAtlas ? 'atlas' : 'achievement'}">
                <div class="card-media">${mediaHtml}</div>
                <div class="card-content">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.description ? item.description.substring(0, 120) + (item.description.length > 120 ? '...' : '') : '---'}</div>
                    <div class="card-meta">
                        <span class="card-owner">👤 ${item.owner}</span>
                        <span class="card-date">${date}</span>
                    </div>
                    ${isAtlas ? `<span class="badge badge-atlas">🏛️ اطلس ظهور</span>` : ''}
                    ${isAchievement ? `<span class="badge badge-achievement">🏆 نام‌آور</span>` : ''}
                    ${detailButton}
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
// نمایش جزئیات پرونده ظهور
// ============================================================
window.showAtlasDetail = function(idx) {
    const item = allAtlasItems[idx];
    if (!item) return;

    const guide = normalizeGuide(item);
    const matrix = normalizeMatrix(item);
    const ai3Final = normalizeAi3(item);

    const clusterNames = {
        'human': 'انسان', 'knowledge': 'دانش و فناوری',
        'governance': 'حکمرانی و تمدن', 'survival': 'بقا و آینده', 'other': 'نامشخص'
    };

    // ===== ساخت HTML =====
    let html = `
        <div style="text-align:right; direction:rtl; line-height:1.8; max-height:70vh; overflow-y:auto;">
            <h3 style="color:#8a6d1f; border-bottom:2px solid #d4af37; padding-bottom:0.5rem; margin-bottom:1rem;">
                🏛️ پرونده ظهور #${item.number}
            </h3>
    `;

    // ① مشاهده خام
    html += `
        <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(212,175,55,0.08); border-radius:10px; border-right:4px solid #d4af37;">
            <div style="font-weight:800; font-size:0.85rem; color:#8a6d1f; margin-bottom:0.4rem;">📝 مشاهده ثبت‌شده</div>
            <div style="font-size:0.85rem; line-height:1.8;">${item.observation || '---'}</div>
        </div>
    `;

    // ② AI-1
    if (guide && (guide.individual || guide.social || guide.institutional)) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(16,185,129,0.06); border-radius:10px; border-right:4px solid #10b981;">
                <div style="font-weight:800; font-size:0.85rem; color:#047857; margin-bottom:0.4rem;">🤖 راهنمای سه‌سطحی (AI-1)</div>
                ${guide.individual ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>📍 سطح فردی:</strong> ${guide.individual}</div>` : ''}
                ${guide.social ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>🌐 سطح اجتماعی:</strong> ${guide.social}</div>` : ''}
                ${guide.institutional ? `<div style="font-size:0.82rem; line-height:1.7;"><strong>🏛️ سطح نهادی:</strong> ${guide.institutional}</div>` : ''}
            </div>
        `;
    }

    // ③ AI-2
    if (matrix && (matrix.emergence || matrix.layer || matrix.connection || matrix.scale || matrix.capacity || matrix.analysis)) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(99,102,241,0.06); border-radius:10px; border-right:4px solid #6366f1;">
                <div style="font-weight:800; font-size:0.85rem; color:#4338ca; margin-bottom:0.4rem;">
                    🧠 ماتریس ۵ سطحی (AI-2)
                    ${matrix.cluster ? `<span style="background:rgba(212,175,55,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem; margin-right:0.3rem;">📂 ${clusterNames[matrix.cluster] || matrix.cluster}</span>` : ''}
                    ${matrix.score ? `<span style="background:rgba(39,174,96,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem;">⭐ امتیاز: ${matrix.score}</span>` : ''}
                </div>
                ${matrix.emergence ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ظهورها:</strong> ${matrix.emergence}</div>` : ''}
                ${matrix.layer ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 لایه‌ها:</strong> ${matrix.layer}</div>` : ''}
                ${matrix.connection ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ارتباطات:</strong> ${matrix.connection}</div>` : ''}
                ${matrix.scale ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 مقیاس:</strong> ${matrix.scale}</div>` : ''}
                ${matrix.capacity ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ظرفیت:</strong> ${matrix.capacity}</div>` : ''}
                ${matrix.analysis ? `<div style="margin-top:0.5rem; padding:0.5rem; background:rgba(255,255,255,0.5); border-radius:6px; font-size:0.82rem; line-height:1.75;"><strong>تحلیل:</strong> ${matrix.analysis}</div>` : ''}
            </div>
        `;
    }

    // ④ AI-3
    if (ai3Final) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(236,72,153,0.06); border-radius:10px; border-right:4px solid #ec4899;">
                <div style="font-weight:800; font-size:0.85rem; color:#be185d; margin-bottom:0.4rem;">💎 تحلیل نهایی (AI-3)</div>
                <div style="font-size:0.85rem; line-height:1.9;">${ai3Final}</div>
            </div>
        `;
    }

    // اگر هیچ AI نبود
    if (!guide && !matrix && !ai3Final) {
        html += `
            <div style="padding:0.8rem; background:rgba(231,76,60,0.08); border-radius:10px; border-right:4px solid #e74c3c;">
                <div style="font-weight:800; font-size:0.85rem; color:#7a1a1a;">⚠️ تحلیل هوش مصنوعی برای این مشاهده موجود نیست</div>
                <div style="font-size:0.78rem; color:#7a1a1a; margin-top:0.3rem;">ممکن است این مشاهده قبل از فعال‌سازی سیستم تحلیل سه‌لایه ثبت شده باشد.</div>
            </div>
        `;
    }

    // دکمه کپی
    html += `
            <div style="margin-top:0.8rem; padding:0.6rem; text-align:center; background:rgba(100,116,139,0.08); border-radius:8px; border:1px dashed rgba(100,116,139,0.3);">
                <button onclick="copyAtlasProfile(${idx})" style="padding:0.4rem 1rem; border-radius:20px; background:#64748b; color:#fff; border:none; font-weight:700; font-size:0.8rem; cursor:pointer;">📋 کپی کل پرونده</button>
            </div>
        </div>
    `;

    // ===== نمایش در مودال =====
    const modalBody = document.getElementById('modalBody');
    if (modalBody) {
        modalBody.innerHTML = html;
    } else {
        // اگر modalBody نداریم، مودال را از صفر می‌سازیم
        showCustomModal(`🏛️ پرونده ظهور #${item.number}`, html);
    }
};

// ===== مودال ساده =====
function showCustomModal(title, bodyHtml) {
    let modal = document.getElementById('customAtlasModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'customAtlasModal';
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px);';
        modal.innerHTML = `
            <div style="background:#fff;max-width:750px;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px;padding:1.5rem;position:relative;">
                <button onclick="document.getElementById('customAtlasModal').remove()" style="position:absolute;top:0.5rem;left:0.5rem;background:rgba(0,0,0,0.1);border:none;width:30px;height:30px;border-radius:50%;font-size:1.2rem;cursor:pointer;">✕</button>
                <h2 style="color:#8a6d1f;margin-bottom:1rem;font-size:1.1rem;">${title}</h2>
                <div>${bodyHtml}</div>
            </div>
        `;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
    }
}

// ============================================================
// کپی کل پرونده
// ============================================================
window.copyAtlasProfile = function(idx) {
    const item = allAtlasItems[idx];
    if (!item) return;

    const guide = normalizeGuide(item);
    const matrix = normalizeMatrix(item);
    const ai3Final = normalizeAi3(item);

    const L = [];
    L.push('═══════════════════════════════════════════');
    L.push(`ATLAS PROFILE #${item.number || '---'}`);
    L.push(`Tracking Code: OBS-${item.number || '---'}`);
    L.push(`Card Code: ${item.cardCode || '---'}`);
    L.push(`Date: ${item.createdAt ? new Date(item.createdAt).toISOString() : '---'}`);
    L.push(`Score: ${item.score || '---'}`);
    L.push('═══════════════════════════════════════════');
    L.push('');
    L.push('▸ [1] RAW OBSERVATION:');
    L.push(item.observation || '-');
    L.push('');
    if (guide) {
        L.push('▸ [2] AI-1 — THREE-LEVEL GUIDANCE:');
        if (guide.individual) L.push(`  📍 Individual: ${guide.individual}`);
        if (guide.social) L.push(`  🌐 Social: ${guide.social}`);
        if (guide.institutional) L.push(`  🏛️ Institutional: ${guide.institutional}`);
        L.push('');
    }
    if (matrix) {
        L.push('▸ [3] AI-2 — FIVE-LEVEL MATRIX:');
        if (matrix.emergence) L.push(`  📊 Emergence: ${matrix.emergence}`);
        if (matrix.layer) L.push(`  📊 Layers: ${matrix.layer}`);
        if (matrix.connection) L.push(`  📊 Connections: ${matrix.connection}`);
        if (matrix.scale) L.push(`  📊 Scale: ${matrix.scale}`);
        if (matrix.capacity) L.push(`  📊 Capacity: ${matrix.capacity}`);
        if (matrix.analysis) { L.push(''); L.push(`  Analysis: ${matrix.analysis}`); }
        L.push('');
    }
    if (ai3Final) {
        L.push('▸ [4] AI-3 — FINAL SYNTHESIS:');
        L.push(ai3Final);
        L.push('');
    }
    L.push('═══════════════════════════════════════════');

    const text = L.join('\n');
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => alert('✅ کل پرونده کپی شد')).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
};

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('✅ کل پرونده کپی شد'); }
    catch (e) { alert('❌ خطا در کپی'); }
    document.body.removeChild(ta);
}

// ===== شروع =====
loadData();
setInterval(loadData, 60000);
