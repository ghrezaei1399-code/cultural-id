<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت دستاوردها | داشبورد ادمین</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background-image: url('assets/نماد صلح.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: all 0.3s ease;
        }
        body.dark { background-image: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        body.dark .container { background: rgba(0, 0, 0, 0.25); border-color: rgba(255, 255, 255, 0.05); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255, 255, 255, 0.08); }

        .lang-group {
            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .lang-btn {
            padding: 0.3rem 1rem;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #888;
        }
        .lang-btn.active {
            background: rgba(212, 175, 55, 0.25);
            color: #2a1a0a;
        }
        body.dark .lang-btn.active {
            background: rgba(212, 175, 55, 0.2);
            color: #f9e79f;
        }
        .lang-btn:not(.active):hover {
            background: rgba(212, 175, 55, 0.08);
            color: #2a1a0a;
        }
        body.dark .lang-btn:not(.active):hover { color: #f0e8d0; }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #0a0a1a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0, 0, 0, 0.2); }
        .theme-toggle:hover { transform: scale(1.1); }

        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }

        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        body.dark .stat-mini { background: rgba(0, 0, 0, 0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212, 175, 55, 0.05); }
        .filter-btn.active {
            background: rgba(212, 175, 55, 0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212, 175, 55, 0.08); }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }
        .achievements-grid::-webkit-scrollbar {
            width: 4px;
        }
        .achievements-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .achievements-grid::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 10px;
        }

        .ach-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        body.dark .ach-card { background: rgba(0, 0, 0, 0.15); }
        .ach-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.08); }
        body.dark .ach-card:hover { background: rgba(255, 255, 255, 0.02); }

        .ach-media {
            height: 160px;
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .ach-media { background: rgba(0, 0, 0, 0.2); }
        .ach-media img, .ach-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ach-media .no-media {
            font-size: 2.5rem;
            color: #888;
        }

        .ach-content { padding: 1rem; }
        .ach-title { font-weight: 800; color: #0a0a1a; font-size: 0.95rem; margin-bottom: 0.2rem; }
        body.dark .ach-title { color: #f0e8e0; }
        .ach-desc {
            font-size: 0.8rem;
            color: #4a4a5a;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .ach-desc { color: #b0b0c0; }
        .ach-meta { font-size: 0.65rem; color: #888; margin-bottom: 0.5rem; }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .badge-approved { background: rgba(50, 200, 50, 0.15); color: #0a6a0a; }
        .badge-rejected { background: rgba(200, 50, 50, 0.15); color: #6a1a1a; }
        .badge-pending { background: rgba(255, 200, 50, 0.15); color: #8a7a0a; }

        .btn-small {
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin: 0.1rem;
        }
        .btn-approve { background: rgba(50, 200, 50, 0.15); color: #0a6a0a; }
        body.dark .btn-approve { color: #82e0aa; }
        .btn-approve:hover { background: rgba(50, 200, 50, 0.25); }
        .btn-reject { background: rgba(200, 50, 50, 0.15); color: #6a1a1a; }
        body.dark .btn-reject { color: #f1948a; }
        .btn-reject:hover { background: rgba(200, 50, 50, 0.25); }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .lang-group { justify-content: center; }
            .theme-toggle { align-self: center; }
            .achievements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== نوار بالا ===== -->
        <div class="top-bar">
            <a href="admin.html" class="back-link" id="backLink">↩ بازگشت به داشبورد</a>
            <div class="lang-group">
                <button onclick="setLanguage('fa')" id="langFa" class="lang-btn active">🇮🇷 فارسی</button>
                <button onclick="setLanguage('en')" id="langEn" class="lang-btn">🇬🇧 English</button>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>

        <!-- ===== عنوان ===== -->
        <h1 class="page-title" id="pageTitle">🏆 مدیریت دستاوردها</h1>
        <div class="page-subtitle" id="pageSubtitle">مشاهده، بررسی و تأیید دستاوردهای فرهنگی ارسالی</div>

        <!-- ===== آمار کوچک ===== -->
        <div class="stats-mini">
            <div class="stat-mini">
                <span class="number" id="totalAch">۰</span>
                <div class="label" id="labelTotal">کل دستاوردها</div>
            </div>
            <div class="stat-mini">
                <span class="number" id="pendingAch">۰</span>
                <div class="label" id="labelPending">⏳ در انتظار</div>
            </div>
            <div class="stat-mini">
                <span class="number" id="approvedAch">۰</span>
                <div class="label" id="labelApproved">✅ تایید شده</div>
            </div>
            <div class="stat-mini">
                <span class="number" id="rejectedAch">۰</span>
                <div class="label" id="labelRejected">❌ رد شده</div>
            </div>
        </div>

        <!-- ===== فیلتر ===== -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')" id="filterAll">📋 همه</button>
            <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')" id="filterPending">⏳ در انتظار</button>
            <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')" id="filterApproved">✅ تایید شده</button>
            <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected')" id="filterRejected">❌ رد شده</button>
        </div>

        <!-- ===== گالری ===== -->
        <div id="achievementsGrid" class="achievements-grid">
            <div class="empty-state" id="loadingAchievements">در حال بارگذاری...</div>
        </div>
    </div>

    <script>
        // ===== متغیرها =====
        let allAchievements = [];
        let currentFilter = 'all';
        let currentLang = 'fa';

        // ===== دیکشنری کامل ترجمه =====
        const translations = {
            fa: {
                backLink: '↩ بازگشت به داشبورد',
                pageTitle: '🏆 مدیریت دستاوردها',
                pageSubtitle: 'مشاهده، بررسی و تأیید دستاوردهای فرهنگی ارسالی',
                labelTotal: 'کل دستاوردها',
                labelPending: '⏳ در انتظار',
                labelApproved: '✅ تایید شده',
                labelRejected: '❌ رد شده',
                filterAll: '📋 همه',
                filterPending: '⏳ در انتظار',
                filterApproved: '✅ تایید شده',
                filterRejected: '❌ رد شده',
                loading: 'در حال بارگذاری...',
                noAchievements: 'هیچ دستاوردی یافت نشد',
                approved: 'تایید شده',
                rejected: 'رد شده',
                pending: 'در انتظار',
                approveBtn: '✅ تایید',
                rejectBtn: '❌ رد',
                sender: 'ارسال کننده: ',
                rank: 'رتبه: '
            },
            en: {
                backLink: '↩ Back to Dashboard',
                pageTitle: '🏆 Achievement Management',
                pageSubtitle: 'View, review and approve submitted cultural achievements',
                labelTotal: 'Total Achievements',
                labelPending: '⏳ Pending',
                labelApproved: '✅ Approved',
                labelRejected: '❌ Rejected',
                filterAll: '📋 All',
                filterPending: '⏳ Pending',
                filterApproved: '✅ Approved',
                filterRejected: '❌ Rejected',
                loading: 'Loading...',
                noAchievements: 'No achievements found',
                approved: 'Approved',
                rejected: 'Rejected',
                pending: 'Pending',
                approveBtn: '✅ Approve',
                rejectBtn: '❌ Reject',
                sender: 'Submitted by: ',
                rank: 'Rank: '
            }
        };

        function t(key) {
            return translations[currentLang] && translations[currentLang][key] ? translations[currentLang][key] : key;
        }

        // ===== تغییر زبان =====
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('langFa').className = 'lang-btn' + (lang === 'fa' ? ' active' : '');
            document.getElementById('langEn').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
            
            document.getElementById('backLink').textContent = t('backLink');
            document.getElementById('pageTitle').textContent = t('pageTitle');
            document.getElementById('pageSubtitle').textContent = t('pageSubtitle');
            document.getElementById('labelTotal').textContent = t('labelTotal');
            document.getElementById('labelPending').textContent = t('labelPending');
            document.getElementById('labelApproved').textContent = t('labelApproved');
            document.getElementById('labelRejected').textContent = t('labelRejected');
            document.getElementById('filterAll').textContent = t('filterAll');
            document.getElementById('filterPending').textContent = t('filterPending');
            document.getElementById('filterApproved').textContent = t('filterApproved');
            document.getElementById('filterRejected').textContent = t('filterRejected');
        }

        // ===== تم =====
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.getElementById('themeToggle');
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').textContent = '☀️';
        }

        // ===== بارگذاری =====
        async function loadAchievements() {
            try {
                const response = await fetch('/api/get-users?t=' + new Date().getTime());
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                
                const data = await response.json();
                const users = data.users || [];
                
                allAchievements = [];
                users.forEach(user => {
                    if (user.achievements) {
                        user.achievements.forEach(ach => {
                            allAchievements.push({
                                ...ach,
                                ownerCode: user.cardCode,
                                ownerRank: user.rank
                            });
                        });
                    }
                });

                updateStats();
                renderAchievements();

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('achievementsGrid').innerHTML = 
                    `<div class="empty-state" style="color:red;">خطا: ${error.message}</div>`;
            }
        }

        // ===== آمار =====
        function updateStats() {
            const total = allAchievements.length;
            const pending = allAchievements.filter(a => a.status === 'pending').length;
            const approved = allAchievements.filter(a => a.status === 'approved').length;
            const rejected = allAchievements.filter(a => a.status === 'rejected').length;

            document.getElementById('totalAch').textContent = total;
            document.getElementById('pendingAch').textContent = pending;
            document.getElementById('approvedAch').textContent = approved;
            document.getElementById('rejectedAch').textContent = rejected;
        }

        // ===== فیلتر =====
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderAchievements();
        }

        // ===== رندر =====
        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            
            let filtered = allAchievements;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a.status === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">${t('noAchievements')}</div>`;
                return;
            }

            grid.innerHTML = filtered.map(ach => {
                let mediaHtml = '';
                if (ach.fileUrl) {
                    const ext = ach.fileName ? ach.fileName.split('.').pop().toLowerCase() : '';
                    if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        mediaHtml = `<video controls src="${ach.fileUrl}"></video>`;
                    } else {
                        mediaHtml = `<img src="${ach.fileUrl}" alt="${ach.title}" onerror="this.parentElement.innerHTML='<span class=\\'no-media\\'>📄</span>'" />`;
                    }
                } else if (ach.fileData) {
                    mediaHtml = `<img src="${ach.fileData}" alt="${ach.title}" />`;
                } else {
                    mediaHtml = `<span class="no-media">📄</span>`;
                }

                const statusMap = {
                    approved: `<span class="badge badge-approved">${t('approved')}</span>`,
                    rejected: `<span class="badge badge-rejected">${t('rejected')}</span>`,
                    pending: `<span class="badge badge-pending">${t('pending')}</span>`
                };

                const actionButtons = ach.status === 'pending' ? `
                    <button class="btn-small btn-approve" onclick="updateStatus('${ach.ownerCode}', '${ach.fileName}', 'approved')">${t('approveBtn')}</button>
                    <button class="btn-small btn-reject" onclick="updateStatus('${ach.ownerCode}', '${ach.fileName}', 'rejected')">${t('rejectBtn')}</button>
                ` : '';

                return `
                    <div class="ach-card">
                        <div class="ach-media">${mediaHtml}</div>
                        <div class="ach-content">
                            <div class="ach-title">${ach.title || 'بدون عنوان'}</div>
                            <div class="ach-desc">${ach.description ? ach.description.substring(0, 100) + (ach.description.length > 100 ? '...' : '') : '---'}</div>
                            <div class="ach-meta">${t('sender')} ${ach.ownerCode} (${t('rank')} ${ach.ownerRank})</div>
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.3rem;">
                                ${statusMap[ach.status] || ''}
                                <div>${actionButtons}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== تغییر وضعیت =====
        async function updateStatus(cardCode, fileName, newStatus) {
            const confirmMsg = currentLang === 'fa' 
                ? `آیا از ${newStatus === 'approved' ? 'تایید' : 'رد'} این اثر مطمئن هستید؟`
                : `Are you sure you want to ${newStatus === 'approved' ? 'approve' : 'reject'} this achievement?`;
            
            if (!confirm(confirmMsg)) return;
            
            try {
                const response = await fetch('/api/update-achievement-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardCode, fileName, status: newStatus })
                });
                
                if (!response.ok) throw new Error('خطا در سرور');
                
                const successMsg = currentLang === 'fa' 
                    ? '✅ وضعیت دستاورد با موفقیت تغییر کرد.'
                    : '✅ Achievement status updated successfully.';
                alert(successMsg);
                loadAchievements();
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }

        // ===== شروع =====
        loadAchievements();
    </script>
</body>
</html>
