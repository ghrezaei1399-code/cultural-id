<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت ارتباطات و مشاهدات | سپهر خردمندی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark { background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%); color: #f0e8d0; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Top Bar & Titles */
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.5rem; }
        .back-link { padding: 0.5rem 1.2rem; border-radius: 30px; background: rgba(255,255,255,0.05); color: #0a0a1a; text-decoration: none; font-weight: 700; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        .page-title { font-size: 1.6rem; font-weight: 800; color: #0a0a1a; text-align: center; margin-bottom: 0.2rem; }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle { text-align: center; font-size: 0.8rem; color: #2a2a3a; opacity: 0.7; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem; }
        body.dark .page-subtitle { color: #c8b890; }
        
        /* Stats & Filters */
        .stats-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
        .stat-mini { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 0.8rem; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        
        .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; justify-content: center; }
        .filter-btn { padding: 0.4rem 1.2rem; border-radius: 30px; border: 1px solid rgba(212,175,55,0.15); background: rgba(255,255,255,0.03); color: #0a0a1a; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active { background: rgba(212,175,55,0.12); border-color: #d4af37; }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        
        /* List & Cards */
        .observations-list { display: flex; flex-direction: column; gap: 1.5rem; max-height: 900px; overflow-y: auto; padding-left: 0.3rem; padding-right: 0.3rem; }
        .observations-list::-webkit-scrollbar { width: 6px; }
        .observations-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .observations-list::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 10px; }
        
        .obs-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.06); transition: 0.3s; position: relative; }
        body.dark .obs-card { background: rgba(0,0,0,0.15); }
        .obs-card:hover { background: rgba(255,255,255,0.08); }
        body.dark .obs-card:hover { background: rgba(255,255,255,0.02); }
        
        .obs-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 0.5rem; }
        .obs-code { font-family: 'Courier New', monospace; font-size: 0.9rem; font-weight: 700; color: #8a6d1f; }
        body.dark .obs-code { color: #f9e79f; }
        .obs-meta { font-size: 0.7rem; color: #888; }
        
        /* Unified Content Box for Admin */
        .unified-content-box {
            background: rgba(255,255,255,0.6);
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            position: relative;
        }
        body.dark .unified-content-box { background: rgba(0,0,0,0.25); border-color: rgba(212,175,55,0.15); }
        
        .content-section { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px dashed rgba(0,0,0,0.1); }
        .content-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .section-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #2874a6;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        body.dark .section-label { color: #85c1e9; }
        
        .observation-text { font-size: 0.95rem; line-height: 1.8; color: #1a1a2a; font-weight: 500; }
        body.dark .observation-text { color: #e0e0e0; }
        
        .ai1-analysis { 
            background: rgba(99,102,241,0.08); 
            padding: 0.8rem; 
            border-radius: 8px; 
            border-right: 3px solid #6366f1;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #3a3a5a;
        }
        body.dark .ai1-analysis { background: rgba(99,102,241,0.1); color: #c0c0e0; }
        
        .collab-section {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .collab-tag {
            padding: 0.3rem 0.8rem;
            background: rgba(212,175,55,0.15);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8a6d1f;
        }
        body.dark .collab-tag { background: rgba(212,175,55,0.1); color: #f9e79f; }
        
        .guide-box {
            background: rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 0.8rem;
        }
        .guide-item {
            font-size: 0.85rem;
            color: #5a4a3a;
            margin-bottom: 0.3rem;
            padding-right: 0.5rem;
            border-right: 2px solid #d4af37;
        }
        body.dark .guide-item { color: #d0c0b0; }
        
        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }
        @media(min-width: 768px) { .matrix-grid { grid-template-columns: 1fr 1fr; } }
        
        .matrix-item label { display: block; font-weight: 700; font-size: 0.75rem; margin-bottom: 0.2rem; color: #4a4a5a; }
        body.dark .matrix-item label { color: #b0b0c0; }
        
        textarea, select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.9);
            font-family: inherit;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
        }
        body.dark textarea, body.dark select { background: rgba(0,0,0,0.3); color: #f0e8d0; border-color: rgba(255,255,255,0.1); }
        
        .final-analysis {
            background: rgba(39,174,96,0.08);
            padding: 0.8rem;
            border-radius: 8px;
            border-right: 3px solid #27ae60;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #2a4a3a;
        }
        body.dark .final-analysis { background: rgba(39,174,96,0.1); color: #a0e0c0; }

        /* Badges */
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 30px; font-size: 0.65rem; font-weight: 700; margin-left: 0.3rem; }
        .badge-approved { background: rgba(50,200,50,0.15); color: #0a6a0a; }
        .badge-rejected { background: rgba(200,50,50,0.15); color: #6a1a1a; }
        .badge-pending { background: rgba(255,200,50,0.15); color: #8a7a0a; }
        .badge-score-5 { background: rgba(212,175,55,0.25); color: #8a6d1f; border: 1px solid #d4af37; }
        .badge-cluster { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-cluster { color: #85c1e9; background: rgba(40,116,166,0.05); }

        /* Action Modules - Sequential Flow */
        .action-modules {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px dashed rgba(212,175,55,0.3);
        }

        .module-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.6rem 0.8rem;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        body.dark .module-row { background: rgba(0,0,0,0.1); }

        .btn-small {
            padding: 0.35rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-save { background: #2874a6; color: white; }
        .btn-save:hover { background: #1a5276; }
        .btn-approve-atlas { background: #27ae60; color: white; }
        .btn-approve-gallery { background: #8e44ad; color: white; }
        .btn-reject { background: #c0392b; color: white; }

        .empty-state { text-align: center; padding: 3rem; color: #888; }
        .scroll-hint { text-align: center; padding: 0.8rem; color: #888; font-size: 0.85rem; border-top: 1px solid rgba(212,175,55,0.1); margin-top: 0.5rem; font-weight: 700; }
        .btn-back-bottom { display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem; background: rgba(212,175,55,0.2); color: #8a6d1f; border-radius: 30px; text-decoration: none; font-weight: 700; transition: 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .obs-card.pending { border-color: #f39c12; border-width: 2px; }
        .obs-card.approved { border-color: #27ae60; border-width: 2px; }
        .obs-card.rejected { border-color: #e74c3c; border-width: 2px; }
        .obs-card.score5 { border-color: #d4af37; border-width: 2px; box-shadow: 0 0 20px rgba(212,175,55,0.15); }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="admin.html" class="back-link">↩ بازگشت به داشبورد</a>
        </div>
        
        <h1 class="page-title">👁️ مدیریت ارتباطات و مشاهدات</h1>
        <div class="page-subtitle">بررسی، تحلیل و امتیازدهی مشاهدات خام بر اساس چارچوب سپهر خردمندی</div>
        
        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalObs">۰</span><div class="label">کل مشاهدات</div></div>
            <div class="stat-mini"><span class="number" id="pendingObs">۰</span><div class="label">⏳ در انتظار</div></div>
            <div class="stat-mini"><span class="number" id="approvedObs">۰</span><div class="label">✅ تایید شده</div></div>
            <div class="stat-mini"><span class="number" id="score5Obs">۰</span><div class="label">⭐ امتیاز ۵</div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 همه</button>
            <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">⏳ در انتظار</button>
            <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')">✅ تایید شده</button>
            <button class="filter-btn" data-filter="score5" onclick="setFilter('score5')">⭐ امتیاز ۵</button>
            <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected')">❌ رد شده</button>
        </div>
        
        <div id="observationsList" class="observations-list">
            <div class="empty-state">در حال بارگذاری...</div>
        </div>
        
        <div style="text-align:center; margin-top:2rem;">
            <a href="admin.html" class="btn-back-bottom">↩ بازگشت به پنل ادمین</a>
        </div>
    </div>
    
    <script>
        let allObservations = [];
        let currentFilter = 'all';
        
        const clusterMap = {
            'human': 'انسان',
            'knowledge': 'دانش و فناوری',
            'governance': 'حکمرانی و تمدن',
            'survival': 'بقا و آینده'
        };
        
        function detectCluster(text) {
            if (!text) return 'other';
            const lowerText = text.toLowerCase();
            // منطق خوشه‌بندی حفظ شده از نسخه اصلی
            return 'other'; 
        }
        
        function getClusterLabel(cluster) { return clusterMap[cluster] || 'سایر'; }
        
        async function loadObservations() {
            try {
                const response = await fetch('/api/get-connection-requests?type=observations&t=' + Date.now());
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'خطا در دریافت مشاهدات');
                
                allObservations = data.observations || [];
                updateStats();
                renderObservations();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('observationsList').innerHTML = 
                    `<div class="empty-state" style="color:red;">خطا در ارتباط با سرور: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            const total = allObservations.length;
            const pending = allObservations.filter(o => o.status === 'pending').length;
            const approved = allObservations.filter(o => o.status === 'approved' && o.score !== 5).length;
            const score5 = allObservations.filter(o => o.score === 5).length;
            
            document.getElementById('totalObs').textContent = total;
            document.getElementById('pendingObs').textContent = pending;
            document.getElementById('approvedObs').textContent = approved;
            document.getElementById('score5Obs').textContent = score5;
        }
        
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderObservations();
        }

        function renderObservations() {
            const container = document.getElementById('observationsList');
            
            let filtered = allObservations;
            if (currentFilter === 'pending') filtered = filtered.filter(o => o.status === 'pending');
            else if (currentFilter === 'approved') filtered = filtered.filter(o => o.status === 'approved' && o.score !== 5);
            else if (currentFilter === 'score5') filtered = filtered.filter(o => o.score === 5);
            else if (currentFilter === 'rejected') filtered = filtered.filter(o => o.status === 'rejected');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ مشاهده‌ای با این وضعیت وجود ندارد</div>`;
                return;
            }
            
            container.innerHTML = filtered.map(obs => {
                let cluster = 'other';
                if (obs.aiAnalysis && obs.aiAnalysis.cluster) cluster = obs.aiAnalysis.cluster;
                else if (obs.analysis && obs.analysis.adminCluster) cluster = obs.analysis.adminCluster;
                
                const clusterLabel = getClusterLabel(cluster);
                const statusMap = {
                    approved: `<span class="badge badge-approved">✅ تایید شده</span>`,
                    rejected: `<span class="badge badge-rejected">❌ رد شده</span>`,
                    pending: `<span class="badge badge-pending">⏳ در انتظار</span>`
                };
                
                const scoreBadge = obs.score === 5 ? `<span class="badge badge-score-5">⭐ امتیاز ۵</span>` : 
                    (obs.score ? `<span class="badge" style="background:rgba(200,200,200,0.15);color:#888;">امتیاز ${obs.score}</span>` : '');
                
                const clusterBadge = cluster !== 'other' ? `<span class="badge badge-cluster">📂 ${clusterLabel}</span>` : '';
                
                let cardClass = 'obs-card';
                if (obs.status === 'pending') cardClass += ' pending';
                else if (obs.score === 5) cardClass += ' score5';
                else if (obs.status === 'approved') cardClass += ' approved';
                else if (obs.status === 'rejected') cardClass += ' rejected';
                
                const analysis = obs.analysis || {};
                const ai1 = obs.ai1Analysis || {};
                const ai2 = obs.aiAnalysis || {};
                
                // ساختار باکس یکپارچه برای ادمین
                return `
                    <div class="${cardClass}" id="card-${obs.number}">
                        <div class="obs-header">
                            <div>
                                <span class="obs-code">#${obs.number} - ${obs.cardCode || 'ناشناس'}</span>
                                ${statusMap[obs.status] || ''}
                                ${scoreBadge}
                                ${clusterBadge}
                            </div>
                            <div class="obs-meta">${new Date(obs.createdAt).toLocaleString('fa-IR')}</div>
                        </div>

                        <!-- باکس یکپارچه محتوای مشاهده و تحلیل‌ها -->
                        <div class="unified-content-box">
                            <!-- 1. مشاهده عضو -->
                            <div class="content-section">
                                <div class="section-label">👁️ مشاهده ثبت شده توسط عضو</div>
                                <div class="observation-text">${obs.observation || 'متن مشاهده موجود نیست'}</div>
                            </div>

                            <!-- 2. تحلیل سه سطحی هوش اول -->
                            ${ai1.threeLevelAnalysis ? `
                            <div class="content-section">
                                <div class="section-label">🧠 تحلیل سه سطحی هوش مصنوعی اول</div>
                                <div class="ai1-analysis">${ai1.threeLevelAnalysis}</div>
                            </div>` : ''}

                            <!-- خط فاصله واضح قبل از بخش همفکری -->
                            <div style="border-top: 2px dashed rgba(212,175,55,0.4); margin: 0.8rem 0;"></div>

                            <!-- 3. انتخاب همفکری / ارجاع -->
                            <div class="content-section">
                                <div class="section-label">🤝 انتخاب همفکری / ارجاع توسط عضو</div>
                                <div class="collab-section">
                                    ${obs.collaborationChoice ? `<span class="collab-tag">${obs.collaborationChoice}</span>` : '<span style="font-size:0.8rem;color:#888;">انتخابی ثبت نشده</span>'}
                                    ${obs.referralTargets && obs.referralTargets.length > 0 ? 
                                        obs.referralTargets.map(t => `<span class="collab-tag">ارجاع به: ${t}</span>`).join('') : ''}
                                </div>
                            </div>

                            <!-- 4. راهنمایی سه سطحی -->
                            ${obs.guidance ? `
                            <div class="content-section">
                                <div class="section-label">💡 راهنمایی سه سطحی سیستم</div>
                                <div class="guide-box">
                                    <div class="guide-item">سطح ۱: ${obs.guidance.level1 || '-'}</div>
                                    <div class="guide-item">سطح ۲: ${obs.guidance.level2 || '-'}</div>
                                    <div class="guide-item">سطح ۳: ${obs.guidance.level3 || '-'}</div>
                                </div>
                            </div>` : ''}

                            <!-- 5. ماتریس‌های هوش دوم -->
                            <div class="content-section">
                                <div class="section-label">📊 ماتریس‌های ۵ سطحی هوش مصنوعی دوم</div>
                                <div class="matrix-grid">
                                    <div class="matrix-item">
                                        <label>۱. ماتریس ظهورها</label>
                                        <textarea id="emergence-${obs.number}" rows="2">${analysis.emergenceMatrix || ai2.matrix_emergence || ''}</textarea>
                                    </div>
                                    <div class="matrix-item">
                                        <label>۲. ماتریس لایه‌ها</label>
                                        <textarea id="layer-${obs.number}" rows="2">${analysis.layerMatrix || ai2.matrix_layers || ''}</textarea>
                                    </div>
                                    <div class="matrix-item">
                                        <label>۳. ماتریس ارتباطات</label>
                                        <textarea id="connection-${obs.number}" rows="2">${analysis.connectionMatrix || ai2.matrix_connections || ''}</textarea>
                                    </div>
                                    <div class="matrix-item">
                                        <label>۴. ماتریس مقیاس</label>
                                        <textarea id="scale-${obs.number}" rows="2">${analysis.scaleMatrix || ai2.matrix_scale || ''}</textarea>
                                    </div>
                                    <div class="matrix-item">
                                        <label>۵. ماتریس ظرفیت</label>
                                        <textarea id="capacity-${obs.number}" rows="2">${analysis.capacityMatrix || ai2.matrix_capacity || ''}</textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- 6. تحلیل نهایی هوش دوم -->
                            ${ai2.finalAnalysis || analysis.adminNote ? `
                            <div class="content-section">
                                <div class="section-label">🎯 تحلیل نهایی</div>
                                <div class="final-analysis">${ai2.finalAnalysis || analysis.adminNote || '-'}</div>
                            </div>` : ''}
                        </div>

                        <!-- ماژول‌های اقدام (به ترتیب دقیق) -->
                        <div class="action-modules">
                            <!-- مرحله 1: امتیاز دهی -->
                            <div class="module-row">
                                <label style="font-weight:700; color:#2a1a0a; font-size:0.85rem;">⭐ امتیاز (۱ تا ۵):</label>
                                <select id="score-${obs.number}" style="width:auto; min-width:80px;">
                                    <option value="1" ${obs.score === 1 ? 'selected' : ''}>۱</option>
                                    <option value="2" ${obs.score === 2 ? 'selected' : ''}>۲</option>
                                    <option value="3" ${obs.score === 3 ? 'selected' : ''}>۳</option>
                                    <option value="4" ${obs.score === 4 ? 'selected' : ''}>۴</option>
                                    <option value="5" ${obs.score === 5 ? 'selected' : ''}>۵</option>
                                </select>
                            </div>

                            <!-- مرحله 2: ذخیره -->
                            <div class="module-row" style="justify-content:flex-end;">
                                <button class="btn-small btn-save" onclick="saveAnalysis('${obs.number}')">💾 ذخیره</button>
                            </div>

                            <!-- مرحله 3: تصمیم نهایی -->
                            ${obs.status === 'pending' ? `
                            <div class="module-row" style="justify-content:space-between; background:rgba(255,255,255,0.5);">
                                <span style="font-size:0.75rem; color:#666;">تصمیم نهایی:</span>
                                <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                                    <button class="btn-small btn-approve-atlas" onclick="approveObservation('${obs.number}', 'atlas')">✅ تایید برای اطلس ظهور</button>
                                    <button class="btn-small btn-approve-gallery" onclick="approveObservation('${obs.number}', 'gallery')">✅ تایید برای گالری نام‌آوران</button>
                                    <button class="btn-small btn-reject" onclick="rejectObservation('${obs.number}')">❌ رد</button>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            if (filtered.length > 5) {
                container.innerHTML += `<div class="scroll-hint">⬇️ ${filtered.length} مشاهده وجود دارد (اسکرول کنید)</div>`;
            }
        }
        
        async function approveObservation(issueNumber, target) {
            const targetNames = { 'atlas': 'اطلس ظهور', 'gallery': 'گالری نام‌آوران' };
            if (!confirm(`آیا از تایید این مشاهده برای ${targetNames[target]} اطمینان دارید؟`)) return;
            try {
                const response = await fetch('/api/approve-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ issueNumber, action: 'approve_all', type: 'observation', target })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در تایید');
                alert(`✅ مشاهده برای ${targetNames[target]} تایید شد.`);
                loadObservations();
            } catch (error) { alert('خطا: ' + error.message); }
        }
        
        async function rejectObservation(issueNumber) {
            if (!confirm('آیا از رد این مشاهده اطمینان دارید؟')) return;
            try {
                const response = await fetch('/api/approve-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ issueNumber, action: 'reject_all', type: 'observation' })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در رد');
                alert(result.message);
                loadObservations();
            } catch (error) { alert('خطا: ' + error.message); }
        }
        
        async function saveAnalysis(issueNumber) {
            const analysis = {
                emergenceMatrix: document.getElementById(`emergence-${issueNumber}`).value.trim(),
                layerMatrix: document.getElementById(`layer-${issueNumber}`).value.trim(),
                connectionMatrix: document.getElementById(`connection-${issueNumber}`).value.trim(),
                scaleMatrix: document.getElementById(`scale-${issueNumber}`).value.trim(),
                capacityMatrix: document.getElementById(`capacity-${issueNumber}`).value.trim()
            };
            
            const score = parseInt(document.getElementById(`score-${issueNumber}`).value) || 0;
            
            try {
                const response = await fetch('/api/approve-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        issueNumber, 
                        action: 'save_analysis',
                        type: 'observation',
                        analysis: analysis,
                        score: score
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در ذخیره');
                
                alert('✅ ذخیره شد.');
                loadObservations(); 
            } catch (error) { 
                alert('خطا: ' + error.message); 
            }
        }
        
        loadObservations();
    </script>
</body>
</html>
