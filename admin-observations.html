<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت مشاهدات | سپهر خردمندی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh; padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark { background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%); color: #f0e8d0; }
        .container { max-width: 1280px; margin: 0 auto; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.5rem; }
        .back-link {
            padding: 0.5rem 1.2rem; border-radius: 30px;
            background: rgba(255,255,255,0.05); color: #0a0a1a;
            text-decoration: none; font-weight: 700; font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08); transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }

        .page-title { font-size: 1.7rem; font-weight: 800; color: #0a0a1a; text-align: center; margin-bottom: 0.2rem; }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center; font-size: 0.8rem; color: #2a2a3a;
            opacity: 0.7; margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }

        .stats-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
        .stat-mini {
            background: rgba(255,255,255,0.04); border-radius: 14px;
            padding: 0.9rem 0.8rem; text-align: center;
            border: 1px solid rgba(255,255,255,0.04); transition: transform 0.2s;
        }
        .stat-mini:hover { transform: translateY(-2px); }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }

        .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; justify-content: center; }
        .filter-btn {
            padding: 0.4rem 1.2rem; border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03); color: #0a0a1a;
            font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active { background: rgba(212,175,55,0.12); border-color: #d4af37; }

        .observations-list { display: flex; flex-direction: column; gap: 1.8rem; }

        /* ===== کارت واحد ===== */
        .obs-card {
            background: rgba(255,255,255,0.06); border-radius: 18px;
            padding: 1.5rem; border: 2px solid rgba(255,255,255,0.08);
            transition: 0.3s; position: relative; overflow: hidden;
        }
        body.dark .obs-card { background: rgba(0,0,0,0.18); }
        .obs-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .obs-card.pending { border-color: #f39c12; }
        .obs-card.approved { border-color: #27ae60; }
        .obs-card.rejected { border-color: #e74c3c; }
        .obs-card.score5 { border-color: #d4af37; box-shadow: 0 0 25px rgba(212,175,55,0.15); }

        .obs-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;
            padding-bottom: 0.8rem; border-bottom: 2px dashed rgba(212,175,55,0.25);
        }
        .obs-code { font-family: 'Courier New', monospace; font-size: 0.9rem; font-weight: 700; color: #8a6d1f; }
        body.dark .obs-code { color: #f9e79f; }
        .obs-meta { font-size: 0.7rem; color: #888; }
        .tracking-code {
            font-family: 'Courier New', monospace; font-size: 0.75rem;
            padding: 0.15rem 0.5rem; border-radius: 6px;
            background: rgba(99,102,241,0.12); color: #4338ca;
            border: 1px solid rgba(99,102,241,0.2);
        }
        body.dark .tracking-code { background: rgba(99,102,241,0.08); color: #a5b4fc; }

        /* ===== ۵ بلوک داخل کارت ===== */
        .block {
            padding: 1rem; margin-bottom: 0.9rem;
            border-radius: 10px; border-right: 4px solid #ccc;
            background: rgba(255,255,255,0.35);
        }
        body.dark .block { background: rgba(0,0,0,0.12); }
        .block-title {
            font-weight: 800; font-size: 0.88rem;
            margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.4rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px dashed rgba(0,0,0,0.08);
        }
        body.dark .block-title { border-color: rgba(255,255,255,0.1); }
        .block-body { font-size: 0.88rem; line-height: 1.85; }
        body.dark .block-body { color: #d0d0e0; }

        .block-1 { border-right-color: #d4af37; background: rgba(212,175,55,0.05); }
        .block-1 .block-title { color: #8a6d1f; }
        body.dark .block-1 .block-title { color: #f9e79f; }

        .block-2 { border-right-color: #10b981; background: rgba(16,185,129,0.05); }
        .block-2 .block-title { color: #047857; }
        body.dark .block-2 .block-title { color: #6ee7b7; }

        .block-3 { border-right-color: #6366f1; background: rgba(99,102,241,0.05); }
        .block-3 .block-title { color: #4338ca; }
        body.dark .block-3 .block-title { color: #a5b4fc; }

        .block-4 { border-right-color: #ec4899; background: rgba(236,72,153,0.05); }
        .block-4 .block-title { color: #be185d; }
        body.dark .block-4 .block-title { color: #f9a8d4; }

        /* سطح‌های AI1 */
        .ai-level {
            padding: 0.55rem 0.75rem; margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.55); border-radius: 8px;
            font-size: 0.85rem; line-height: 1.7;
            border-right: 3px solid #10b981;
        }
        body.dark .ai-level { background: rgba(0,0,0,0.15); }
        .ai-level .level-head {
            font-weight: 800; font-size: 0.78rem;
            color: #047857; margin-bottom: 0.2rem; display: block;
        }
        body.dark .ai-level .level-head { color: #6ee7b7; }

        /* ماتریس AI2 */
        .matrix-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 0.6rem; margin-bottom: 0.6rem;
        }
        .matrix-cell {
            padding: 0.65rem 0.85rem; border-radius: 8px;
            background: rgba(255,255,255,0.55);
            border-right: 3px solid #6366f1;
            font-size: 0.82rem; line-height: 1.7;
        }
        body.dark .matrix-cell { background: rgba(0,0,0,0.15); }
        .matrix-cell .m-label {
            font-weight: 800; font-size: 0.72rem; color: #4338ca;
            display: block; margin-bottom: 0.25rem;
        }
        body.dark .matrix-cell .m-label { color: #a5b4fc; }

        /* تحلیل AI2 */
        .ai2-analysis {
            padding: 0.65rem 0.85rem; margin-top: 0.4rem;
            border-radius: 8px; background: rgba(99,102,241,0.08);
            border-right: 3px solid #6366f1; font-size: 0.85rem; line-height: 1.75;
        }
        body.dark .ai2-analysis { background: rgba(99,102,241,0.05); }

        /* نشانگرهای AI2 */
        .ai2-badges {
            display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem;
            padding-top: 0.6rem; border-top: 1px dashed rgba(99,102,241,0.2);
        }
        .ai2-badge {
            padding: 0.3rem 0.7rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700;
            background: rgba(255,255,255,0.6); border: 1px solid rgba(99,102,241,0.2);
        }
        body.dark .ai2-badge { background: rgba(0,0,0,0.2); }
        .ai2-badge.cluster { color: #2874a6; border-color: rgba(40,116,166,0.3); }
        .ai2-badge.score { color: #8a6d1f; border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.1); }
        .ai2-badge.module { color: #7c3aed; border-color: rgba(124,58,237,0.3); }
        .ai2-badge.culture-ok { color: #047857; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); }
        .ai2-badge.culture-no { color: #b91c1c; border-color: rgba(220,38,38,0.3); background: rgba(220,38,38,0.08); }

        /* ===== نوار کپی ===== */
        .copy-toolbar {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            margin: 1rem 0; padding: 0.8rem;
            border-radius: 10px; background: rgba(100,116,139,0.08);
            border: 1px dashed rgba(100,116,139,0.3);
            align-items: center;
        }
        .btn-copy {
            padding: 0.45rem 1rem; border-radius: 25px; border: none;
            font-weight: 700; font-size: 0.78rem; cursor: pointer;
            transition: 0.3s; font-family: inherit;
            background: #64748b; color: #fff;
        }
        .btn-copy:hover { background: #475569; }
        .btn-copy.save { background: #0ea5e9; }
        .btn-copy.save:hover { background: #0284c7; }
        .copy-hint { font-size: 0.72rem; color: #64748b; margin-right: auto; }

        /* ===== ماژول ترتیبی ===== */
        .modules-container {
            margin-top: 1.2rem; padding: 1.2rem;
            background: linear-gradient(135deg, rgba(212,175,55,0.07), rgba(99,102,241,0.05));
            border-radius: 14px; border: 1px solid rgba(212,175,55,0.25);
        }
        .modules-title {
            font-weight: 800; font-size: 0.85rem; color: #8a6d1f;
            margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
        }
        body.dark .modules-title { color: #f9e79f; }

        .module-step {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.8rem; margin-bottom: 0.6rem;
            background: rgba(255,255,255,0.45); border-radius: 10px;
            border-right: 4px solid #ccc; transition: 0.3s;
        }
        body.dark .module-step { background: rgba(0,0,0,0.15); }
        .module-step.active { border-right-color: #d4af37; background: rgba(212,175,55,0.1); }
        .module-step.completed { border-right-color: #27ae60; background: rgba(39,174,96,0.08); }
        .module-step.locked { opacity: 0.45; pointer-events: none; }

        .step-number {
            width: 30px; height: 30px; border-radius: 50%;
            background: #ccc; color: #fff; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; flex-shrink: 0;
        }
        .module-step.active .step-number { background: #d4af37; }
        .module-step.completed .step-number { background: #27ae60; }

        .step-content { flex: 1; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .step-content label { font-weight: 700; font-size: 0.8rem; }

        select.score-select {
            padding: 0.4rem 0.8rem; border-radius: 8px;
            border: 1px solid rgba(212,175,55,0.3);
            background: rgba(255,255,255,0.8); font-family: inherit;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }
        body.dark select.score-select { background: rgba(0,0,0,0.25); color: #f0e8d0; }
        .ai-suggest { font-size: 0.72rem; color: #8a6d1f; font-weight: 700; }
        body.dark .ai-suggest { color: #f9e79f; }

        .btn-action {
            padding: 0.5rem 1.2rem; border-radius: 25px; border: none;
            font-weight: 700; font-size: 0.8rem; cursor: pointer;
            transition: 0.3s; font-family: inherit;
        }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-save { background: #6366f1; color: #fff; }
        .btn-save:not(:disabled):hover { background: #4f46e5; }
        .btn-atlas { background: rgba(39,174,96,0.18); color: #0a6a0a; }
        body.dark .btn-atlas { color: #82e0aa; }
        .btn-atlas:not(:disabled):hover { background: rgba(39,174,96,0.35); }
        .btn-gallery { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        body.dark .btn-gallery { color: #f9e79f; }
        .btn-gallery:not(:disabled):hover { background: rgba(212,175,55,0.35); }
        .btn-reject { background: rgba(200,50,50,0.18); color: #6a1a1a; }
        body.dark .btn-reject { color: #f1948a; }
        .btn-reject:not(:disabled):hover { background: rgba(200,50,50,0.35); }

        /* ===== Badges ===== */
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 30px; font-size: 0.65rem; font-weight: 700; }
        .badge-approved { background: rgba(50,200,50,0.15); color: #0a6a0a; }
        body.dark .badge-approved { color: #82e0aa; }
        .badge-rejected { background: rgba(200,50,50,0.15); color: #6a1a1a; }
        body.dark .badge-rejected { color: #f1948a; }
        .badge-pending { background: rgba(255,200,50,0.15); color: #8a7a0a; }
        body.dark .badge-pending { color: #f9e79f; }
        .badge-score-5 { background: rgba(212,175,55,0.25); color: #8a6d1f; border: 1px solid #d4af37; }
        .badge-cluster { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-cluster { color: #85c1e9; background: rgba(40,116,166,0.08); }

        .empty-state { text-align: center; padding: 3rem; color: #888; }
        .loading-state { text-align: center; padding: 3rem; color: #888; }
        .loading-state::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

        .btn-back-bottom {
            display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem;
            background: rgba(212,175,55,0.2); color: #8a6d1f;
            border-radius: 30px; text-decoration: none; font-weight: 700; transition: 0.3s;
        }
        .btn-back-bottom:hover { background: rgba(212,175,55,0.3); }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 0.8rem 1.5rem; border-radius: 30px;
            background: #333; color: #fff; font-weight: 700; font-size: 0.85rem;
            z-index: 9999; opacity: 0; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #6366f1; }

        @media (max-width: 768px) {
            .top-bar, .obs-header { flex-direction: column; align-items: stretch; }
            .step-content { flex-direction: column; align-items: stretch; }
            .matrix-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="admin.html" class="back-link">↩ بازگشت به داشبورد</a>
        </div>

        <h1 class="page-title">👁️ مدیریت مشاهدات</h1>
        <div class="page-subtitle">تحلیل سه‌لایه هوش مصنوعی + بررسی و امتیازدهی ادمین بر اساس چارچوب سپهر خردمندی</div>

        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalObs">۰</span><div class="label">کل مشاهدات</div></div>
            <div class="stat-mini"><span class="number" id="pendingObs">۰</span><div class="label">⏳ در انتظار</div></div>
            <div class="stat-mini"><span class="number" id="approvedObs">۰</span><div class="label">✅ تایید شده</div></div>
            <div class="stat-mini"><span class="number" id="score5Obs">۰</span><div class="label">⭐ امتیاز ۵</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 همه</button>
            <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">⏳ در انتظار</button>
            <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')">✅ تایید شده</button>
            <button class="filter-btn" data-filter="score5" onclick="setFilter('score5')">⭐ امتیاز ۵</button>
            <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected')">❌ رد شده</button>
        </div>

        <div id="observationsList" class="observations-list">
            <div class="loading-state">در حال بارگذاری</div>
        </div>

        <div style="text-align:center;">
            <a href="admin.html" class="btn-back-bottom">↩ بازگشت به پنل ادمین</a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // ===== State =====
        // ============================================================
        let allObservations = [];
        let currentFilter = 'all';
        const localState = {};

        // ============================================================
        // ===== Utility =====
        // ============================================================
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.className = 'toast ' + type; }, 3200);
        }

        async function copyToClipboard(text, successMsg = 'متن کپی شد') {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); document.body.removeChild(ta);
                }
                showToast('✅ ' + successMsg, 'success');
            } catch (e) { showToast('❌ خطا در کپی: ' + e.message, 'error'); }
        }

        // ============================================================
        // ===== خوشه‌بندی =====
        // ============================================================
        const clusterMap = {
            'human': 'انسان', 'knowledge': 'دانش و فناوری',
            'governance': 'حکمرانی و تمدن', 'survival': 'بقا و آینده', 'other': 'سایر'
        };
        const clusterKeywords = {
            'human': ['فقر', 'آموزش', 'سلامت', 'سلامت روان', 'اعتیاد', 'جوانان', 'خانواده', 'بیماری', 'محرومیت', 'بی‌سوادی'],
            'knowledge': ['هوش مصنوعی', 'فناوری', 'دانش', 'نوآوری', 'تحقیق', 'علم', 'شکاف دانشی'],
            'governance': ['فساد', 'جنگ', 'سیاست', 'حکمرانی', 'نهاد', 'قانون', 'مهاجرت نخبگان'],
            'survival': ['آب', 'انرژی', 'اقلیم', 'محیط زیست', 'غذا', 'کشاورزی', 'امنیت غذایی', 'فقر', 'معیشت']
        };
        function detectCluster(text) {
            if (!text) return 'other';
            const t = String(text).toLowerCase();
            let best = 'other', max = 0;
            for (const [c, kws] of Object.entries(clusterKeywords)) {
                let s = 0; for (const k of kws) if (t.includes(k)) s++;
                if (s > max) { max = s; best = c; }
            }
            return max > 0 ? best : 'other';
        }
        function getClusterLabel(c) { return clusterMap[c] || 'سایر'; }

        // ============================================================
        // ===== نرمال‌سازی سه هوش مصنوعی =====
        // ============================================================
        function normalizeAi1(obs) {
            // راهنمای سه‌سطحی هوش مصنوعی اول
            const src = obs.ai1Guidance || obs.analysis?.ai1Guidance || obs.ai1
                     || obs.analysis?.ai1 || obs.guidance3level || null;
            if (!src) return null;
            return {
                individual: src.individual || src.individual_level || src['سطح فردی'] || src.level1 || '',
                social:     src.social     || src.social_level     || src['سطح اجتماعی'] || src.level2 || '',
                institutional: src.institutional || src.institutional_level || src['سطح نهادی'] || src.level3 || ''
            };
        }

        function normalizeAi2(obs) {
            // ماتریس ۵ سطحی + تحلیل هوش مصنوعی دوم
            const src = obs.ai2Matrix || obs.analysis?.ai2Matrix || obs.ai2
                     || obs.aiAnalysis || obs.analysis?.aiAnalysis || null;
            if (!src) return null;
            return {
                emergence:  src.emergence  || src.emergenceMatrix  || src['ظهورها'] || src.raw_emergence || '',
                layer:      src.layer      || src.layerMatrix      || src['لایه‌ها'] || src.matrix_layers || '',
                connection: src.connection || src.connectionMatrix || src['ارتباطات'] || src.connections || '',
                scale:      src.scale      || src.scaleMatrix      || src['مقیاس'] || src.scaleText || '',
                capacity:   src.capacity   || src.capacityMatrix   || src['ظرفیت'] || src.neglected_capacity || '',
                analysis:   src.analysis   || src.text             || src.deep_insight || '',
                cluster:    src.cluster    || src.detected_cluster || obs.analysis?.adminCluster || '',
                suggestedScore: src.suggestedScore || src.suggested_score || src.score || null,
                module:     src.module     || src.selectedModule   || src.selected_module || '',
                cultureMatch: src.cultureMatch || src.culture_match || src.hamfarhangi || null
            };
        }

        function normalizeAi3(obs) {
            // تحلیل/جمع‌بندی نهایی هوش مصنوعی سوم
            const src = obs.finalAnalysis || obs.analysis?.finalAnalysis || obs.ai3
                     || obs.ai3Summary || obs.analysis?.ai3Summary || null;
            if (!src) return null;
            if (typeof src === 'string') return { final: src };
            return {
                final: src.final || src.deep_insight || src['تحلیل نهایی']
                    || src.summary || src.conclusion || ''
            };
        }

        // ============================================================
        // ===== ساخت متن یکپارچه برای کپی/ترجمه =====
        // ============================================================
        function buildUnifiedText(obs) {
            const ai1 = normalizeAi1(obs);
            const ai2 = normalizeAi2(obs);
            const ai3 = normalizeAi3(obs);
            const clusterKey = ai2?.cluster || obs.analysis?.adminCluster || detectCluster(obs.observation);
            const clusterLabel = getClusterLabel(clusterKey);

            const L = [];
            L.push('═══════════════════════════════════════════');
            L.push(`OBSERVATION #${obs.number}`);
            L.push(`Tracking Code: ${obs.trackingCode || obs.cardCode || 'N/A'}`);
            L.push(`Date: ${obs.createdAt ? new Date(obs.createdAt).toISOString() : 'N/A'}`);
            L.push(`Cluster: ${clusterLabel}`);
            if (ai2?.suggestedScore) L.push(`AI Suggested Score: ${ai2.suggestedScore}`);
            L.push('═══════════════════════════════════════════');
            L.push('');
            L.push('▸ [1] RAW OBSERVATION (Member):');
            L.push(obs.observation || '-');
            L.push('');
            L.push('▸ [2] AI-1 — THREE-LEVEL GUIDANCE:');
            if (ai1) {
                if (ai1.individual)    L.push(`  📍 Individual:    ${ai1.individual}`);
                if (ai1.social)        L.push(`  🌐 Social:        ${ai1.social}`);
                if (ai1.institutional) L.push(`  🏛️ Institutional: ${ai1.institutional}`);
            } else L.push('  (Not analyzed yet)');
            L.push('');
            L.push('▸ [3] AI-2 — FIVE-LEVEL MATRIX + ANALYSIS:');
            if (ai2) {
                if (ai2.emergence)  L.push(`  📊 Emergence:  ${ai2.emergence}`);
                if (ai2.layer)      L.push(`  📊 Layers:     ${ai2.layer}`);
                if (ai2.connection) L.push(`  📊 Connections:${ai2.connection}`);
                if (ai2.scale)      L.push(`  📊 Scale:      ${ai2.scale}`);
                if (ai2.capacity)   L.push(`  📊 Capacity:   ${ai2.capacity}`);
                if (ai2.analysis)   { L.push(''); L.push(`  Analysis: ${ai2.analysis}`); }
                if (ai2.module)     L.push(`  📌 Selected Module: ${ai2.module}`);
                if (ai2.cultureMatch === false) L.push('  ⚠️ No cultural match found');
                else if (ai2.cultureMatch) L.push(`  ✅ Cultural match: ${ai2.cultureMatch}`);
            } else L.push('  (Not analyzed yet)');
            L.push('');
            L.push('▸ [4] AI-3 — FINAL SYNTHESIS:');
            L.push(ai3?.final || '(Not analyzed yet)');
            L.push('');
            L.push('═══════════════════════════════════════════');
            return L.join('\n');
        }

        // ============================================================
        // ===== بارگذاری =====
        // ============================================================
        async function loadObservations() {
            const container = document.getElementById('observationsList');
            container.innerHTML = '<div class="loading-state">در حال بارگذاری</div>';
            try {
                const response = await fetch('/api/get-connection-requests?type=observations&t=' + Date.now(), {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'خطا در دریافت مشاهدات');

                allObservations = data.observations || [];

                allObservations.forEach(o => {
                    if (o.analysis?.savedScore) {
                        localState[o.number] = {
                            score: o.analysis.savedScore,
                            saved: true,
                            finalized: o.status !== 'pending'
                        };
                    } else if (o.status && o.status !== 'pending') {
                        localState[o.number] = { finalized: true, saved: true, score: o.score || null };
                    }
                });

                updateStats();
                renderObservations();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty-state" style="color:#e74c3c;">خطا: ${escapeHtml(error.message)}</div>`;
            }
        }

        function updateStats() {
            const total = allObservations.length;
            const pending = allObservations.filter(o => o.status === 'pending').length;
            const approved = allObservations.filter(o => o.status === 'approved' && o.score !== 5).length;
            const score5 = allObservations.filter(o => o.score === 5).length;

            document.getElementById('totalObs').textContent = total.toLocaleString('fa-IR');
            document.getElementById('pendingObs').textContent = pending.toLocaleString('fa-IR');
            document.getElementById('approvedObs').textContent = approved.toLocaleString('fa-IR');
            document.getElementById('score5Obs').textContent = score5.toLocaleString('fa-IR');
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderObservations();
        }

        // ============================================================
        // ===== رندر =====
        // ============================================================
        function renderObservations() {
            const container = document.getElementById('observationsList');
            let filtered = allObservations;
            if (currentFilter === 'pending') filtered = filtered.filter(o => o.status === 'pending');
            else if (currentFilter === 'approved') filtered = filtered.filter(o => o.status === 'approved' && o.score !== 5);
            else if (currentFilter === 'score5') filtered = filtered.filter(o => o.score === 5);
            else if (currentFilter === 'rejected') filtered = filtered.filter(o => o.status === 'rejected');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ مشاهده‌ای با این وضعیت وجود ندارد</div>`;
                return;
            }
            container.innerHTML = filtered.map(obs => renderObservationCard(obs)).join('');
        }

        function renderObservationCard(obs) {
            const ai1 = normalizeAi1(obs);
            const ai2 = normalizeAi2(obs);
            const ai3 = normalizeAi3(obs);

            let clusterKey = ai2?.cluster || obs.analysis?.adminCluster || detectCluster(obs.observation || '');
            const clusterLabel = getClusterLabel(clusterKey);

            const statusMap = {
                approved: `<span class="badge badge-approved">✅ تایید شده</span>`,
                rejected: `<span class="badge badge-rejected">❌ رد شده</span>`,
                pending:  `<span class="badge badge-pending">⏳ در انتظار</span>`
            };
            const scoreBadge = obs.score === 5
                ? `<span class="badge badge-score-5">⭐ امتیاز ۵</span>`
                : (obs.score ? `<span class="badge" style="background:rgba(200,200,200,0.15);color:#888;">امتیاز ${obs.score}</span>` : '');
            const clusterBadge = clusterKey !== 'other'
                ? `<span class="badge badge-cluster">📂 ${escapeHtml(clusterLabel)}</span>` : '';

            let cardClass = 'obs-card';
            if (obs.status === 'pending') cardClass += ' pending';
            else if (obs.score === 5) cardClass += ' score5';
            else if (obs.status === 'approved') cardClass += ' approved';
            else if (obs.status === 'rejected') cardClass += ' rejected';

            // ===== ① مشاهده خام =====
            const block1 = `
                <div class="block block-1">
                    <div class="block-title">📝 ① مشاهده ثبت‌شده توسط عضو</div>
                    <div class="block-body">${escapeHtml(obs.observation || 'متن مشاهده موجود نیست')}</div>
                </div>`;

            // ===== ② AI1 =====
            let block2;
            if (ai1 && (ai1.individual || ai1.social || ai1.institutional)) {
                block2 = `
                    <div class="block block-2">
                        <div class="block-title">🤖 ② راهنمایی سه‌سطحی — هوش مصنوعی اول</div>
                        <div class="block-body">
                            ${ai1.individual ? `<div class="ai-level"><span class="level-head">📍 سطح فردی</span>${escapeHtml(ai1.individual)}</div>` : ''}
                            ${ai1.social ? `<div class="ai-level"><span class="level-head">🌐 سطح اجتماعی</span>${escapeHtml(ai1.social)}</div>` : ''}
                            ${ai1.institutional ? `<div class="ai-level"><span class="level-head">🏛️ سطح نهادی</span>${escapeHtml(ai1.institutional)}</div>` : ''}
                        </div>
                    </div>`;
            } else {
                block2 = `
                    <div class="block block-2">
                        <div class="block-title">🤖 ② راهنمایی سه‌سطحی — هوش مصنوعی اول</div>
                        <div class="block-body" style="opacity:0.6;">در انتظار تحلیل هوش مصنوعی اول...</div>
                    </div>`;
            }

            // ===== ③ AI2 =====
            let block3;
            if (ai2) {
                const cell = (label, val) => {
                    if (!val) return '';
                    const v = Array.isArray(val) ? val.join(' • ')
                            : (typeof val === 'object' ? JSON.stringify(val) : val);
                    return `<div class="matrix-cell"><span class="m-label">${label}</span>${escapeHtml(v)}</div>`;
                };
                const anyMatrix = ai2.emergence || ai2.layer || ai2.connection || ai2.scale || ai2.capacity;
                const badges = [];
                if (ai2.cluster) badges.push(`<span class="ai2-badge cluster">📂 ${escapeHtml(getClusterLabel(ai2.cluster))}</span>`);
                if (ai2.suggestedScore) badges.push(`<span class="ai2-badge score">⭐ امتیاز پیشنهادی: ${escapeHtml(ai2.suggestedScore)}</span>`);
                if (ai2.module) badges.push(`<span class="ai2-badge module">📌 ماژول: ${escapeHtml(ai2.module)}</span>`);
                if (ai2.cultureMatch === false) badges.push(`<span class="ai2-badge culture-no">⚠️ هم‌فرهنگی یافت نشد</span>`);
                else if (ai2.cultureMatch) badges.push(`<span class="ai2-badge culture-ok">✅ هم‌فرهنگی: ${escapeHtml(ai2.cultureMatch)}</span>`);

                block3 = `
                    <div class="block block-3">
                        <div class="block-title">🧠 ③ ماتریس ۵ سطحی + تحلیل — هوش مصنوعی دوم</div>
                        <div class="block-body">
                            ${anyMatrix ? `<div class="matrix-grid">
                                ${cell('📊 ظهورها', ai2.emergence)}
                                ${cell('📊 لایه‌ها', ai2.layer)}
                                ${cell('📊 ارتباطات', ai2.connection)}
                                ${cell('📊 مقیاس', ai2.scale)}
                                ${cell('📊 ظرفیت', ai2.capacity)}
                            </div>` : ''}
                            ${ai2.analysis ? `<div class="ai2-analysis"><strong>تحلیل:</strong> ${escapeHtml(ai2.analysis)}</div>` : ''}
                            ${badges.length ? `<div class="ai2-badges">${badges.join('')}</div>` : ''}
                        </div>
                    </div>`;
            } else {
                block3 = `
                    <div class="block block-3">
                        <div class="block-title">🧠 ③ ماتریس ۵ سطحی + تحلیل — هوش مصنوعی دوم</div>
                        <div class="block-body" style="opacity:0.6;">در انتظار تحلیل هوش مصنوعی دوم...</div>
                    </div>`;
            }

            // ===== ④ AI3 =====
            let block4;
            if (ai3?.final) {
                block4 = `
                    <div class="block block-4">
                        <div class="block-title">💎 ④ تحلیل نهایی — هوش مصنوعی سوم</div>
                        <div class="block-body">${escapeHtml(ai3.final)}</div>
                    </div>`;
            } else {
                block4 = `
                    <div class="block block-4">
                        <div class="block-title">💎 ④ تحلیل نهایی — هوش مصنوعی سوم</div>
                        <div class="block-body" style="opacity:0.6;">در انتظار تحلیل نهایی...</div>
                    </div>`;
            }

            // ===== state =====
            const st = localState[obs.number] || {};
            const isPending = obs.status === 'pending';
            const currentScore = st.score || obs.score || ai2?.suggestedScore || '';
            const isSaved = !!st.saved;
            const isFinalized = !!st.finalized || !isPending;

            // ===== ماژول ترتیبی =====
            const step1Class = isFinalized ? 'completed' : (isPending ? 'active' : 'locked');
            const step2Class = isFinalized ? 'completed' : (isPending && currentScore ? 'active' : 'locked');
            const step3Class = isFinalized ? 'completed' : (isPending && isSaved ? 'active' : 'locked');

            const modulesHtml = isPending ? `
                <div class="modules-container">
                    <div class="modules-title">⚙️ ماژول عملیات (به ترتیب انجام دهید)</div>

                    <div class="module-step ${step1Class}">
                        <div class="step-number">۱</div>
                        <div class="step-content">
                            <label>⭐ امتیازدهی:</label>
                            <select class="score-select" id="score-${obs.number}"
                                    onchange="onScoreChange('${obs.number}', this.value)"
                                    ${isFinalized ? 'disabled' : ''}>
                                <option value="">— انتخاب کنید —</option>
                                <option value="1" ${currentScore == 1 ? 'selected' : ''}>۱</option>
                                <option value="2" ${currentScore == 2 ? 'selected' : ''}>۲</option>
                                <option value="3" ${currentScore == 3 ? 'selected' : ''}>۳</option>
                                <option value="4" ${currentScore == 4 ? 'selected' : ''}>۴</option>
                                <option value="5" ${currentScore == 5 ? 'selected' : ''}>۵</option>
                            </select>
                            ${ai2?.suggestedScore ? `<span class="ai-suggest">پیشنهاد AI: ${escapeHtml(ai2.suggestedScore)}</span>` : ''}
                        </div>
                    </div>

                    <div class="module-step ${step2Class}">
                        <div class="step-number">۲</div>
                        <div class="step-content">
                            <label>💾 ذخیره تحلیل:</label>
                            <button class="btn-action btn-save" id="btn-save-${obs.number}"
                                    onclick="saveAnalysis('${obs.number}')"
                                    ${(!currentScore || isSaved || isFinalized) ? 'disabled' : ''}>
                                ${isSaved ? '✅ ذخیره شد' : '💾 ذخیره'}
                            </button>
                        </div>
                    </div>

                    <div class="module-step ${step3Class}">
                        <div class="step-number">۳</div>
                        <div class="step-content">
                            <label>🎯 عملیات نهایی:</label>
                            <button class="btn-action btn-atlas" onclick="finalizeObservation('${obs.number}', 'atlas')"
                                    ${(!isSaved || isFinalized) ? 'disabled' : ''}>✅ تایید برای اطلس ظهور</button>
                            <button class="btn-action btn-gallery" onclick="finalizeObservation('${obs.number}', 'gallery')"
                                    ${(!isSaved || isFinalized) ? 'disabled' : ''}>✅ تایید برای گالری نام‌آوران</button>
                            <button class="btn-action btn-reject" onclick="finalizeObservation('${obs.number}', 'reject')"
                                    ${(!isSaved || isFinalized) ? 'disabled' : ''}>❌ رد</button>
                        </div>
                    </div>
                </div>` : '';

            // ===== نوار کپی =====
            const copyToolbar = `
                <div class="copy-toolbar">
                    <button class="btn-copy" onclick="copyUnified('${obs.number}')">📋 کپی متن یکپارچه</button>
                    <button class="btn-copy save" onclick="copyUnified('${obs.number}', true)">💾 ذخیره در کلیپ‌بورد</button>
                    <span class="copy-hint">مناسب ارسال به مترجم (شامل ۴ بخش: مشاهده، AI1، AI2، AI3)</span>
                </div>`;

            const trackingCode = obs.trackingCode || obs.cardCode
                ? `<span class="tracking-code">🔗 ${escapeHtml(obs.trackingCode || obs.cardCode)}</span>` : '';

            return `
                <div class="${cardClass}" id="card-${obs.number}">
                    <div class="obs-header">
                        <div>
                            <span class="obs-code">#${obs.number} ${trackingCode}</span>
                            ${statusMap[obs.status] || ''}
                            ${scoreBadge}
                            ${clusterBadge}
                        </div>
                        <div class="obs-meta">${obs.createdAt ? new Date(obs.createdAt).toLocaleString('fa-IR') : ''}</div>
                    </div>

                    ${block1}
                    ${block2}
                    ${block3}
                    ${block4}
                    ${copyToolbar}
                    ${modulesHtml}
                </div>`;
        }

        // ============================================================
        // ===== عملیات ترتیبی =====
        // ============================================================
        window.onScoreChange = function(issueNumber, value) {
            if (!value) return;
            if (!localState[issueNumber]) localState[issueNumber] = {};
            localState[issueNumber].score = parseInt(value);
            localState[issueNumber].saved = false;
            rerenderCard(issueNumber);
        };

        window.saveAnalysis = async function(issueNumber) {
            const st = localState[issueNumber];
            if (!st || !st.score) { showToast('ابتدا امتیاز را انتخاب کنید.', 'error'); return; }

            const obs = allObservations.find(o => String(o.number) === String(issueNumber));
            if (!obs) return;

            const btn = document.getElementById(`btn-save-${issueNumber}`);
            if (btn) { btn.disabled = true; btn.textContent = '⏳ در حال ذخیره...'; }

            try {
                const analysis = obs.analysis || {};
                analysis.savedScore = st.score;

                const response = await fetch('/api/approve-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        issueNumber, action: 'save_analysis', type: 'observation',
                        analysis, score: st.score
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در ذخیره');

                localState[issueNumber].saved = true;
                showToast('✅ تحلیل ذخیره شد. حالا می‌توانید عملیات نهایی را انجام دهید.', 'success');
                rerenderCard(issueNumber);
            } catch (error) {
                showToast('❌ خطا: ' + error.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = '💾 ذخیره'; }
            }
        };

        window.finalizeObservation = async function(issueNumber, target) {
            const st = localState[issueNumber];
            if (!st || !st.saved) { showToast('ابتدا باید تحلیل را ذخیره کنید.', 'error'); return; }

            const targetNames = { atlas: 'اطلس ظهور', gallery: 'گالری نام‌آوران', reject: 'رد' };
            const confirmMsg = target === 'reject'
                ? 'آیا از رد این مشاهده اطمینان دارید؟'
                : `آیا از تایید این مشاهده برای ${targetNames[target]} اطمینان دارید؟`;
            if (!confirm(confirmMsg)) return;

            try {
                let action, extra = {};
                if (target === 'reject') action = 'reject_all';
                else { action = 'approve_all'; extra.target = target; }

                const response = await fetch('/api/approve-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ issueNumber, action, type: 'observation', ...extra })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در عملیات نهایی');

                localState[issueNumber].finalized = true;
                showToast(`✅ عملیات «${targetNames[target]}» با موفقیت انجام شد.`, 'success');
                loadObservations();
            } catch (error) { showToast('❌ خطا: ' + error.message, 'error'); }
        };

        // ============================================================
        // ===== کپی متن یکپارچه =====
        // ============================================================
        window.copyUnified = async function(issueNumber, saveMode = false) {
            const obs = allObservations.find(o => String(o.number) === String(issueNumber));
            if (!obs) { showToast('مشاهده یافت نشد.', 'error'); return; }
            const text = buildUnifiedText(obs);
            await copyToClipboard(text, saveMode ? 'متن در کلیپ‌بورد ذخیره شد' : 'متن یکپارچه کپی شد');
        };

        // ============================================================
        // ===== رندر مجدد یک کارت =====
        // ============================================================
        function rerenderCard(issueNumber) {
            const obs = allObservations.find(o => String(o.number) === String(issueNumber));
            if (!obs) return;
            const oldCard = document.getElementById(`card-${issueNumber}`);
            if (!oldCard) return;
            const temp = document.createElement('div');
            temp.innerHTML = renderObservationCard(obs);
            oldCard.replaceWith(temp.firstElementChild);
        }

        // ============================================================
        loadObservations();
    </script>
</body>
</html>
