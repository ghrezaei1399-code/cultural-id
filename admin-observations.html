<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت مشاهدات | داشبورد ادمین</title>
    <style>
        /* ===== استایل‌های قبلی ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark { background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%); color: #f0e8d0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        
        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active {
            background: rgba(212,175,55,0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        
        .observations-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 900px;
            overflow-y: auto;
            padding-left: 0.3rem;
            padding-right: 0.3rem;
        }
        .observations-list::-webkit-scrollbar {
            width: 6px;
        }
        .observations-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .observations-list::-webkit-scrollbar-thumb {
            background: rgba(212,175,55,0.3);
            border-radius: 10px;
        }
        
        .obs-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        body.dark .obs-card { background: rgba(0,0,0,0.15); }
        .obs-card:hover { background: rgba(255,255,255,0.08); }
        body.dark .obs-card:hover { background: rgba(255,255,255,0.02); }
        
        .obs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .obs-code {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #8a6d1f;
        }
        body.dark .obs-code { color: #f9e79f; }
        .obs-meta { font-size: 0.7rem; color: #888; }
        
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .badge-approved { background: rgba(50,200,50,0.15); color: #0a6a0a; }
        .badge-rejected { background: rgba(200,50,50,0.15); color: #6a1a1a; }
        .badge-pending { background: rgba(255,200,50,0.15); color: #8a7a0a; }
        .badge-edit {
            background: rgba(255, 140, 0, 0.25);
            color: #c65102;
            font-weight: 700;
        }
        
        .btn-small {
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin: 0.1rem;
        }
        .btn-approve { background: rgba(50,200,50,0.15); color: #0a6a0a; }
        body.dark .btn-approve { color: #82e0aa; }
        .btn-approve:hover { background: rgba(50,200,50,0.25); }
        .btn-reject { background: rgba(200,50,50,0.15); color: #6a1a1a; }
        body.dark .btn-reject { color: #f1948a; }
        .btn-reject:hover { background: rgba(200,50,50,0.25); }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        
        .obs-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        
        .scroll-hint {
            text-align: center;
            padding: 0.8rem;
            color: #888;
            font-size: 0.85rem;
            border-top: 1px solid rgba(212,175,55,0.1);
            margin-top: 0.5rem;
            font-weight: 700;
        }
        
        .btn-back-bottom {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(212,175,55,0.2);
            color: #8a6d1f;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        
        /* ===== استایل نمایش ویرایش‌ها ===== */
        .edit-changes-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 140, 0, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 140, 0, 0.2);
        }
        .edit-changes-box .title {
            font-weight: 700;
            color: #c65102;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .edit-changes-box .change-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: rgba(255,255,255,0.3);
            border-radius: 6px;
            margin-bottom: 0.3rem;
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        body.dark .edit-changes-box .change-item { background: rgba(0,0,0,0.1); }
        .edit-changes-box .change-item .field-name {
            font-weight: 700;
            color: #8a6d1f;
            min-width: 120px;
        }
        body.dark .edit-changes-box .change-item .field-name { color: #f9e79f; }
        .edit-changes-box .change-item .old-value {
            color: #888;
            text-decoration: line-through;
            background: rgba(200,50,50,0.05);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .edit-changes-box .change-item .arrow { color: #888; margin: 0 0.3rem; }
        .edit-changes-box .change-item .new-value {
            color: #27ae60;
            font-weight: 700;
            background: rgba(39,174,96,0.05);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .edit-changes-box .change-item .actions {
            display: flex;
            gap: 0.3rem;
        }
        
        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .edit-changes-box .change-item { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="admin.html" class="back-link">↩ بازگشت به داشبورد</a>
        </div>
        
        <h1 class="page-title">👁️ مدیریت مشاهدات</h1>
        <div class="page-subtitle">بررسی، تحلیل و امتیازدهی مشاهدات خام</div>
        
        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalObs">۰</span><div class="label">کل مشاهدات</div></div>
            <div class="stat-mini"><span class="number" id="pendingObs">۰</span><div class="label">⏳ در انتظار</div></div>
            <div class="stat-mini"><span class="number" id="approvedObs">۰</span><div class="label">✅ تایید شده</div></div>
            <div class="stat-mini"><span class="number" id="score5Obs">۰</span><div class="label">⭐ امتیاز ۵</div></div>
            <div class="stat-mini"><span class="number" id="editRequests">۰</span><div class="label">✏️ درخواست ویرایش</div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 همه</button>
            <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">⏳ در انتظار</button>
            <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')">✅ تایید شده</button>
            <button class="filter-btn" data-filter="score5" onclick="setFilter('score5')">⭐ امتیاز ۵</button>
            <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected')">❌ رد شده</button>
            <button class="filter-btn" data-filter="edit" onclick="setFilter('edit')">✏️ ویرایش</button>
        </div>
        
        <div id="observationsList" class="observations-list">
            <div class="empty-state">در حال بارگذاری...</div>
        </div>
        
        <div style="text-align:center; margin-top:2rem;">
            <a href="admin.html" class="btn-back-bottom">↩ بازگشت به پنل ادمین</a>
        </div>
    </div>
    
    <script>
        let allObservations = [];
        let allUsers = [];
        let currentFilter = 'all';
        
        async function loadData() {
            try {
                const obsResponse = await fetch('/api/get-connection-requests?type=observations');
                const obsData = await obsResponse.json();
                if (!obsResponse.ok) throw new Error(obsData.error || 'خطا در دریافت مشاهدات');
                allObservations = obsData.observations || [];
                
                const usersResponse = await fetch('/api/get-users?t=' + new Date().getTime());
                const usersData = await usersResponse.json();
                if (!usersResponse.ok) throw new Error(usersData.error || 'خطا در دریافت کاربران');
                allUsers = usersData.users || [];
                
                updateStats();
                renderObservations();
            } catch (error) {
                document.getElementById('observationsList').innerHTML = 
                    `<div class="empty-state" style="color:red;">خطا: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            const total = allObservations.length;
            const pending = allObservations.filter(o => o.status === 'pending').length;
            const approved = allObservations.filter(o => o.status === 'approved' && o.score !== 5).length;
            const score5 = allObservations.filter(o => o.score === 5).length;
            const editRequests = allUsers.filter(u => u.status === 'pending_edit').length;
            
            document.getElementById('totalObs').textContent = total;
            document.getElementById('pendingObs').textContent = pending;
            document.getElementById('approvedObs').textContent = approved;
            document.getElementById('score5Obs').textContent = score5;
            document.getElementById('editRequests').textContent = editRequests;
        }
        
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderObservations();
        }
        
        function renderObservations() {
            const container = document.getElementById('observationsList');
            
            if (currentFilter === 'edit') {
                renderEditRequests();
                return;
            }
            
            let filtered = allObservations;
            if (currentFilter === 'pending') {
                filtered = filtered.filter(o => o.status === 'pending');
            } else if (currentFilter === 'approved') {
                filtered = filtered.filter(o => o.status === 'approved' && o.score !== 5);
            } else if (currentFilter === 'score5') {
                filtered = filtered.filter(o => o.score === 5);
            } else if (currentFilter === 'rejected') {
                filtered = filtered.filter(o => o.status === 'rejected');
            }
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ مشاهده‌ای با این وضعیت وجود ندارد</div>`;
                return;
            }
            
            let html = filtered.map(obs => {
                // ===== کارت مشاهده =====
                const statusMap = {
                    approved: `<span class="badge badge-approved">✅ تایید شده</span>`,
                    rejected: `<span class="badge badge-rejected">❌ رد شده</span>`,
                    pending: `<span class="badge badge-pending">⏳ در انتظار</span>`
                };
                const scoreBadge = obs.score === 5 ? `<span class="badge badge-score-5">⭐ امتیاز ۵</span>` : '';
                
                return `
                    <div class="obs-card">
                        <div class="obs-header">
                            <div>
                                <span class="obs-code">#${obs.number} - ${obs.cardCode || 'ناشناس'}</span>
                                ${statusMap[obs.status] || ''}
                                ${scoreBadge}
                            </div>
                            <div class="obs-meta">${new Date(obs.createdAt).toLocaleString('fa-IR')}</div>
                        </div>
                        <div class="obs-body">
                            <p>${obs.observation || 'متن مشاهده موجود نیست'}</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            if (filtered.length > 5) {
                html += `<div class="scroll-hint">⬇️ ${filtered.length} مشاهده وجود دارد (اسکرول کنید)</div>`;
            }
            
            container.innerHTML = html;
        }
        
        // ===== رندر درخواست‌های ویرایش با جزئیات کامل =====
        function renderEditRequests() {
            const container = document.getElementById('observationsList');
            const editUsers = allUsers.filter(u => u.status === 'pending_edit');
            
            if (editUsers.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ درخواست ویرایشی وجود ندارد</div>`;
                return;
            }
            
            let html = editUsers.map(user => {
                const pendingChanges = user.pendingChanges || [];
                
                // ===== ساخت لیست تغییرات با جزئیات کامل =====
                const changesHtml = pendingChanges.map(field => {
                    let displayField = field;
                    let oldValue = '---';
                    let newValue = '---';
                    let isEmail = false;
                    let valueIndex = -1;
                    
                    // ===== تشخیص نوع فیلد =====
                    if (field === 'communicationEmail') {
                        displayField = '📧 ایمیل ارتباطی';
                        isEmail = true;
                        oldValue = user.oldData?.communicationEmail || 'ثبت نشده';
                        newValue = user.communicationEmail || 'ثبت نشده';
                    } else if (field.startsWith('value_')) {
                        valueIndex = parseInt(field.split('_')[1]);
                        displayField = `📋 ارزش فرهنگی ${valueIndex + 1}`;
                        oldValue = user.oldData?.values?.[valueIndex] || 'خالی';
                        newValue = user.values?.[valueIndex] || 'خالی';
                    } else if (field === 'values') {
                        displayField = '📋 همه ارزش‌ها';
                        oldValue = user.oldData?.values?.join('، ') || '---';
                        newValue = user.values?.join('، ') || '---';
                    }
                    
                    return `
                        <div class="change-item">
                            <span class="field-name">${displayField}</span>
                            <div>
                                <span class="old-value">${oldValue}</span>
                                <span class="arrow">➜</span>
                                <span class="new-value">${newValue}</span>
                            </div>
                            <div class="actions">
                                <button class="btn-small btn-approve" onclick="approveEdit('${user.cardCode}', '${field}')">✅</button>
                                <button class="btn-small btn-reject" onclick="rejectEdit('${user.cardCode}', '${field}')">❌</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                return `
                    <div class="obs-card" style="border-color: #ff8c00; border-width: 2px;">
                        <div class="obs-header">
                            <div>
                                <span class="obs-code">✏️ ${user.cardCode}</span>
                                <span class="badge badge-edit">در انتظار ویرایش</span>
                                <span style="font-size:0.7rem;color:#888;margin-right:0.5rem;">${pendingChanges.length} تغییر</span>
                            </div>
                            <div class="obs-meta">${user.lastEditRequest ? new Date(user.lastEditRequest).toLocaleString('fa-IR') : ''}</div>
                        </div>
                        
                        <!-- ===== نمایش تمام تغییرات ===== -->
                        <div class="edit-changes-box">
                            <div class="title">📝 تغییرات درخواستی (${pendingChanges.length} مورد):</div>
                            ${changesHtml}
                        </div>
                        
                        <div class="obs-actions">
                            <button class="btn-small btn-approve" onclick="approveAllEdits('${user.cardCode}')">✅ تایید همه</button>
                            <button class="btn-small btn-reject" onclick="rejectAllEdits('${user.cardCode}')">❌ رد همه</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }
        
        // ===== توابع تایید/رد =====
        async function approveEdit(cardCode, field) {
            if (!confirm(`آیا از تایید ویرایش "${field}" برای کاربر ${cardCode} اطمینان دارید؟`)) return;
            
            try {
                const response = await fetch('/api/update-user-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode,
                        action: 'approve_edit',
                        field: field
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در تایید ویرایش');
                alert('✅ ویرایش با موفقیت تایید شد.');
                loadData();
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }
        
        async function rejectEdit(cardCode, field) {
            if (!confirm(`آیا از رد ویرایش "${field}" برای کاربر ${cardCode} اطمینان دارید؟`)) return;
            
            try {
                const response = await fetch('/api/update-user-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode,
                        action: 'reject_edit',
                        field: field
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در رد ویرایش');
                alert('❌ ویرایش با موفقیت رد شد.');
                loadData();
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }
        
        async function approveAllEdits(cardCode) {
            if (!confirm(`آیا از تایید همه ویرایش‌های کاربر ${cardCode} اطمینان دارید؟`)) return;
            
            try {
                const response = await fetch('/api/update-user-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode,
                        action: 'approve_all_edits'
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در تایید ویرایش‌ها');
                alert('✅ همه ویرایش‌ها با موفقیت تایید شدند.');
                loadData();
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }
        
        async function rejectAllEdits(cardCode) {
            if (!confirm(`آیا از رد همه ویرایش‌های کاربر ${cardCode} اطمینان دارید؟`)) return;
            
            try {
                const response = await fetch('/api/update-user-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode,
                        action: 'reject_all_edits'
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'خطا در رد ویرایش‌ها');
                alert('❌ همه ویرایش‌ها با موفقیت رد شدند.');
                loadData();
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }
        
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
