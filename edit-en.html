<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Information | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #8a6d1f;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f9e79f; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #6a5a3a;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        
        .warning-box {
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid #ff8c00;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #b85a00;
            font-weight: 700;
            display: none;
        }
        body.dark .warning-box { background: rgba(255, 140, 0, 0.05); color: #f9e79f; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.5);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input {
            background: rgba(0,0,0,0.15);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.15);
        }
        .form-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        .value-item {
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(212,175,55,0.15);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        body.dark .value-item { background: rgba(0,0,0,0.1); }
        .value-item .value-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #8a6d1f;
            min-width: 100px;
        }
        body.dark .value-item .value-label { color: #f9e79f; }
        .value-item .value-input {
            flex: 1;
            min-width: 150px;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.3);
            font-family: inherit;
            font-size: 0.85rem;
            color: #1a0a0a;
            outline: none;
        }
        body.dark .value-item .value-input {
            background: rgba(0,0,0,0.1);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.1);
        }
        .value-item .value-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #f9e79f);
            color: #2a1a0a;
            box-shadow: 0 4px 15px rgba(212,175,55,0.25);
        }
        body.dark .btn-primary { background: linear-gradient(135deg, #8a6d1f, #d4af37); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(212,175,55,0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-success {
            background: rgba(39,174,96,0.15);
            color: #1e7a1e;
            border: 1px solid rgba(39,174,96,0.2);
        }
        body.dark .btn-success { color: #82e0aa; background: rgba(39,174,96,0.05); }
        
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50,200,50,0.05);
            border: 1px solid rgba(50,200,50,0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success { color: #80b080; }
        .message-box.error {
            display: block;
            background: rgba(200,50,50,0.05);
            border: 1px solid rgba(200,50,50,0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error { color: #b08080; }
        
        .back-row { display: flex; justify-content: center; margin-top: 2rem; }
        .btn-back {
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            background: rgba(255,255,255,0.3);
            color: #0a0a1a;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        body.dark .btn-back { color: #f0e8d0; background: rgba(0,0,0,0.1); }
        .btn-back:hover { background: rgba(255,255,255,0.5); transform: translateY(-2px); }
        body.dark .btn-back:hover { background: rgba(255,255,255,0.05); }
        
        .code-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.5);
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 1px;
            color: #1a0a0a;
            outline: none;
            transition: 0.3s;
        }
        body.dark .code-input {
            background: rgba(0,0,0,0.15);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.15);
        }
        .code-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        .result-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            animation: fadeIn 0.5s ease;
        }
        .result-box.success {
            display: block;
            background: rgba(39,174,96,0.08);
            border: 2px solid rgba(39,174,96,0.3);
        }
        body.dark .result-box.success { background: rgba(39,174,96,0.03); border-color: rgba(39,174,96,0.15); }
        .result-box .icon { font-size: 2rem; display: block; text-align: center; margin-bottom: 0.3rem; }
        .result-box .title {
            font-weight: 800;
            font-size: 1.1rem;
            text-align: center;
            color: #1e7a1e;
        }
        body.dark .result-box .title { color: #82e0aa; }
        .result-box .message {
            text-align: center;
            color: #4a3a2a;
            font-size: 0.9rem;
            margin-top: 0.3rem;
            line-height: 1.8;
        }
        body.dark .result-box .message { color: #d0c0b0; }
        .result-box .tracking {
            text-align: center;
            font-family: monospace;
            font-size: 0.9rem;
            color: #2874a6;
            padding: 0.3rem;
            background: rgba(40,116,166,0.05);
            border-radius: 6px;
            margin-top: 0.5rem;
        }
        body.dark .result-box .tracking { color: #85c1e9; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .value-item { flex-direction: column; align-items: stretch; }
            .value-item .value-label { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">✏️ Edit Information</h1>
        <div class="page-subtitle">Edit cultural values and communication details</div>
        
        <div id="globalWarning" class="warning-box">
            ⚠️ Warning: You have only <strong>one opportunity</strong> to request an edit.
        </div>

        <div id="messageBox" class="message-box"></div>
        
        <!-- ===== Step 1: Code Entry ===== -->
        <div id="step1">
            <div class="form-group">
                <label>🔑 Cultural Identity Card Code</label>
                <input type="text" id="cardCode" class="code-input" placeholder="e.g., CIM-1234-5678-ABCDE" />
            </div>
            <button class="btn btn-primary" onclick="checkEligibility()" style="width:100%">Check Eligibility</button>
            <div class="back-row">
                <a href="index-en.html" class="btn-back">↩ Back to Home</a>
            </div>
        </div>

        <!-- ===== Step 2: Edit Form ===== -->
        <div id="step2" style="display:none; margin-top: 2rem;">
            <div class="form-group">
                <label>📧 Communication Email</label>
                <div class="value-item">
                    <span class="value-label">Email:</span>
                    <input type="email" id="emailInput" class="value-input" placeholder="Enter your email" />
                    <button class="btn btn-success" onclick="requestEdit('communicationEmail')">💾 Save Email</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>📋 Cultural Values (7 Values)</label>
                <div id="valuesContainer"></div>
            </div>
            
            <div class="back-row">
                <a href="index-en.html" class="btn-back">↩ Back to Home</a>
            </div>
        </div>

        <!-- ===== Result Box ===== -->
        <div id="resultBox" class="result-box">
            <span class="icon" id="resultIcon">✅</span>
            <div class="title" id="resultTitle">Edit Request Submitted</div>
            <div class="message" id="resultMessage">Your changes have been successfully saved and are pending admin approval.</div>
            <div class="tracking" id="resultTracking"></div>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }
        
        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message-box';
        }
        
        function showResult(title, message, trackingCode) {
            const box = document.getElementById('resultBox');
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultTracking').textContent = trackingCode ? `🔗 Tracking Code: ${trackingCode}` : '';
            box.className = 'result-box success';
            box.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        async function checkEligibility() {
            const cardCode = document.getElementById('cardCode').value.trim();
            if (!cardCode) { showMessage('❌ Please enter your card code.', 'error'); return; }
            
            document.getElementById('globalWarning').style.display = 'block';
            hideMessage();
            document.getElementById('resultBox').style.display = 'none';

            try {
                const response = await fetch('/api/get-users?t=' + new Date().getTime());
                const data = await response.json();
                const user = data.users.find(u => u.cardCode === cardCode);
                
                if (!user) throw new Error('User with this code not found.');
                if (user.lastEditRequest) throw new Error('❌ You have already requested an edit.');
                
                currentUser = user;
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                
                document.getElementById('emailInput').value = user.communicationEmail || '';
                const container = document.getElementById('valuesContainer');
                container.innerHTML = '';
                (user.values || []).forEach((val, i) => {
                    container.innerHTML += `
                        <div class="value-item">
                            <span class="value-label">Value ${i+1}:</span>
                            <input type="text" id="v-${i}" class="value-input" value="${val}" />
                            <button class="btn btn-success" onclick="requestEdit('value_${i}')">💾 Save</button>
                        </div>`;
                });
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // ===== Edit Request (Updated) =====
        async function requestEdit(field) {
            if (!currentUser) return;
            
            const cardCode = document.getElementById('cardCode').value.trim();
            let newValue;
            
            if (field === 'communicationEmail') {
                newValue = document.getElementById('emailInput').value.trim();
            } else {
                const index = parseInt(field.split('_')[1]);
                newValue = document.getElementById(`v-${index}`).value.trim();
            }
            
            if (!newValue) {
                showMessage('❌ Please enter a new value.', 'error');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Sending...';
            hideMessage();

            try {
                const response = await fetch('/api/update-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode: cardCode,
                        field: field,
                        newValue: newValue
                    })
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Error saving changes');
                
                const fieldLabels = {
                    'communicationEmail': 'Communication Email',
                    'value_0': 'Value 1',
                    'value_1': 'Value 2',
                    'value_2': 'Value 3',
                    'value_3': 'Value 4',
                    'value_4': 'Value 5',
                    'value_5': 'Value 6',
                    'value_6': 'Value 7'
                };
                
                showResult(
                    '✅ Edit Request Submitted',
                    `Change to "${fieldLabels[field] || field}" has been saved and is pending admin approval.`,
                    result.trackingCode || '---'
                );
                
                btn.textContent = '✅ Sent';
                btn.disabled = true;
                
                document.querySelectorAll('#step2 .btn-success').forEach(b => b.disabled = true);
                document.querySelectorAll('#step2 .value-input').forEach(i => i.disabled = true);
                document.getElementById('emailInput').disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'index-en.html';
                }, 4000);
                
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '💾 Save';
            }
        }
    </script>
</body>
</html>
