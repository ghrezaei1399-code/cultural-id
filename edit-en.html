<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Info | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #8a6d1f;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f9e79f; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #6a5a3a;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2a1a0a;
            margin-bottom: 0.3rem;
        }
        body.dark .form-group label { color: #e8d8c8; }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.5);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input {
            background: rgba(0,0,0,0.15);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.15);
        }
        .form-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        .value-item {
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(212,175,55,0.15);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        body.dark .value-item { background: rgba(0,0,0,0.1); }
        .value-item .value-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #8a6d1f;
            min-width: 100px;
        }
        body.dark .value-item .value-label { color: #f9e79f; }
        .value-item .value-input {
            flex: 1;
            min-width: 150px;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.3);
            font-family: inherit;
            font-size: 0.85rem;
            color: #1a0a0a;
            outline: none;
        }
        body.dark .value-item .value-input {
            background: rgba(0,0,0,0.1);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.1);
        }
        .value-item .value-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #f9e79f);
            color: #2a1a0a;
            box-shadow: 0 4px 15px rgba(212,175,55,0.25);
        }
        body.dark .btn-primary { background: linear-gradient(135deg, #8a6d1f, #d4af37); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(212,175,55,0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.5);
            color: #4a3a2a;
            border: 1px solid rgba(212,175,55,0.3);
        }
        body.dark .btn-secondary { background: rgba(0,0,0,0.2); color: #f0e8d0; }
        .btn-secondary:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
        body.dark .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .btn-success {
            background: rgba(39,174,96,0.15);
            color: #1e7a1e;
            border: 1px solid rgba(39,174,96,0.2);
        }
        body.dark .btn-success { color: #82e0aa; background: rgba(39,174,96,0.05); }
        .btn-success:hover { background: rgba(39,174,96,0.25); }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn-group .btn { flex: 1; min-width: 140px; }
        
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .message-box.success {
            display: block;
            background: rgba(50,200,50,0.05);
            border: 1px solid rgba(50,200,50,0.05);
            color: #0a5a0a;
        }
        .message-box.error {
            display: block;
            background: rgba(200,50,50,0.05);
            border: 1px solid rgba(200,50,50,0.05);
            color: #5a0a0a;
        }
        .message-box.info {
            display: block;
            background: rgba(50,150,200,0.05);
            border: 1px solid rgba(50,150,200,0.05);
            color: #0a4a6a;
        }
        
        .note {
            font-size: 0.7rem;
            color: #6a5a3a;
            margin-top: 1.5rem;
            text-align: center;
            opacity: 0.6;
        }
        body.dark .note { color: #a8a8b8; }
        
        .back-row { display: flex; justify-content: center; margin-top: 2rem; }
        .btn-back {
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            background: rgba(255,255,255,0.3);
            color: #0a0a1a;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        body.dark .btn-back { color: #f0e8d0; background: rgba(0,0,0,0.1); }
        .btn-back:hover { background: rgba(255,255,255,0.5); transform: translateY(-2px); }
        body.dark .btn-back:hover { background: rgba(255,255,255,0.05); }
        
        .code-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid rgba(212,175,55,0.2);
            background: rgba(255,255,255,0.5);
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 1px;
            color: #1a0a0a;
            outline: none;
            transition: 0.3s;
        }
        body.dark .code-input {
            background: rgba(0,0,0,0.15);
            color: #f0e8d0;
            border-color: rgba(212,175,55,0.15);
        }
        .code-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.08);
        }
        
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .value-item { flex-direction: column; align-items: stretch; }
            .value-item .value-label { min-width: auto; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">✏️ Edit Information</h1>
        <div class="page-subtitle">Edit cultural values and contact information</div>
        
        <div id="messageBox" class="message-box"></div>
        
        <div class="form-group">
            <label>🔑 Cultural Identity Card Code</label>
            <input type="text" id="cardCode" class="code-input" placeholder="e.g. CIM-1234-5678-ABCDE" />
        </div>
        
        <button class="btn btn-primary" id="loadBtn" onclick="loadUserData()" style="width:100%;">🔍 Load Data</button>
        
        <div id="editSection" style="display:none; margin-top: 2rem;">
            <div class="form-group">
                <label>📧 Communication Email</label>
                <div class="value-item">
                    <span class="value-label">Email:</span>
                    <input type="email" id="emailInput" class="value-input" placeholder="Enter your email" />
                    <button class="btn btn-success" onclick="saveField('email')">💾 Save Email</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>📋 Cultural Values (7 values)</label>
                <div id="valuesContainer"></div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="window.location.href='index-en.html'">↩ Back</button>
            </div>
        </div>
        
        <div class="back-row">
            <a href="index-en.html" class="btn-back">↩ Back to Home</a>
        </div>
        
        <div class="note">
            🔒 Each change is saved separately and will be applied after admin approval.
        </div>
    </div>
    
    <script>
        let currentUser = null;
        
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }
        
        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message-box';
        }
        
        async function loadUserData() {
            const cardCode = document.getElementById('cardCode').value.trim();
            if (!cardCode) {
                showMessage('Please enter your card code.', 'error');
                return;
            }
            
            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Loading...';
            hideMessage();
            
            try {
                const response = await fetch('/api/get-user?cardCode=' + encodeURIComponent(cardCode));
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || 'Error loading data');
                }
                
                currentUser = result.user;
                displayUserData(currentUser);
                document.getElementById('editSection').style.display = 'block';
                showMessage('✅ User data loaded.', 'success');
                
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }
            
            btn.disabled = false;
            btn.textContent = '🔍 Load Data';
        }
        
        function displayUserData(user) {
            document.getElementById('emailInput').value = user.communicationEmail || '';
            
            const container = document.getElementById('valuesContainer');
            container.innerHTML = '';
            
            const values = user.values || [];
            const priorities = user.priorities || [];
            
            for (let i = 0; i < 7; i++) {
                const val = values[i] || '';
                const priority = priorities[i] || 0;
                
                const div = document.createElement('div');
                div.className = 'value-item';
                div.innerHTML = `
                    <span class="value-label">Value ${i+1}:</span>
                    <input type="text" id="value-${i}" class="value-input" value="${val}" placeholder="Value ${i+1}" />
                    <span class="value-label">Priority (1-7):</span>
                    <input type="number" id="priority-${i}" class="value-input" value="${priority}" min="1" max="7" placeholder="Priority" style="max-width:80px;" />
                    <button class="btn btn-success" onclick="saveValue(${i})">💾 Save</button>
                `;
                container.appendChild(div);
            }
        }
        
        async function saveField(field) {
            const cardCode = document.getElementById('cardCode').value.trim();
            if (!cardCode || !currentUser) {
                showMessage('Please load user data first.', 'error');
                return;
            }
            
            hideMessage();
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Saving...';
            
            try {
                let updateData = { cardCode };
                
                if (field === 'email') {
                    const email = document.getElementById('emailInput').value.trim();
                    updateData.communicationEmail = email;
                }
                
                const response = await fetch('/api/update-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'Error saving changes');
                }
                
                showMessage('✅ Changes saved. Waiting for admin approval.', 'success');
                
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }
            
            btn.disabled = false;
            btn.textContent = '💾 Save';
        }
        
        async function saveValue(index) {
            const cardCode = document.getElementById('cardCode').value.trim();
            if (!cardCode || !currentUser) {
                showMessage('Please load user data first.', 'error');
                return;
            }
            
            hideMessage();
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Saving...';
            
            try {
                const value = document.getElementById(`value-${index}`).value.trim();
                const priority = parseInt(document.getElementById(`priority-${index}`).value) || 0;
                
                const values = [...(currentUser.values || [])];
                const priorities = [...(currentUser.priorities || [])];
                
                values[index] = value;
                priorities[index] = priority;
                
                const response = await fetch('/api/update-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardCode,
                        values,
                        priorities,
                        updateIndex: index
                    })
                });
                
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'Error saving changes');
                }
                
                currentUser.values = values;
                currentUser.priorities = priorities;
                
                showMessage(`✅ Value ${index+1} saved. Waiting for admin approval.`, 'success');
                
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }
            
            btn.disabled = false;
            btn.textContent = '💾 Save';
        }
    </script>
</body>
</html>
