<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Atlas of Emergence & Notable Gallery | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            background-attachment: fixed;
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f0e8d0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        body.dark .container {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
            padding: 0.3rem;
        }
        .gallery-grid::-webkit-scrollbar { width: 6px; }
        .gallery-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 10px; }
        .gallery-card {
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        body.dark .gallery-card { background: rgba(0,0,0,0.15); }
        .gallery-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); }
        body.dark .gallery-card:hover { background: rgba(255,255,255,0.02); }
        .gallery-card.atlas { border-color: rgba(212,175,55,0.3); }
        .gallery-card.achievement { border-color: rgba(40,116,166,0.3); }
        .card-media {
            height: 180px;
            background: rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .card-media { background: rgba(0,0,0,0.2); }
        .card-media img, .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-media .no-media {
            font-size: 3rem;
            color: #888;
        }
        .card-content { padding: 1rem; }
        .card-title { font-weight: 800; color: #0a0a1a; font-size: 0.95rem; margin-bottom: 0.3rem; }
        body.dark .card-title { color: #f0e8e0; }
        .card-desc {
            font-size: 0.8rem;
            color: #4a4a5a;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .card-desc { color: #b0b0c0; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .card-meta .card-owner { font-weight: 700; color: #2874a6; }
        body.dark .card-meta .card-owner { color: #85c1e9; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .badge-atlas { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        .badge-achievement { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-atlas { color: #f9e79f; background: rgba(212,175,55,0.1); }
        body.dark .badge-achievement { color: #85c1e9; background: rgba(40,116,166,0.05); }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active {
            background: rgba(212,175,55,0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #0a0a1a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0,0,0,0.2); }
        .theme-toggle:hover { transform: scale(1.1); }
        
        /* Full Profile Button Style */
        .btn-full-profile {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.4rem;
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #8a6d1f;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }
        .btn-full-profile:hover { background: rgba(212,175,55,0.2); }
        body.dark .btn-full-profile { color: #f9e79f; border-color: #f9e79f; }

        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index-en.html" class="back-link">↩ Back to Home</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>

        <h1 class="page-title">🏛️ Atlas of Emergence & Notable Gallery</h1>
        <div class="page-subtitle">Selected observations with score 5 and approved notable achievements</div>

        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalAtlas">۰</span><div class="label">🏛️ Atlas</div></div>
            <div class="stat-mini"><span class="number" id="totalAchievements">۰</span><div class="label">🏆 Notable</div></div>
            <div class="stat-mini"><span class="number" id="totalItems">۰</span><div class="label">📋 Total</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 All</button>
            <button class="filter-btn" data-filter="atlas" onclick="setFilter('atlas')">🏛️ Atlas</button>
            <button class="filter-btn" data-filter="achievement" onclick="setFilter('achievement')">🏆 Notable</button>
        </div>

        <div id="galleryGrid" class="gallery-grid">
            <div class="empty-state">Loading...</div>
        </div>
    </div>
   <script>
let allApproved = [];
let allAtlasItems = [];
let currentModalItem = null;

function normalizeGuide(item) {
    if (item.guide && (item.guide.individual || item.guide.network || item.guide.policy)) {
        return {
            individual: item.guide.individual || '',
            social: item.guide.network || '',
            institutional: item.guide.policy || ''
        };
    }
    if (item.analysis && item.analysis.guide) {
        return {
            individual: item.analysis.guide.individual || '',
            social: item.analysis.guide.network || '',
            institutional: item.analysis.guide.policy || ''
        };
    }
    return null;
}

function normalizeMatrix(item) {
    if (item.matrix_emergence || item.matrix_layers || item.matrix_connections ||
        item.matrix_scale || item.matrix_capacity) {
        return {
            emergence: item.matrix_emergence || '',
            layer: item.matrix_layers || '',
            connection: item.matrix_connections || '',
            scale: item.matrix_scale || '',
            capacity: item.matrix_capacity || '',
            analysis: item.analysis || '',
            cluster: item.cluster || '',
            score: item.score || null
        };
    }
    return null;
}

function normalizeAi3(item) {
    return item.ai3Final || '';
}

async function loadAchievements() {
    const container = document.getElementById('achievementsListContainer');
    try {
        const res = await fetch('/api/get-users?t=' + new Date().getTime());
        if (!res.ok) throw new Error('Server connection error');
        const data = await res.json();
        allApproved = data.achievements || [];
        renderAchievements(allApproved);
    } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state">Error loading data.</div>';
    }
}

function renderAchievements(items) {
    const container = document.getElementById('achievementsListContainer');
    const filter = document.getElementById('categoryFilter').value;
    let filtered = filter === 'all' ? items : items.filter(item => item.category === filter);
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No approved achievements yet.</div>';
        return;
    }
    container.innerHTML = filtered.map((item, index) => `
        <div class="achievement-item" onclick="openModal(${index})">
            <div class="item-info">
                <h4>${item.title || 'Untitled'}</h4>
                <span class="item-meta">${item.category === 'science' ? '📄 Article' : item.category === 'art' ? '🎨 Art' : '🎬 Media'}</span>
            </div>
            <span style="font-size:0.9rem; color:#d4af37;">👁️ View</span>
        </div>
    `).join('');
}

function filterAchievements() { renderAchievements(allApproved); }

async function loadAtlas() {
    const container = document.getElementById('atlasListContainer');
    try {
        const res = await fetch('/api/get-connection-requests?type=observations&t=' + new Date().getTime());
        if (!res.ok) throw new Error('Error loading atlas');
        const data = await res.json();
        allAtlasItems = (data.observations || []).filter(obs => obs.status === 'approved');
        renderAtlas(allAtlasItems);
    } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state">Error loading atlas.</div>';
    }
}

function renderAtlas(items) {
    const container = document.getElementById('atlasListContainer');
    if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">No score 5 solutions registered yet.</div>';
        return;
    }
    container.innerHTML = items.map((item, index) => {
        const moduleStatus = item.moduleStatus || 'pending';
        const moduleType = item.moduleType || '';
        
        const statusLabels = {
            'success': '✅ Successful', 'revision': '⚠️ Needs Revision', 'failed': '❌ Failed',
            'pending': '⏳ Pending', 'no_peers': '⚠️ No Peers Found',
            'no_related': '⚠️ No Related Observations'
        };
        const statusText = statusLabels[moduleStatus] || moduleStatus;
        const statusClass = moduleStatus === 'success' ? 'success' :
                           moduleStatus === 'revision' ? 'revision' :
                           moduleStatus === 'failed' ? 'failed' :
                           moduleStatus === 'pending' ? 'pending' : 'no_peers';
        
        const moduleNames = {
            'collaboration': '🤝 Collaborate',
            'related': '👁️ Related Views',
            'referral': '📤 Refer to 5 Peers'
        };
        const moduleDisplay = moduleNames[moduleType] || moduleType || '';
        
        return `
            <div class="achievement-item" onclick="openAtlasModal(${index})">
                <div class="item-info">
                    <h4>${item.observation ? item.observation.substring(0, 50) + '...' : 'Observation'}</h4>
                    <span class="item-meta">⭐ Score ${item.score || '---'}</span>
                    ${moduleDisplay ? `<span class="module-type-label">${moduleDisplay}</span>` : ''}
                    <span class="module-status-badge ${statusClass}">${statusText}</span>
                </div>
                <span style="font-size:0.9rem; color:#6a3d9a;">🏛️ Details</span>
            </div>
        `;
    }).join('');
}

function openModal(index) {
    const item = allApproved[index];
    if (!item) return;
    currentModalItem = item;
    document.getElementById('modalTitle').textContent = item.title || 'Untitled';
    let descText = item.description || 'No description available';
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    descText = descText.replace(urlRegex, url => `<a href="${url}" target="_blank" style="color:#2874a6; text-decoration:underline;">${url}</a>`);
    document.getElementById('modalDesc').innerHTML = descText;
    document.getElementById('modalMeta').textContent = `Submitted by: ${item.owner}`;
    document.getElementById('modalGuide').style.display = 'none';
    document.getElementById('modalFeedback').style.display = 'none';
    document.getElementById('modalModule').style.display = 'none';
    const mediaDiv = document.getElementById('modalMediaContainer');
    const imageUrl = item.fileUrl || item.fileData;
    if (imageUrl) {
        mediaDiv.innerHTML = `<img src="${imageUrl}" class="modal-media" style="width:100%;max-height:250px;object-fit:contain;background:#1a1a1a;" onerror="this.outerHTML='<p style=\\'padding:1rem;text-align:center;color:#888;\\'>❌ Image not available</p>'"/>`;
    } else {
        mediaDiv.innerHTML = '<p style="padding:1rem;text-align:center;color:#888;">📄 No file attached</p>';
    }
    document.getElementById('detailModal').classList.add('active');
}

function openAtlasModal(index) {
    const item = allAtlasItems[index];
    if (!item) return;
    currentModalItem = item;
    
    document.getElementById('modalTitle').textContent = '🏛️ Atlas of Emergence Profile';
    document.getElementById('modalDesc').innerHTML = '';
    document.getElementById('modalMeta').textContent = `⭐ Score: ${item.score || '---'} | Status: ${item.status === 'approved' ? '✅ Approved' : '⏳ Pending'}`;
    
    const mediaDiv = document.getElementById('modalMediaContainer');
    mediaDiv.innerHTML = '';
    
    const moduleDiv = document.getElementById('modalModule');
    const moduleType = item.moduleType || '';
    const moduleStatus = item.moduleStatus || 'pending';
    const moduleData = item.moduleData || [];
    const moduleAnalysis = item.moduleAnalysis || '';
    
    const moduleNames = {
        'collaboration': '🤝 Collaborate',
        'related': '👁️ Related Views',
        'referral': '📤 Refer to 5 Peers'
    };
    const moduleDisplay = moduleNames[moduleType] || moduleType || 'None';
    
    const statusLabels = {
        'success': '✅ Successful', 'revision': '⚠️ Needs Revision', 'failed': '❌ Failed',
        'pending': '⏳ Pending', 'no_peers': '⚠️ No Peers Found',
        'no_related': '⚠️ No Related Observations'
    };
    const statusText = statusLabels[moduleStatus] || moduleStatus;
    const statusClass = moduleStatus === 'success' ? 'success' :
                       moduleStatus === 'revision' ? 'revision' :
                       moduleStatus === 'failed' ? 'failed' :
                       moduleStatus === 'pending' ? 'pending' : 'no_peers';
    
    if (moduleType) {
        moduleDiv.style.display = 'block';
        document.getElementById('modalModuleType').textContent = moduleDisplay;
        document.getElementById('modalModuleStatus').innerHTML = `<span class="module-status-badge ${statusClass}">${statusText}</span>`;
        document.getElementById('modalModuleData').textContent = moduleData.length > 0 ? `Results: ${moduleData.join(', ')}` : '';
        document.getElementById('modalModuleAnalysis').textContent = moduleAnalysis || '';
    } else {
        moduleDiv.style.display = 'none';
    }
    
    const guideBox = document.getElementById('modalGuide');
    const guideContent = document.getElementById('guideContent');
    
    const guide = normalizeGuide(item);
    const matrix = normalizeMatrix(item);
    const ai3Final = normalizeAi3(item);
    
    const clusterNames = {
        'human': 'Human', 'knowledge': 'Knowledge & Technology',
        'governance': 'Governance & Civilization', 'survival': 'Survival & Future',
        'other': 'Unknown'
    };
    
    let html = '';
    
    html += `
        <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(212,175,55,0.08); border-radius:10px; border-left:4px solid #d4af37;">
            <div style="font-weight:800; font-size:0.85rem; color:#8a6d1f; margin-bottom:0.4rem;">📝 Registered Observation</div>
            <div style="font-size:0.85rem; line-height:1.8;">${item.observation || '---'}</div>
        </div>`;
    
    if (guide) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(16,185,129,0.06); border-radius:10px; border-left:4px solid #10b981;">
                <div style="font-weight:800; font-size:0.85rem; color:#047857; margin-bottom:0.4rem;">🤖 AI-1 — Three-Level Guidance</div>
                ${guide.individual ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>📍 Individual:</strong> ${guide.individual}</div>` : ''}
                ${guide.social ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>🌐 Social:</strong> ${guide.social}</div>` : ''}
                ${guide.institutional ? `<div style="font-size:0.82rem; line-height:1.7;"><strong>🏛️ Institutional:</strong> ${guide.institutional}</div>` : ''}
            </div>`;
    }
    
    if (matrix && (matrix.emergence || matrix.layer || matrix.connection || matrix.scale || matrix.capacity || matrix.analysis)) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(99,102,241,0.06); border-radius:10px; border-left:4px solid #6366f1;">
                <div style="font-weight:800; font-size:0.85rem; color:#4338ca; margin-bottom:0.4rem;">
                    🧠 AI-2 — Five-Level Matrix
                    ${matrix.cluster ? `<span style="background:rgba(212,175,55,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem; margin-left:0.3rem;">📂 ${clusterNames[matrix.cluster] || matrix.cluster}</span>` : ''}
                    ${matrix.score ? `<span style="background:rgba(39,174,96,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem;">⭐ Score: ${matrix.score}</span>` : ''}
                </div>
                ${matrix.emergence ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Emergence:</strong> ${matrix.emergence}</div>` : ''}
                ${matrix.layer ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Layers:</strong> ${matrix.layer}</div>` : ''}
                ${matrix.connection ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Connections:</strong> ${matrix.connection}</div>` : ''}
                ${matrix.scale ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Scale:</strong> ${matrix.scale}</div>` : ''}
                ${matrix.capacity ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Capacity:</strong> ${matrix.capacity}</div>` : ''}
                ${matrix.analysis ? `<div style="margin-top:0.5rem; padding:0.5rem; background:rgba(255,255,255,0.5); border-radius:6px; font-size:0.82rem; line-height:1.75;"><strong>Analysis:</strong> ${matrix.analysis}</div>` : ''}
            </div>`;
    }
    
    if (ai3Final) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(236,72,153,0.06); border-radius:10px; border-left:4px solid #ec4899;">
                <div style="font-weight:800; font-size:0.85rem; color:#be185d; margin-bottom:0.4rem;">💎 AI-3 — Final Synthesis</div>
                <div style="font-size:0.85rem; line-height:1.9;">${ai3Final}</div>
            </div>`;
    }
    
    if (!guide && !matrix && !ai3Final) {
        html += `
            <div style="padding:0.8rem; background:rgba(231,76,60,0.08); border-radius:10px; border-left:4px solid #e74c3c;">
                <div style="font-weight:800; font-size:0.85rem; color:#7a1a1a;">⚠️ AI analysis not available for this observation</div>
                <div style="font-size:0.78rem; color:#7a1a1a; margin-top:0.3rem;">This observation may have been registered before the three-layer analysis system was activated.</div>
            </div>`;
    }
    
    html += `
        <div style="margin-top:0.8rem; padding:0.6rem; text-align:center; background:rgba(100,116,139,0.08); border-radius:8px; border:1px dashed rgba(100,116,139,0.3);">
            <button onclick="copyAtlasProfile(${index})" style="padding:0.4rem 1rem; border-radius:20px; background:#64748b; color:#fff; border:none; font-weight:700; font-size:0.8rem; cursor:pointer;">📋 Copy Full Profile</button>
            <span style="font-size:0.7rem; color:#64748b; margin-left:0.5rem;">For translation</span>
        </div>`;
    
    guideContent.innerHTML = html;
    guideContent.style.fontSize = '0.85rem';
    guideBox.style.display = 'block';
    document.getElementById('modalFeedback').style.display = 'block';
    document.getElementById('detailModal').classList.add('active');
}

window.copyAtlasProfile = function(index) {
    const item = allAtlasItems[index];
    if (!item) return;
    
    const guide = normalizeGuide(item);
    const matrix = normalizeMatrix(item);
    const ai3Final = normalizeAi3(item);
    
    const clusterNames = {
        'human': 'Human', 'knowledge': 'Knowledge & Technology',
        'governance': 'Governance & Civilization', 'survival': 'Survival & Future',
        'other': 'Unknown'
    };
    
    const lines = [];
    lines.push('═══════════════════════════════════════════');
    lines.push(`ATLAS PROFILE #${item.number || '---'}`);
    lines.push(`Tracking Code: OBS-${item.number || '---'}`);
    lines.push(`Card Code: ${item.cardCode || '---'}`);
    lines.push(`Date: ${item.createdAt ? new Date(item.createdAt).toISOString() : '---'}`);
    if (matrix && matrix.cluster) lines.push(`Cluster: ${clusterNames[matrix.cluster] || matrix.cluster}`);
    if (item.score) lines.push(`Score: ${item.score}`);
    lines.push('═══════════════════════════════════════════');
    lines.push('');
    lines.push('▸ [1] RAW OBSERVATION:');
    lines.push(item.observation || '-');
    lines.push('');
    if (guide) {
        lines.push('▸ [2] AI-1 — THREE-LEVEL GUIDANCE:');
        if (guide.individual) lines.push(`  📍 Individual: ${guide.individual}`);
        if (guide.social) lines.push(`  🌐 Social: ${guide.social}`);
        if (guide.institutional) lines.push(`  🏛️ Institutional: ${guide.institutional}`);
        lines.push('');
    }
    if (matrix) {
        lines.push('▸ [3] AI-2 — FIVE-LEVEL MATRIX:');
        if (matrix.emergence) lines.push(`  📊 Emergence: ${matrix.emergence}`);
        if (matrix.layer) lines.push(`  📊 Layers: ${matrix.layer}`);
        if (matrix.connection) lines.push(`  📊 Connections: ${matrix.connection}`);
        if (matrix.scale) lines.push(`  📊 Scale: ${matrix.scale}`);
        if (matrix.capacity) lines.push(`  📊 Capacity: ${matrix.capacity}`);
        if (matrix.analysis) { lines.push(''); lines.push(`  Analysis: ${matrix.analysis}`); }
        lines.push('');
    }
    if (ai3Final) {
        lines.push('▸ [4] AI-3 — FINAL SYNTHESIS:');
        lines.push(ai3Final);
        lines.push('');
    }
    lines.push('═══════════════════════════════════════════');
    
    const text = lines.join('\n');
    
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => alert('✅ Full profile copied')).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
};

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('✅ Full profile copied'); }
    catch (e) { alert('❌ Copy error'); }
    document.body.removeChild(ta);
}

async function submitFeedback(type) {
    if (!currentModalItem) return;
    alert(`Thank you! Your feedback (${type}) has been recorded for the reformer network.`);
}

function closeModal(e) {
    if (e.target && e.target.id === 'detailModal') {
        e.target.classList.remove('active');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadAchievements();
    loadAtlas();
});

if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
}
</script>
