<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Atlas of Emergence & Notable Gallery | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            background-attachment: fixed;
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f0e8d0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        body.dark .container {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
            padding: 0.3rem;
        }
        .gallery-grid::-webkit-scrollbar { width: 6px; }
        .gallery-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 10px; }
        .gallery-card {
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        body.dark .gallery-card { background: rgba(0,0,0,0.15); }
        .gallery-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); }
        body.dark .gallery-card:hover { background: rgba(255,255,255,0.02); }
        .gallery-card.atlas { border-color: rgba(212,175,55,0.3); }
        .gallery-card.achievement { border-color: rgba(40,116,166,0.3); }
        .card-media {
            height: 180px;
            background: rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .card-media { background: rgba(0,0,0,0.2); }
        .card-media img, .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-media .no-media {
            font-size: 3rem;
            color: #888;
        }
        .card-content { padding: 1rem; }
        .card-title { font-weight: 800; color: #0a0a1a; font-size: 0.95rem; margin-bottom: 0.3rem; }
        body.dark .card-title { color: #f0e8e0; }
        .card-desc {
            font-size: 0.8rem;
            color: #4a4a5a;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .card-desc { color: #b0b0c0; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .card-meta .card-owner { font-weight: 700; color: #2874a6; }
        body.dark .card-meta .card-owner { color: #85c1e9; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .badge-atlas { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        .badge-achievement { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-atlas { color: #f9e79f; background: rgba(212,175,55,0.1); }
        body.dark .badge-achievement { color: #85c1e9; background: rgba(40,116,166,0.05); }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active {
            background: rgba(212,175,55,0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #0a0a1a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0,0,0,0.2); }
        .theme-toggle:hover { transform: scale(1.1); }
        
        .btn-full-profile {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.4rem;
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #8a6d1f;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }
        .btn-full-profile:hover { background: rgba(212,175,55,0.2); }
        body.dark .btn-full-profile { color: #f9e79f; border-color: #f9e79f; }

        .feedback-note {
            font-size: 0.7rem;
            color: #8a6d1f;
            text-align: center;
            padding: 0.6rem;
            background: rgba(212,175,55,0.08);
            border-radius: 8px;
            border: 1px dashed rgba(212,175,55,0.3);
            margin-top: 1rem;
            font-weight: 600;
        }
        body.dark .feedback-note { color: #f9e79f; background: rgba(212,175,55,0.04); }

        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index-en.html" class="back-link">↩ Back to Home</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>

        <h1 class="page-title">🏛️ Atlas of Emergence & Notable Gallery</h1>
        <div class="page-subtitle">Selected observations and approved notable achievements</div>

        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalAtlas">0</span><div class="label">🏛️ Atlas</div></div>
            <div class="stat-mini"><span class="number" id="totalAchievements">0</span><div class="label">🏆 Notable</div></div>
            <div class="stat-mini"><span class="number" id="totalItems">0</span><div class="label">📋 Total</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 All</button>
            <button class="filter-btn" data-filter="atlas" onclick="setFilter('atlas')">🏛️ Atlas</button>
            <button class="filter-btn" data-filter="achievement" onclick="setFilter('achievement')">🏆 Notable</button>
        </div>

        <div id="galleryGrid" class="gallery-grid">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

<script>
let allAtlasItems = [];
let allGalleryItems = [];
let allAchievements = [];
let currentFilter = 'all';

function toggleTheme() {
    document.body.classList.toggle('dark');
    const btn = document.getElementById('themeToggle');
    btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggle').textContent = '☀️';
}

function normalizeGuide(item) {
    if (item.guide && (item.guide.individual || item.guide.network || item.guide.policy)) {
        return {
            individual: item.guide.individual || '',
            social: item.guide.network || '',
            institutional: item.guide.policy || ''
        };
    }
    return null;
}

function normalizeMatrix(item) {
    if (item.matrix_emergence || item.matrix_layers || item.matrix_connections ||
        item.matrix_scale || item.matrix_capacity) {
        return {
            emergence: item.matrix_emergence || '',
            layer: item.matrix_layers || '',
            connection: item.matrix_connections || '',
            scale: item.matrix_scale || '',
            capacity: item.matrix_capacity || '',
            analysis: item.analysis || '',
            cluster: item.cluster || '',
            score: item.score || null
        };
    }
    return null;
}

function normalizeAi3(item) {
    return item.ai3Final || '';
}

async function loadData() {
    // ===== Atlas + Gallery observations =====
    try {
        const atlasRes = await fetch('/api/get-connection-requests?type=observations&t=' + Date.now());
        const atlasData = await atlasRes.json();
        if (atlasRes.ok) {
            const observations = atlasData.observations || [];
            // Atlas: approved + label "atlas"
            allAtlasItems = observations.filter(obs =>
                obs.status === 'approved' &&
                Array.isArray(obs.labels) &&
                obs.labels.includes('atlas')
            );
            // Gallery observations: approved + label "gallery"
            allGalleryItems = observations.filter(obs =>
                obs.status === 'approved' &&
                Array.isArray(obs.labels) &&
                obs.labels.includes('gallery')
            );
        } else {
            console.error('Atlas error:', atlasData.error);
            allAtlasItems = [];
            allGalleryItems = [];
        }
    } catch (e) {
        console.error('Atlas fetch error:', e);
        allAtlasItems = [];
        allGalleryItems = [];
    }

    // ===== Achievements =====
    try {
        const usersRes = await fetch('/api/get-users?t=' + Date.now());
        const usersData = await usersRes.json();
        if (usersRes.ok) {
            allAchievements = [];
            if (usersData.users) {
                usersData.users.forEach(user => {
                    if (user.achievements && Array.isArray(user.achievements)) {
                        user.achievements.forEach(ach => {
                            if (ach.section === 'emergence' && ach.status === 'approved') {
                                allAchievements.push({
                                    ...ach,
                                    owner: user.cardCode,
                                    ownerEmail: user.communicationEmail || '',
                                    ownerRank: user.rank || 0
                                });
                            }
                        });
                    }
                });
            }
        }
    } catch (e) {
        console.error('Users fetch error:', e);
        allAchievements = [];
    }

    updateStats();
    renderGallery();
}

function updateStats() {
    const atlasCount = allAtlasItems.length + allGalleryItems.length;
    document.getElementById('totalAtlas').textContent = atlasCount;
    document.getElementById('totalAchievements').textContent = allAchievements.length;
    document.getElementById('totalItems').textContent = atlasCount + allAchievements.length;
}

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderGallery();
}

function renderGallery() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;

    const atlasItems = allAtlasItems.map((obs, idx) => ({
        type: 'atlas',
        _idx: idx,
        id: obs.number,
        title: obs.observation ? obs.observation.substring(0, 80) + '...' : 'Observation',
        description: obs.observation || '',
        owner: obs.cardCode || 'Unknown',
        score: obs.adminScore || obs.score || '---',
        date: obs.createdAt
    }));

    const galleryObservationItems = allGalleryItems.map((obs, idx) => ({
        type: 'atlas',
        _idx: allAtlasItems.length + idx,
        id: obs.number,
        title: obs.observation ? obs.observation.substring(0, 80) + '...' : 'Observation',
        description: obs.observation || '',
        owner: obs.cardCode || 'Unknown',
        score: obs.adminScore || obs.score || '---',
        date: obs.createdAt
    }));

    const achievementItems = allAchievements.map((ach, idx) => ({
        type: 'achievement',
        _idx: idx,
        id: ach.id || ach.fileName || 'unknown',
        title: ach.title || 'Untitled',
        description: ach.description || '',
        owner: ach.owner || 'Unknown',
        date: ach.createdAt || ach.uploadDate,
        category: ach.category || 'other',
        fileUrl: ach.fileUrl || ach.fileData || ''
    }));

    let items = [];
    if (currentFilter === 'all') items = [...atlasItems, ...galleryObservationItems, ...achievementItems];
    else if (currentFilter === 'atlas') items = atlasItems;
    else if (currentFilter === 'achievement') items = [...galleryObservationItems, ...achievementItems];

    items.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No items found in this category</div>`;
        return;
    }

    grid.innerHTML = items.map(item => {
        const isAtlas = item.type === 'atlas';
        const isAchievement = item.type === 'achievement';

        let mediaHtml = '';
        if (isAchievement && item.fileUrl) {
            mediaHtml = `<img src="${item.fileUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='<span class=\\'no-media\\'>📄</span>'" />`;
        } else {
            mediaHtml = `<span class="no-media">${isAtlas ? '🏛️' : '📄'}</span>`;
        }

        const date = item.date ? new Date(item.date).toLocaleString('en-US') : '---';

        let detailButton = '';
        if (isAtlas) {
            detailButton = `<button onclick="showAtlasDetail(${item._idx})" class="btn-full-profile">📊 View Full Emergence Profile</button>`;
        }

        return `
            <div class="gallery-card ${isAtlas ? 'atlas' : 'achievement'}">
                <div class="card-media">${mediaHtml}</div>
                <div class="card-content">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.description ? item.description.substring(0, 120) + (item.description.length > 120 ? '...' : '') : '---'}</div>
                    <div class="card-meta">
                        <span class="card-owner">👤 ${item.owner}</span>
                        <span class="card-date">${date}</span>
                    </div>
                    ${isAtlas ? `<span class="badge badge-atlas">🏛️ Atlas</span>` : ''}
                    ${isAchievement ? `<span class="badge badge-achievement">🏆 Notable</span>` : ''}
                    ${detailButton}
                </div>
            </div>
        `;
    }).join('');
}

window.showAtlasDetail = function(idx) {
    const allItems = [...allAtlasItems, ...allGalleryItems];
    const item = allItems[idx];
    if (!item) return;

    const guide = normalizeGuide(item);
    const matrix = normalizeMatrix(item);
    const ai3Final = normalizeAi3(item);

    const clusterNames = {
        'human': 'Human', 'knowledge': 'Knowledge & Technology',
        'governance': 'Governance & Civilization', 'survival': 'Survival & Future',
        'other': 'Unknown'
    };

    let html = `
        <div style="direction:ltr; line-height:1.8; max-height:70vh; overflow-y:auto;">
            <h3 style="color:#8a6d1f; border-bottom:2px solid #d4af37; padding-bottom:0.5rem; margin-bottom:1rem;">
                🏛️ Atlas Profile #${item.number}
            </h3>
    `;

    html += `
        <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(212,175,55,0.08); border-radius:10px; border-left:4px solid #d4af37;">
            <div style="font-weight:800; font-size:0.85rem; color:#8a6d1f; margin-bottom:0.4rem;">📝 Registered Observation</div>
            <div style="font-size:0.85rem; line-height:1.8;">${item.observation || '---'}</div>
        </div>
    `;

    if (guide && (guide.individual || guide.social || guide.institutional)) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(16,185,129,0.06); border-radius:10px; border-left:4px solid #10b981;">
                <div style="font-weight:800; font-size:0.85rem; color:#047857; margin-bottom:0.4rem;">🤖 AI-1 — Three-Level Guidance</div>
                ${guide.individual ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>📍 Individual:</strong> ${guide.individual}</div>` : ''}
                ${guide.social ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>🌐 Social:</strong> ${guide.social}</div>` : ''}
                ${guide.institutional ? `<div style="font-size:0.82rem; line-height:1.7;"><strong>🏛️ Institutional:</strong> ${guide.institutional}</div>` : ''}
            </div>
        `;
    }

    if (matrix && (matrix.emergence || matrix.layer || matrix.connection || matrix.scale || matrix.capacity || matrix.analysis)) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(99,102,241,0.06); border-radius:10px; border-left:4px solid #6366f1;">
                <div style="font-weight:800; font-size:0.85rem; color:#4338ca; margin-bottom:0.4rem;">
                    🧠 AI-2 — Five-Level Matrix
                    ${matrix.cluster ? `<span style="background:rgba(212,175,55,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem; margin-left:0.3rem;">📂 ${clusterNames[matrix.cluster] || matrix.cluster}</span>` : ''}
                </div>
                ${matrix.emergence ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Emergence:</strong> ${matrix.emergence}</div>` : ''}
                ${matrix.layer ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Layers:</strong> ${matrix.layer}</div>` : ''}
                ${matrix.connection ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Connections:</strong> ${matrix.connection}</div>` : ''}
                ${matrix.scale ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Scale:</strong> ${matrix.scale}</div>` : ''}
                ${matrix.capacity ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 Capacity:</strong> ${matrix.capacity}</div>` : ''}
                ${matrix.analysis ? `<div style="margin-top:0.5rem; padding:0.5rem; background:rgba(255,255,255,0.5); border-radius:6px; font-size:0.82rem; line-height:1.75;"><strong>Analysis:</strong> ${matrix.analysis}</div>` : ''}
            </div>
        `;
    }

    if (ai3Final) {
        html += `
            <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(236,72,153,0.06); border-radius:10px; border-left:4px solid #ec4899;">
                <div style="font-weight:800; font-size:0.85rem; color:#be185d; margin-bottom:0.4rem;">💎 AI-3 — Final Synthesis</div>
                <div style="font-size:0.85rem; line-height:1.9;">${ai3Final}</div>
            </div>
        `;
    }

    if (!guide && !matrix && !ai3Final) {
        html += `
            <div style="padding:0.8rem; background:rgba(231,76,60,0.08); border-radius:10px; border-left:4px solid #e74c3c;">
                <div style="font-weight:800; font-size:0.85rem; color:#7a1a1a;">⚠️ AI analysis not available for this observation</div>
            </div>
        `;
    }

    html += `<div class="feedback-note" style="margin-top:1rem;">📊 Effectiveness Report: (Visible only after observer submits feedback)</div>`;

    html += `</div>`;

    showCustomModal(`🏛️ Atlas Profile #${item.number}`, html);
};

function showCustomModal(title, bodyHtml) {
    let modal = document.getElementById('customAtlasModal');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'customAtlasModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px);';
    modal.innerHTML = `
        <div style="background:#fff;color:#2a1a0a;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px;padding:1.5rem;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.3);">
            <button onclick="document.getElementById('customAtlasModal').remove()" style="position:absolute;top:0.5rem;right:0.5rem;background:rgba(0,0,0,0.1);border:none;width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer;">✕</button>
            <h2 style="color:#8a6d1f;margin-bottom:1rem;font-size:1.1rem;padding-right:2.5rem;">${title}</h2>
            <div>${bodyHtml}</div>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
