<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Atlas of Emergence & Notable Gallery | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Vazir', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            background-attachment: fixed;
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f0e8d0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        body.dark .container {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .back-link {
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #0a0a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        body.dark .back-link { color: #f0e8d0; }
        .back-link:hover { background: rgba(255,255,255,0.08); }
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f0e8e0; }
        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #2a2a3a;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-mini {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        body.dark .stat-mini { background: rgba(0,0,0,0.1); }
        .stat-mini .number { font-size: 1.3rem; font-weight: 800; color: #0a0a1a; display: block; }
        body.dark .stat-mini .number { color: #f0e8e0; }
        .stat-mini .label { font-size: 0.65rem; color: #6a6a7a; }
        body.dark .stat-mini .label { color: #a8a8b8; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
            padding: 0.3rem;
        }
        .gallery-grid::-webkit-scrollbar { width: 6px; }
        .gallery-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 10px; }
        .gallery-card {
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        body.dark .gallery-card { background: rgba(0,0,0,0.15); }
        .gallery-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); }
        body.dark .gallery-card:hover { background: rgba(255,255,255,0.02); }
        .gallery-card.atlas { border-color: rgba(212,175,55,0.3); }
        .gallery-card.achievement { border-color: rgba(40,116,166,0.3); }
        .card-media {
            height: 180px;
            background: rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .card-media { background: rgba(0,0,0,0.2); }
        .card-media img, .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-media .no-media {
            font-size: 3rem;
            color: #888;
        }
        .card-content { padding: 1rem; }
        .card-title { font-weight: 800; color: #0a0a1a; font-size: 0.95rem; margin-bottom: 0.3rem; }
        body.dark .card-title { color: #f0e8e0; }
        .card-desc {
            font-size: 0.8rem;
            color: #4a4a5a;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .card-desc { color: #b0b0c0; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .card-meta .card-owner { font-weight: 700; color: #2874a6; }
        body.dark .card-meta .card-owner { color: #85c1e9; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .badge-atlas { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        .badge-achievement { background: rgba(40,116,166,0.15); color: #2874a6; }
        body.dark .badge-atlas { color: #f9e79f; background: rgba(212,175,55,0.1); }
        body.dark .badge-achievement { color: #85c1e9; background: rgba(40,116,166,0.05); }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.15);
            background: rgba(255,255,255,0.03);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        body.dark .filter-btn { color: #f0e8d0; }
        .filter-btn:hover { background: rgba(212,175,55,0.05); }
        .filter-btn.active {
            background: rgba(212,175,55,0.12);
            border-color: #d4af37;
        }
        body.dark .filter-btn.active { background: rgba(212,175,55,0.08); }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #0a0a1a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0,0,0,0.2); }
        .theme-toggle:hover { transform: scale(1.1); }
        @media (max-width: 768px) {
            .container { padding: 1.2rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index-en.html" class="back-link">↩ Back to Home</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>

        <h1 class="page-title">🏛️ Atlas of Emergence & Notable Gallery</h1>
        <div class="page-subtitle">Selected observations with score 5 and approved notable achievements</div>

        <div class="stats-mini">
            <div class="stat-mini"><span class="number" id="totalAtlas">۰</span><div class="label">🏛️ Atlas</div></div>
            <div class="stat-mini"><span class="number" id="totalAchievements">۰</span><div class="label">🏆 Notable</div></div>
            <div class="stat-mini"><span class="number" id="totalItems">۰</span><div class="label">📋 Total</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 All</button>
            <button class="filter-btn" data-filter="atlas" onclick="setFilter('atlas')">🏛️ Atlas</button>
            <button class="filter-btn" data-filter="achievement" onclick="setFilter('achievement')">🏆 Notable</button>
        </div>

        <div id="galleryGrid" class="gallery-grid">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <script>
        let allAtlasItems = [];
        let allAchievements = [];
        let currentFilter = 'all';

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.getElementById('themeToggle');
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').textContent = '☀️';
        }

        async function loadData() {
            try {
                // 1. Get Atlas (observations with score 5)
                const atlasRes = await fetch('/api/get-connection-requests?type=observations&t=' + new Date().getTime());
                const atlasData = await atlasRes.json();
                if (!atlasRes.ok) throw new Error(atlasData.error || 'Error loading Atlas');
                allAtlasItems = (atlasData.observations || [])
                    .filter(obs => obs.score === 5 && obs.status === 'approved');

                // 2. Get Notable Achievements (emergence)
                const usersRes = await fetch('/api/get-users?t=' + new Date().getTime());
                const usersData = await usersRes.json();
                if (!usersRes.ok) throw new Error(usersData.error || 'Error loading users');
                
                allAchievements = [];
                if (usersData.users) {
                    usersData.users.forEach(user => {
                        if (user.achievements && Array.isArray(user.achievements)) {
                            user.achievements.forEach(ach => {
                                // Only emergence achievements that are approved
                                if (ach.section === 'emergence' && ach.status === 'approved') {
                                    allAchievements.push({
                                        ...ach,
                                        owner: user.cardCode,
                                        ownerEmail: user.communicationEmail || '',
                                        ownerRank: user.rank || 0
                                    });
                                }
                            });
                        }
                    });
                }

                updateStats();
                renderGallery();

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('galleryGrid').innerHTML =
                    `<div class="empty-state" style="color:red;">Error: ${error.message}</div>`;
            }
        }

        function updateStats() {
            document.getElementById('totalAtlas').textContent = allAtlasItems.length;
            document.getElementById('totalAchievements').textContent = allAchievements.length;
            document.getElementById('totalItems').textContent = allAtlasItems.length + allAchievements.length;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');

            const atlasItems = allAtlasItems.map(obs => ({
                type: 'atlas',
                id: obs.number,
                title: obs.observation ? obs.observation.substring(0, 80) + '...' : 'Observation',
                description: obs.observation || '',
                owner: obs.cardCode || 'Unknown',
                score: obs.score || 5,
                date: obs.createdAt,
                category: 'atlas',
                module: obs.module,
                analysis: obs.analysis || {}
            }));

            const achievementItems = allAchievements.map(ach => ({
                type: 'achievement',
                id: ach.id || ach.fileName || 'unknown',
                title: ach.title || 'Untitled',
                description: ach.description || '',
                owner: ach.owner || 'Unknown',
                ownerEmail: ach.ownerEmail || '',
                date: ach.createdAt || ach.uploadDate,
                category: ach.category || 'other',
                fileUrl: ach.fileUrl || ach.fileData || '',
                score: ach.score || 0,
                section: ach.section || 'emergence'
            }));

            let items = [];
            if (currentFilter === 'all') {
                items = [...atlasItems, ...achievementItems];
            } else if (currentFilter === 'atlas') {
                items = atlasItems;
            } else if (currentFilter === 'achievement') {
                items = achievementItems;
            }

            items = items.sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });

            if (items.length === 0) {
                grid.innerHTML = `<div class="empty-state">No items found in this category</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const isAtlas = item.type === 'atlas';
                const isAchievement = item.type === 'achievement';

                let mediaHtml = '';
                if (isAchievement && item.fileUrl) {
                    const ext = item.fileName ? item.fileName.split('.').pop().toLowerCase() : '';
                    if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        mediaHtml = `<video controls src="${item.fileUrl}"></video>`;
                    } else {
                        mediaHtml = `<img src="${item.fileUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='<span class=\\'no-media\\'>📄</span>'" />`;
                    }
                } else if (isAchievement && item.fileData) {
                    mediaHtml = `<img src="${item.fileData}" alt="${item.title}" />`;
                } else {
                    mediaHtml = `<span class="no-media">${isAtlas ? '🏛️' : '📄'}</span>`;
                }

                const date = item.date ? new Date(item.date).toLocaleString('en-US') : '---';

                return `
                    <div class="gallery-card ${isAtlas ? 'atlas' : 'achievement'}">
                        <div class="card-media">${mediaHtml}</div>
                        <div class="card-content">
                            <div class="card-title">${item.title}</div>
                            <div class="card-desc">${item.description ? item.description.substring(0, 120) + (item.description.length > 120 ? '...' : '') : '---'}</div>
                            <div class="card-meta">
                                <span class="card-owner">👤 ${item.owner}</span>
                                <span class="card-date">${date}</span>
                            </div>
                            ${isAtlas ? `<span class="badge badge-atlas">🏛️ Atlas</span>` : ''}
                            ${isAchievement ? `<span class="badge badge-achievement">🏆 Notable</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
