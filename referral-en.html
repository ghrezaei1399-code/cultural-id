<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Invite Friends | Global Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Vazir', 'IRANSans', sans-serif;
            background: radial-gradient(circle at 20% 30%, #d4e8f5 0%, #b8d4e8 40%, #a0c4d8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #0f1a2a 40%, #0a0f1a 100%);
            color: #d0d8e0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 1.5rem 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.3s, border-color 0.3s;
        }

        body.dark .container {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .date-display {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0b3b54;
            opacity: 0.7;
            background: rgba(255,255,255,0.15);
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        body.dark .date-display { color: #b8d4e8; }

        .theme-toggle {
            background: rgba(255,255,255,0.15);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #0b3b54;
        }

        body.dark .theme-toggle { color: #f9e79f; }
        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.25);
        }

        .lang-switch {
            text-align: center;
            margin: 1rem 0;
        }

        .lang-switch a {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1a4b6d;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lang-switch a:hover { background: rgba(255,255,255,0.25); }
        body.dark .lang-switch a { color: #b8d4e8; background: rgba(255,255,255,0.05); }
        body.dark .lang-switch a:hover { background: rgba(255,255,255,0.1); }

        .back-module {
            display: inline-block;
            background: rgba(26, 75, 109, 0.15);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1a4b6d;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(26, 75, 109, 0.1);
            margin-bottom: 1.5rem;
        }

        body.dark .back-module {
            background: rgba(255,255,255,0.05);
            color: #b8d4e8;
            border-color: rgba(255,255,255,0.05);
        }

        .back-module:hover {
            background: rgba(26, 75, 109, 0.25);
            transform: translateX(-4px);
        }

        body.dark .back-module:hover { background: rgba(255,255,255,0.1); }

        .referral-box {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        body.dark .referral-box {
            background: rgba(30, 40, 50, 0.4);
            border-color: rgba(255,255,255,0.05);
        }

        .referral-box h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b3b54;
            margin-bottom: 1rem;
            border-bottom: 2px solid rgba(26,123,158,0.1);
            padding-bottom: 0.4rem;
        }

        body.dark .referral-box h2 { color: #b8d4e8; border-bottom-color: rgba(255,255,255,0.05); }

        .referral-box .site-link {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0b3b54;
            margin-bottom: 1rem;
            border: 1px dashed rgba(26, 123, 158, 0.2);
            word-break: break-all;
        }

        body.dark .referral-box .site-link {
            color: #b8d4e8;
            border-color: rgba(255,255,255,0.05);
        }

        .referral-box .copy-btn {
            background: linear-gradient(135deg, #1a7b9e, #6a3f9e);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 4px 16px rgba(26,123,158,0.2);
            margin-bottom: 0.8rem;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .referral-box .copy-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(26,123,158,0.3);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        body.dark .stats { border-top-color: rgba(255,255,255,0.05); }

        .stats .stat-item { text-align: center; }
        .stats .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b3b54;
        }

        body.dark .stats .stat-number { color: #b8d4e8; }

        .stats .stat-label {
            font-size: 0.75rem;
            opacity: 0.5;
        }

        .note {
            font-size: 0.8rem;
            opacity: 0.4;
            text-align: center;
            margin-top: 0.8rem;
        }

        body.dark .note { opacity: 0.3; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .referral-box { padding: 1.2rem 1rem; }
            .stats { flex-direction: column; gap: 0.3rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <div class="date-display" id="dateDisplay">📅 Friday, August 20, 2026</div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <!-- ===== LANGUAGE SWITCH ===== -->
    <div class="lang-switch">
        <a href="referral-fa.html">🇮🇷 فارسی</a>
    </div>

    <a href="index.html" class="back-module">← Back to Home</a>

    <!-- ===== REFERRAL FORM ===== -->
    <div class="referral-box">
        <h2>📣 Invite Friends</h2>

        <p style="opacity:0.7; margin-bottom:0.8rem; font-size:0.95rem;">
            Share the site link and join the cultural ambassadors network.
        </p>

        <div class="site-link">
            🌐 https://cultural.id
        </div>

        <button class="copy-btn">📋 Copy Link</button>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">۰</div>
                <div class="stat-label">Total Invites</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۰</div>
                <div class="stat-label">Successful Signups</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۰</div>
                <div class="stat-label">Failed Signups</div>
            </div>
        </div>

        <div class="note">
            ✦ Referral statistics are automatically calculated based on signup IPs ✦
        </div>
    </div>

</div>

<script>
    (function() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        const englishDate = now.toLocaleDateString('en-US', options);
        document.getElementById('dateDisplay').textContent = '📅 ' + englishDate;
    })();

    (function() {
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', function() {
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) {
                toggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                toggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });
    })();
</script>
</body>
</html>
