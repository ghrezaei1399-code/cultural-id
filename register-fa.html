<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ثبت‌نام | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/acropolis.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(0px);
            border-radius: 60px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.02);
        }

        .back-module {
            display: inline-block;
            background: rgba(255,255,255,0.02);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #0a0a1a;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.02);
            margin-bottom: 1.5rem;
        }

        .back-module:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(-4px);
        }

        .form-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .form-box h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a0a1a !important;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid rgba(0, 0, 0, 0.02);
            padding-bottom: 0.4rem;
            text-align: center;
            text-shadow: 0 2px 12px rgba(255,255,255,0.15);
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            color: #1a0a0a !important;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .form-group textarea,
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
            resize: vertical;
            min-height: 60px;
            color: #0a0a1a !important;
            font-weight: 600;
        }

        .form-group textarea:focus,
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(0, 0, 0, 0.2);
            outline: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group .hint {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.7;
            margin-top: 0.2rem;
            color: #1a0a0a !important;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .btn-submit {
            display: inline-block;
            background: rgba(255, 255, 255, 0.02);
            color: #0a0a1a !important;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.05rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: 0.25s ease;
            width: 100%;
            margin-top: 0.5rem;
            text-decoration: none;
            text-align: center;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .btn-submit:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.02);
        }

        .note {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.7;
            text-align: center;
            margin-top: 0.8rem;
            color: #1a0a0a !important;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .container { padding: 1.5rem 1rem; }
            .form-box { padding: 1.2rem 1rem; }
            .form-box h2 { font-size: 1.4rem; }
            .form-group label { font-size: 0.95rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="container">

    <a href="index.html" class="back-module">← بازگشت به صفحه‌ی اصلی</a>

    <div class="form-box">
        <h2>📝 ثبت‌نام و دریافت شناسنامه</h2>

        <div class="form-group">
            <label>🧭 ارزش‌های بومی</label>
            <textarea placeholder="ارزش‌های بومی خود را بنویسید..."></textarea>
        </div>

        <div class="form-group">
            <label>📚 دانش فردی</label>
            <textarea placeholder="دانش و تخصص‌های فردی خود را بنویسید..."></textarea>
        </div>

        <div class="form-group">
            <label>🤝 همکاری جمعی</label>
            <textarea placeholder="تجربیات و علاقه‌مندی‌های خود در زمینه‌ی همکاری جمعی را بنویسید..."></textarea>
        </div>

        <div class="form-group">
            <label>🌍 تنوع فرهنگی</label>
            <textarea placeholder="نگاه و تجربه‌ی شما درباره‌ی تنوع فرهنگی..."></textarea>
        </div>

        <div class="form-group">
            <label>🕊️ صلح پایدار جهانی</label>
            <textarea placeholder="ایده‌ها و دیدگاه‌های شما برای صلح پایدار جهانی..."></textarea>
        </div>

        <div class="form-group">
            <label>🚫 محو خشونت</label>
            <textarea placeholder="راه‌کارها و نظرات شما برای محو خشونت..."></textarea>
        </div>

        <div class="form-group">
            <label>🤝 اتحاد فرهنگی</label>
            <textarea placeholder="دیدگاه شما درباره‌ی اتحاد فرهنگی..."></textarea>
        </div>

        <div class="form-group">
            <label>📬 راه ارتباطی (اختیاری)</label>
            <select>
                <option value="email">ایمیل</option>
                <option value="linkedin">لینکدین</option>
                <option value="website">وب‌سایت</option>
                <option value="phone">تلفن</option>
                <option value="telegram">تلگرام</option>
                <option value="whatsapp">واتس‌اپ</option>
            </select>
            <input type="text" placeholder="مقدار را وارد کنید (مثلاً ایمیل)" style="margin-top:0.3rem; width:100%; padding:0.5rem 1rem; border-radius:16px; border:1px solid rgba(255,255,255,0.05); background:rgba(255,255,255,0.02); font-family:inherit; color:#0a0a1a !important; font-weight:600;" />
            <div class="hint">* این بخش کاملاً اختیاری است و فقط برای ارتباط شما با دیگران استفاده می‌شود.</div>
        </div>

        <a href="card-fa.html" class="btn-submit">🎯 دریافت شناسنامه</a>
        <div class="note">هیچ داده‌ی هویتی (نام، ملیت، کد ملی) ذخیره نمی‌شود.</div>
    </div>

</div>
</body>
</html>
