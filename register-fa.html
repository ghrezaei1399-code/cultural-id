<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .container {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            padding: 40px 32px;
            max-width: 620px;
            width: 100%;
            transition: background 0.3s, color 0.3s;
        }

        body.dark .container {
            background: #2d2d44;
            color: #e0e0e0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }

        body.dark .header h1 {
            color: #f1f5f9;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: #f1f5f9;
            transition: 0.2s;
        }

        body.dark .theme-toggle {
            background: #3b3b5a;
            color: #f1f5f9;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #334155;
        }

        body.dark .form-group label {
            color: #cbd5e1;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            background: #f8fafc;
            transition: border 0.2s;
            font-family: inherit;
        }

        body.dark .form-group input,
        body.dark .form-group select {
            background: #3b3b5a;
            border-color: #4a4a6a;
            color: #e0e0e0;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6366f1;
            outline: none;
        }

        .values-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .value-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        body.dark .value-option {
            background: #3b3b5a;
        }

        .value-option.selected {
            border-color: #6366f1;
            background: #eef2ff;
        }

        body.dark .value-option.selected {
            background: #4a4a6a;
            border-color: #818cf8;
        }

        .value-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .value-option label {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            font-weight: 500;
            display: none;
        }

        #status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        #status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        #status.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .sub-text {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        body.dark .sub-text {
            color: #94a3b8;
        }

        .counter {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 12px;
        }

        body.dark .counter {
            background: #3b3b5a;
            color: #cbd5e1;
        }

        @media (max-width: 500px) {
            .container {
                padding: 24px 16px;
            }
            .values-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 ثبت‌نام</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">🌙</button>
        </div>

        <div class="counter" id="userCounter">در حال بارگیری تعداد کاربران...</div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">نام و نام خانوادگی</label>
                <input type="text" id="fullName" placeholder="مثال: علی رضایی" required />
            </div>

            <div class="form-group">
                <label for="email">ایمیل (اختیاری)</label>
                <input type="email" id="email" placeholder="example@email.com" />
                <div class="sub-text">ایمیل فقط برای اطلاع‌رسانی استفاده می‌شود و عمومی نمی‌شود.</div>
            </div>

            <div class="form-group">
                <label for="country">کشور</label>
                <input type="text" id="country" placeholder="مثال: ایران" required />
            </div>

            <div class="form-group">
                <label for="city">شهر</label>
                <input type="text" id="city" placeholder="مثال: تهران" required />
            </div>

            <div class="form-group">
                <label>۷ ارزش فرهنگی خود را انتخاب کنید (حداقل ۵ مورد)</label>
                <div class="values-grid" id="valuesGrid">
                </div>
                <div class="sub-text" id="valueCounter">۰ از ۷ انتخاب شده</div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">🚀 ثبت‌نام و دریافت کارت</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const API_URL = '/api/register';

        const VALUES = [
            { id: 'honesty', label: '🔹 راستی و صداقت' },
            { id: 'justice', label: '⚖️ عدالت' },
            { id: 'peace', label: '🕊️ صلح‌جویی' },
            { id: 'knowledge', label: '📚 دانش‌ورزی' },
            { id: 'art', label: '🎨 هنر و زیبایی' },
            { id: 'nature', label: '🌿 طبیعت‌دوستی' },
            { id: 'family', label: '👨‍👩‍👧‍👦 خانواده‌گرایی' },
            { id: 'freedom', label: '🕊️ آزادگی' },
            { id: 'respect', label: '🤝 احترام به دیگران' },
            { id: 'progress', label: '🚀 پیشرفت و نوآوری' },
        ];

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Render values
        const valuesGrid = document.getElementById('valuesGrid');
        const valueCounter = document.getElementById('valueCounter');
        const shuffled = [...VALUES].sort(() => Math.random() - 0.5);
        let selectedValues = [];

        shuffled.forEach((v) => {
            const div = document.createElement('div');
            div.className = 'value-option';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `val_${v.id}`;
            checkbox.value = v.id;
            const label = document.createElement('label');
            label.htmlFor = `val_${v.id}`;
            label.textContent = v.label;
            div.appendChild(checkbox);
            div.appendChild(label);
            valuesGrid.appendChild(div);

            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    if (selectedValues.length >= 7) {
                        checkbox.checked = false;
                        showStatus('حداکثر ۷ ارزش می‌توانید انتخاب کنید.', 'error');
                        return;
                    }
                    selectedValues.push(v.id);
                    div.classList.add('selected');
                } else {
                    selectedValues = selectedValues.filter((id) => id !== v.id);
                    div.classList.remove('selected');
                }
                valueCounter.textContent = `${selectedValues.length} از ۷ انتخاب شده`;
            });
        });

        // User counter
        async function fetchUserCount() {
            try {
                const response = await fetch(
                    'https://api.github.com/repos/ghrezaei1399-code/cultural-id/contents/data/active',
                    { headers: { 'Accept': 'application/vnd.github.v3+json' } }
                );
                if (response.ok) {
                    const data = await response.json();
                    const count = data.filter(item => item.type === 'file' && item.name.endsWith('.json')).length;
                    document.getElementById('userCounter').textContent = `👥 تعداد کاربران ثبت‌شده: ${count}`;
                    return count;
                }
                return 0;
            } catch (err) {
                document.getElementById('userCounter').textContent = '👥 تعداد کاربران: (نامشخص)';
                return 0;
            }
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
        }

        function clearStatus() {
            const status = document.getElementById('status');
            status.style.display = 'none';
            status.className = '';
            status.textContent = '';
        }

        // Submit form
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearStatus();

            const fullName = document.getElementById('fullName').value.trim();
            const country = document.getElementById('country').value.trim();
            const city = document.getElementById('city').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!fullName || !country || !city) {
                showStatus('لطفاً تمام فیلدهای الزامی را پر کنید.', 'error');
                return;
            }

            if (selectedValues.length < 5) {
                showStatus('حداقل ۵ ارزش فرهنگی باید انتخاب کنید.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ثبت‌نام...';

            try {
                const count = await fetchUserCount();
                const isGolden = count < 200;

                const userData = {
                    fullName,
                    email: email || '',
                    country,
                    city,
                    values: selectedValues,
                    badge: isGolden ? 'golden' : 'normal',
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData),
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showStatus(
                        `✅ ثبت‌نام با موفقیت انجام شد! کد کارت شما: ${result.cardId}` +
                        (isGolden ? ' 🌟 تبریک! شما جزو ۲۰۰ نفر اول هستید و نشان طلایی دریافت کردید!' : ''),
                        'success'
                    );
                    sessionStorage.setItem('cardId', result.cardId);
                    setTimeout(() => {
                        window.location.href = `card-fa.html?cardId=${result.cardId}`;
                    }, 2000);
                } else {
                    showStatus(`❌ خطا: ${result.error || 'خطا در ثبت‌نام'}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ خطا در ارتباط با سرور: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 ثبت‌نام و دریافت کارت';
            }
        });

        fetchUserCount();
    </script>
</body>
</html>
