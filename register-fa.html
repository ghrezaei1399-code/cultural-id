        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;

            text-align: center;

        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {

        body.dark .form-group label { color: #e8d8c8; }

            background: rgba(255, 255, 255, 0.02);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a0a0a;
            transition: all 0.3s ease;
            outline: none;
        }
        body.dark .form-group input,
        body.dark .form-group textarea {
            background: rgba(255, 255, 255, 0.02);
            color: #e8d8c8;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(60, 30, 10, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .form-group input:focus,
        body.dark .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a3a2a;
            opacity: 0.5;
        }
        body.dark .form-group input::placeholder,
        body.dark .form-group textarea::placeholder {
            color: #908070;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover {
            background: rgba(60, 30, 10, 0.04);
            transform: scale(1.02);
        }
        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
