<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی | Cultural ID</title>
    <style>
        /* استایل‌های پایه کارت */
        body {
            font-family: 'Vazir', 'IRANSans', sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2a1a0a;
            margin-bottom: 0.5rem;
        }
        .card-code {
            font-family: monospace;
            font-size: 1.1rem;
            background: #f0f0f5;
            padding: 0.5rem;
            border-radius: 8px;
            margin: 1rem 0;
            color: #333;
            letter-spacing: 1px;
        }
        .card-badge {
            font-size: 1rem;
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .badge-golden { background: rgba(212, 175, 55, 0.2); color: #8a7a0a; border: 1px solid #d4af37; }
        .badge-silver { background: rgba(192, 192, 192, 0.2); color: #4a4a5a; border: 1px solid #c0c0c0; }
        .badge-bronze { background: rgba(205, 127, 50, 0.2); color: #6a4a0a; border: 1px solid #cd7f32; }
        
        .card-details {
            text-align: right;
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        .detail-label { color: #666; font-weight: 600; }
        .detail-value { color: #222; font-weight: 700; }
        
        .values-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .value-tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 1rem;
            border-radius: 12px;
            display: none;
        }
        .hologram {
            width: 60px;
            height: 60px;
            margin: 1rem auto;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContent" style="display: none;">
        <!-- لوگو -->
        <img src="assets/logo-fa.png" alt="Logo" class="card-logo" id="cardLogo" onerror="this.style.display='none'">
        
        <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>
        
        <!-- هولوگرام -->
        <img src="assets/hologram.png" alt="Hologram" class="hologram" onerror="this.style.display='none'">

        <!-- کد اصلی کارت -->
        <div class="card-code" id="displayCardCode">---</div>

        <!-- نشان -->
        <div id="displayBadge" class="card-badge">---</div>

        <!-- جزئیات -->
        <div class="card-details">
            <div class="detail-row">
                <span class="detail-label">رتبه ثبت‌نام:</span>
                <span class="detail-value" id="displayRank">---</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">کشور (IP):</span>
                <span class="detail-value" id="displayCountry">---</span>
            </div>
            
            <!-- بخش جدید: کد اختیاری -->
            <div class="detail-row" id="optionalCodeRow" style="display: none;">
                <span class="detail-label">کد اختیاری:</span>
                <span class="detail-value" id="displayOptionalCode">---</span>
            </div>

            <div class="detail-row" style="flex-direction: column; margin-top: 1rem;">
                <span class="detail-label" style="margin-bottom: 0.5rem;">ارزش‌های فرهنگی ثبت شده:</span>
                <div class="values-list" id="displayValues"></div>
            </div>
        </div>
        
        <div style="margin-top: 1.5rem; font-size: 0.7rem; color: #888;">
            این کارت فاقد ارزش مادی است و صرفاً هویت فرهنگی ناشناس را تأیید می‌کند.
        </div>
    </div>

    <div class="error-message" id="cardErrorMessage">
        ❌ کارت با این کد یافت نشد.
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardCode = urlParams.get('code');

        async function loadCardData() {
            if (!cardCode || cardCode === 'undefined') {
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = '❌ کد کارت نامعتبر است.';
                return;
            }

            try {
                const response = await fetch(`/api/get-user?code=${cardCode}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'خطا در دریافت اطلاعات');
                }

                const user = data.user;

                // پر کردن اطلاعات
                document.getElementById('displayCardCode').textContent = user.cardCode;
                document.getElementById('displayCountry').textContent = user.country || 'نامشخص';
                document.getElementById('displayRank').textContent = user.rank;
                
                // تنظیم نشان
                const badgeElement = document.getElementById('displayBadge');
                if (user.badge === 'golden') {
                    badgeElement.textContent = '🌟 نشان طلایی';
                    badgeElement.className = 'card-badge badge-golden';
                } else if (user.badge === 'silver') {
                    badgeElement.textContent = '🥈 نشان نقره‌ای';
                    badgeElement.className = 'card-badge badge-silver';
                } else {
                    badgeElement.textContent = '🥉 نشان برنزی';
                    badgeElement.className = 'card-badge badge-bronze';
                }

                // نمایش کد اختیاری (اگر وجود داشته باشد)
                if (user.optionalCode && user.optionalCode.trim() !== '') {
                    document.getElementById('displayOptionalCode').textContent = user.optionalCode;
                    document.getElementById('optionalCodeRow').style.display = 'flex';
                }

                // نمایش ارزش‌ها
                const valuesContainer = document.getElementById('displayValues');
                if (user.values && user.values.length > 0) {
                    valuesContainer.innerHTML = user.values.map(v => `<span class="value-tag">${v}</span>`).join('');
                } else {
                    valuesContainer.innerHTML = '<span style="color:#999;">ثبت نشده</span>';
                }

                // نمایش کارت و مخفی کردن خطا
                document.getElementById('cardErrorMessage').style.display = 'none';
                document.getElementById('cardContent').style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = `❌ ${error.message}`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
