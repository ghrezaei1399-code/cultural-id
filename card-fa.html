<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی | Cultural ID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Vazir', 'IRANSans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        .card-container {
            width: 360px;
            min-height: 580px;
            background: #0a0a0a;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            display: none;
            color: #f0f0f0;
        }
        
        .card-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin: 0 auto 1rem;
            display: block;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #d4af37;
            text-align: center;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        
        .card-code-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        
        .card-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f0f0f0;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        
        .optional-code-formatted {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            color: #d4af37;
            letter-spacing: 1px;
            font-weight: bold;
        }
        
        .values-section {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.2rem;
        }
        
        .values-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .value-item {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            color: #d4af37;
            text-align: center;
        }
        
        .hologram {
            width: 60px;
            height: 60px;
            margin: 0 auto;
            display: block;
            opacity: 0.9;
        }
        
        .bottom-modules {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1.5rem;
            width: 360px;
            align-items: center;
        }
        
        .action-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Vazir', 'IRANSans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
        }
        
        .first-200-notice {
            font-size: 0.8rem;
            color: #f0f0f0;
            text-align: center;
            margin-top: 0.5rem;
        }
        
        .first-200-notice a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }
        
        .error-message {
            color: #dc2626;
            background: rgba(0, 0, 0, 0.9);
            padding: 1.5rem;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 600;
            max-width: 360px;
            width: 100%;
            border: 2px solid #dc2626;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContent">
        <img src="assets/logo-fa.png" alt="Logo" class="card-logo" id="cardLogo" onerror="this.style.display='none'">
        
        <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="card-code-box">
            <div class="card-code" id="displayCardCode">---</div>
            <div class="optional-code-formatted" id="displayOptionalCode"></div>
        </div>

        <div class="values-section">
            <div class="values-list" id="displayValues"></div>
        </div>

        <img src="assets/hologram.png" alt="Hologram" class="hologram" onerror="this.style.display='none'">
    </div>

    <div class="bottom-modules" id="bottomModules">
        <button class="action-btn" onclick="window.location.href='/'">بازگشت به صفحه اصلی سایت</button>
        <button class="action-btn" onclick="saveCard()">ذخیره کارت</button>
        <div class="first-200-notice">
            ویژه ۲۰۰ نفر اول: <a href="/upload-achievements">آپلود دستاوردهای فرهنگی</a>
        </div>
    </div>

    <div class="error-message" id="cardErrorMessage">
        ❌ کارت با این کد یافت نشد.
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardCode = urlParams.get('code');

        async function loadCardData() {
            if (!cardCode || cardCode === 'undefined') {
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = '❌ کد کارت نامعتبر است.';
                return;
            }

            try {
                const response = await fetch(`/api/get-user?code=${cardCode}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'خطا در دریافت اطلاعات');
                }

                const user = data.user;

                document.getElementById('displayCardCode').textContent = user.cardCode || '---';
                
                if (user.optionalCode && user.optionalCode.trim() !== '') {
                    const r1 = Math.floor(1000 + Math.random() * 9000);
                    const r2 = Math.floor(1000 + Math.random() * 9000);
                    document.getElementById('displayOptionalCode').textContent = `cim - ${r1}- ${r2}-66666`;
                }

                const valuesContainer = document.getElementById('displayValues');
                valuesContainer.innerHTML = '';
                const hardcodedValues = [
                    'ارزش‌های بومی',
                    'دانش فردی',
                    'همکاری جمعی',
                    'تنوع فرهنگی',
                    'صلح پایدار جهانی',
                    'محو خشونت',
                    'اتحاد فرهنگی'
                ];
                
                hardcodedValues.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'value-item';
                    div.textContent = v;
                    valuesContainer.appendChild(div);
                });

                document.getElementById('cardErrorMessage').style.display = 'none';
                document.getElementById('cardContent').style.display = 'block';
                document.getElementById('bottomModules').style.display = 'flex';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = `❌ ${error.message}`;
            }
        }

        function saveCard() {
            const cardElement = document.getElementById('cardContent');
            html2canvas(cardElement, {
                backgroundColor: '#0a0a0a',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'cultural-id-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
