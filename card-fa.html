<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/نماد صلح.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2rem;
        }

        /* ===== CARD ===== */
        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 1.8rem 1.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 72px rgba(0, 0, 0, 0.12);
        }

        /* ===== HOLOGRAM EFFECTS ===== */
        .hologram-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(255, 215, 0, 0.02) 0%,
                rgba(255, 215, 0, 0.06) 25%,
                rgba(255, 215, 0, 0.02) 50%,
                rgba(255, 215, 0, 0.08) 75%,
                rgba(255, 215, 0, 0.02) 100%
            );
            background-size: 400% 400%;
            animation: hologramShine 8s ease infinite;
            pointer-events: none;
            z-index: 0;
            border-radius: 32px;
        }

        @keyframes hologramShine {
            0% { background-position: 0% 50%; opacity: 0.3; }
            50% { background-position: 100% 50%; opacity: 0.9; }
            100% { background-position: 0% 50%; opacity: 0.3; }
        }

        .hologram-circle {
            position: absolute;
            bottom: 1.2rem;
            left: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f9e79f, #f7dc6f, #f9e79f);
            background-size: 200% 200%;
            animation: hologramCircle 4s ease infinite;
            opacity: 0.15;
            z-index: 1;
            border: 1px solid rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        @keyframes hologramCircle {
            0% { background-position: 0% 50%; transform: rotate(0deg); }
            50% { background-position: 100% 50%; transform: rotate(180deg); }
            100% { background-position: 0% 50%; transform: rotate(360deg); }
        }

        .hologram-strip {
            position: absolute;
            bottom: 0.8rem;
            right: 1.2rem;
            width: 55px;
            height: 18px;
            background: linear-gradient(90deg, #f9e79f, #f7dc6f, #f9e79f);
            background-size: 200% 100%;
            animation: hologramStrip 3s ease infinite;
            opacity: 0.1;
            border-radius: 30px;
            z-index: 1;
        }

        @keyframes hologramStrip {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ===== CARD CONTENT ===== */
        .card-content {
            position: relative;
            z-index: 2;
        }

        .card-logo {
            max-height: 80px;
            width: auto;
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.05));
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a2a4a;
            margin-bottom: 0.2rem;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .card-id {
            font-size: 1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            display: inline-block;
            direction: ltr;
            color: #1a2a4a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0.3rem 0 0.2rem;
            letter-spacing: 1.5px;
        }

        .card-id-parts {
            font-size: 0.6rem;
            opacity: 0.5;
            direction: ltr;
            margin-bottom: 0.6rem;
            color: #3a2a3a;
        }

        .card-id-parts .highlight {
            background: #f9e79f;
            padding: 0 0.3rem;
            border-radius: 12px;
            color: #7d6608;
            font-weight: 600;
        }

        .card-values {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem 0.5rem;
            margin: 0.6rem 0 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .card-values .v-tag {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #1a2a4a;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.4rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(0, 0, 0, 0.02);
        }

        .card-footer .slogan {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1a2a4a;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }

        .card-footer .slogan-icon {
            font-size: 0.8rem;
            opacity: 0.2;
            color: #1a2a4a;
        }

        /* ===== BACK BUTTON ===== */
        .back-module {
            display: inline-block;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1a2a4a;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .back-module:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(-4px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card { padding: 1.4rem 1rem 1.6rem; }
            .card-id { font-size: 0.85rem; padding: 0.15rem 0.8rem; }
            .card-title { font-size: 1rem; }
            .card-footer .slogan { font-size: 0.65rem; }
            .card-logo { max-height: 60px; }
            .hologram-circle { width: 35px; height: 35px; bottom: 0.8rem; left: 0.8rem; }
            .hologram-strip { width: 40px; height: 12px; right: 0.8rem; }
        }

        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
    </style>
</head>
<body>
<div class="container">

    <a href="index.html" class="back-module">← بازگشت به صفحه‌ی اصلی</a>

    <!-- ===== CARD ===== -->
    <div class="card">
        <div class="hologram-bg"></div>
        <div class="hologram-circle"></div>
        <div class="hologram-strip"></div>

        <div class="card-content">
            <img src="assets/logo-fa.png" alt="کارت هویت هوشمند فرهنگی" class="card-logo" />
            <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>
            <div class="card-id">CIM-۱۲۳۴-۵۶۷۸-الف</div>
            <div class="card-id-parts">
                CIM • ۱۲۳۴ • ۵۶۷۸ • <span class="highlight">الف</span>
                <span style="display:block; font-size:0.5rem; opacity:0.5; color:#3a2a3a;">(کد اختیاری: ۵ کاراکتر دلخواه)</span>
            </div>
            <div class="card-values">
                <span class="v-tag">ارزش‌های بومی</span>
                <span class="v-tag">دانش فردی</span>
                <span class="v-tag">همکاری جمعی</span>
                <span class="v-tag">تنوع فرهنگی</span>
                <span class="v-tag">صلح پایدار</span>
            </div>
            <div class="card-footer">
                <span class="slogan-icon">✦</span>
                <span class="slogan">فرهنگ ما، ارتباط ما، آینده‌ی مشترک ما</span>
                <span class="slogan-icon">✦</span>
            </div>
        </div>
    </div>

</div>
</body>
</html>
