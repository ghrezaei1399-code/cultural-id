<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .card-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: #2a1a0a;
            margin-bottom: 0.2rem;
        }
        body.dark .logo { color: #f9e79f; }
        .logo-sub {
            font-size: 0.9rem;
            opacity: 0.6;
            color: #1a0a0a;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }
        body.dark .logo-sub { color: #b0a090; }
        .card-code {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.8rem;
            border-radius: 16px;
            border: 1px solid rgba(30, 10, 0, 0.02);
            margin: 1rem 0;
            direction: ltr;
            font-family: 'Courier New', monospace;
        }
        body.dark .card-code {
            border-color: rgba(255, 255, 255, 0.02);
        }
        .badge {
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 0.5rem 0;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.05);
            color: #b8860b;
        }
        body.dark .badge {
            color: #f9e79f;
            border-color: rgba(255, 215, 0, 0.02);
        }
        .badge.golden {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.08);
        }
        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover {
            background: rgba(60, 30, 10, 0.04);
            transform: scale(1.02);
        }
        body.dark .btn-primary:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary {
            background: rgba(255, 255, 255, 0.01);
            color: #a09080;
            border-color: rgba(255, 255, 255, 0.01);
        }
        .btn-secondary:hover {
            background: rgba(60, 30, 10, 0.03);
            transform: scale(1.02);
        }
        body.dark .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .note {
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.3;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 0.8rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1rem;
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error {
            color: #b08080;
            background: rgba(200, 50, 50, 0.01);
            border-color: rgba(200, 50, 50, 0.01);
        }
        .loading {
            text-align: center;
            padding: 2rem 0;
            opacity: 0.6;
        }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            color: #2a1a0a;
        }
        body.dark .logo-text { color: #f9e79f; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="card-container">
        <div class="logo">
            <span class="logo-text">کارت</span>
        </div>
        <div class="logo-sub">جهانی هویت هوشمند فرهنگی</div>

        <div id="messageBox" class="message-box"></div>
        <div id="loading" class="loading">⏳ در حال بارگیری اطلاعات...</div>

        <div id="cardContent" style="display:none;">
            <div id="badgeContainer"></div>
            <div class="card-code" id="cardCode">---</div>

            <div class="btn-group">
                <a href="#" class="btn btn-secondary" id="backCardBtn">🔍 پشت کارت</a>
                <a href="edit-fa.html" class="btn btn-primary" id="editLink">✏️ ویرایش</a>
            </div>
            <div style="margin-top:0.5rem;">
                <a href="index.html" class="btn btn-secondary" style="font-size:0.8rem;">↩ بازگشت</a>
            </div>
        </div>

        <div class="note">بدون اطلاعات شخصی • کاملاً ناشناس</div>
    </div>

    <script>
        // ===== تم =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== دریافت کد از URL =====
        function getCardCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('code') || localStorage.getItem('culturalCardCode');
        }

        const cardCode = getCardCode();

        if (!cardCode) {
            document.getElementById('loading').style.display = 'none';
            const box = document.getElementById('messageBox');
            box.textContent = '❌ کد کارت یافت نشد. لطفاً از صفحه ثبت‌نام اقدام کنید.';
            box.className = 'message-box error';
            box.style.display = 'block';
        }

        // ===== بارگیری اطلاعات از مخزن =====
        async function loadCardData() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/ghrezaei1399-code/cultural-id/contents/data/active/${cardCode}.json`,
                    {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    }
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('کارت با این کد یافت نشد.');
                    }
                    throw new Error('خطا در دریافت اطلاعات');
                }

                const data = await response.json();
                const content = decodeURIComponent(atob(data.content));
                const user = JSON.parse(content);

                return user;
            } catch (error) {
                throw error;
            }
        }

        // ===== نمایش کارت =====
        async function renderCard() {
            const loading = document.getElementById('loading');
            const cardContent = document.getElementById('cardContent');

            try {
                const user = await loadCardData();

                // کد کارت
                document.getElementById('cardCode').textContent = user.cardCode || cardCode;

                // نشان
                const badgeContainer = document.getElementById('badgeContainer');
                if (user.badge === 'golden') {
                    badgeContainer.innerHTML = '<span class="badge golden">🌟 نشان طلایی - سفیر فرهنگی</span>';
                } else {
                    badgeContainer.innerHTML = '<span class="badge">نشان نقره‌ای</span>';
                }

                // لینک‌ها
                document.getElementById('editLink').href = `edit-fa.html?code=${cardCode}`;
                document.getElementById('backCardBtn').href = `card-back-fa.html?code=${cardCode}`;

                loading.style.display = 'none';
                cardContent.style.display = 'block';

            } catch (error) {
                loading.style.display = 'none';
                const box = document.getElementById('messageBox');
                box.textContent = `❌ ${error.message}`;
                box.className = 'message-box error';
                box.style.display = 'block';
            }
        }

        if (cardCode) {
            renderCard();
        }
    </script>
</body>
</html>
