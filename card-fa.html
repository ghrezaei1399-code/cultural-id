<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }

        .card-container {
            max-width: 420px;
            width: 100%;
            background: #0a0a0a;
            border-radius: 32px;
            padding: 2.5rem 2rem 2.5rem 2rem;
            border: 3px solid #d4af37;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2), inset 0 0 60px rgba(212, 175, 55, 0.05);
            text-align: center;
            position: relative;
        }

        /* ===== هولوگرام (پایین سمت چپ) ===== */
        .holo-icon {
            position: absolute;
            bottom: 15px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #d4af37, #f9e79f, #b8860b, #d4af37, #f9e79f, #d4af37);
            animation: holoSpin 3s linear infinite;
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            opacity: 0.9;
        }
        @keyframes holoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== لوگو ===== */
        .logo-wrapper {
            display: inline-block;
            padding: 0.3rem 1rem;
            border: 2px solid #d4af37;
            border-radius: 60px;
            margin-bottom: 0.2rem;
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #f9e79f;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* ===== عنوان کارت (یک باکس) ===== */
        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 2px;
            padding: 0.4rem 1.5rem;
            border: 2px solid #d4af37;
            border-radius: 40px;
            display: inline-block;
            margin: 0.2rem 0 0.8rem 0;
            background: rgba(212, 175, 55, 0.03);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.08);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* ===== کد کارت ===== */
        .card-code {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            border: 2px solid #d4af37;
            margin: 0.6rem 0 0.4rem 0;
            direction: ltr;
            font-family: 'Courier New', monospace;
            color: #f9e79f;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08), inset 0 0 30px rgba(212, 175, 55, 0.03);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* ===== نشان ===== */
        .badge {
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            margin: 0.2rem 0;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #d4af37;
            letter-spacing: 1px;
        }
        .badge.golden {
            background: rgba(212, 175, 55, 0.12);
            border-color: #d4af37;
            color: #f9e79f;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* ===== دکمه‌های زیر کارت ===== */
        .actions {
            max-width: 420px;
            width: 100%;
            margin-top: 1.5rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn {
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn:hover {
            transform: scale(1.02);
            background: rgba(60, 30, 10, 0.04);
        }
        body.dark .btn:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-gold {
            border-color: rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }
        .btn-gold:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: #d4af37;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-top: 1rem;
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error {
            color: #b08080;
            background: rgba(200, 50, 50, 0.01);
            border-color: rgba(200, 50, 50, 0.01);
        }
        .loading {
            text-align: center;
            padding: 2rem 0;
            opacity: 0.6;
            color: #d4af37;
        }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
        .note {
            text-align: center;
            font-size: 0.55rem;
            opacity: 0.2;
            margin-top: 1.2rem;
            color: #1a0a0a;
        }
        body.dark .note { color: #b0a090; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="card-container">
        <!-- هولوگرام (پایین سمت چپ) -->
        <div class="holo-icon"></div>

        <div id="messageBox" class="message-box"></div>
        <div id="loading" class="loading">⏳ در حال بارگیری اطلاعات...</div>

        <div id="cardContent" style="display:none;">
            <!-- لوگو -->
            <div class="logo-wrapper">
                <div class="logo">🌍</div>
            </div>

            <!-- عنوان کارت (یک باکس) -->
            <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>

            <!-- نشان -->
            <div id="badgeContainer"></div>

            <!-- کد کارت -->
            <div class="card-code" id="cardCode">---</div>
        </div>
    </div>

    <div class="actions" id="actions" style="display:none;">
        <a href="#" class="btn btn-gold" id="backCardBtn">🔍 پشت کارت</a>
        <a href="edit-fa.html" class="btn btn-gold" id="editLink">✏️ ویرایش</a>
        <a href="index.html" class="btn">↩ بازگشت</a>
    </div>

    <div class="note">بدون اطلاعات شخصی • کاملاً ناشناس</div>

    <script>
        // ===== تم =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== دریافت کد از URL =====
        function getCardCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('code') || localStorage.getItem('culturalCardCode');
        }

        const cardCode = getCardCode();

        if (!cardCode) {
            document.getElementById('loading').style.display = 'none';
            const box = document.getElementById('messageBox');
            box.textContent = '❌ کد کارت یافت نشد. لطفاً از صفحه ثبت‌نام اقدام کنید.';
            box.className = 'message-box error';
            box.style.display = 'block';
        }

        // ===== بارگیری اطلاعات از مخزن =====
        async function loadCardData() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/ghrezaei1399-code/cultural-id/contents/data/active/${cardCode}.json`,
                    {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    }
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('کارت با این کد یافت نشد.');
                    }
                    throw new Error('خطا در دریافت اطلاعات');
                }

                const data = await response.json();
                const decoded = atob(data.content);
                const content = decodeURIComponent(decoded);
                const user = JSON.parse(content);

                return user;
            } catch (error) {
                throw error;
            }
        }

        // ===== نمایش کارت =====
        async function renderCard() {
            const loading = document.getElementById('loading');
            const cardContent = document.getElementById('cardContent');
            const actions = document.getElementById('actions');

            try {
                const user = await loadCardData();

                document.getElementById('cardCode').textContent = user.cardCode || cardCode;

                const badgeContainer = document.getElementById('badgeContainer');
                if (user.badge === 'golden') {
                    badgeContainer.innerHTML = '<span class="badge golden">🌟 نشان طلایی</span>';
                } else {
                    badgeContainer.innerHTML = '<span class="badge">نشان نقره‌ای</span>';
                }

                document.getElementById('editLink').href = `edit-fa.html?code=${cardCode}`;
                document.getElementById('backCardBtn').href = `card-back-fa.html?code=${cardCode}`;

                loading.style.display = 'none';
                cardContent.style.display = 'block';
                actions.style.display = 'flex';

            } catch (error) {
                loading.style.display = 'none';
                const box = document.getElementById('messageBox');
                box.textContent = `❌ ${error.message}`;
                box.className = 'message-box error';
                box.style.display = 'block';
            }
        }

        if (cardCode) {
            renderCard();
        }
    </script>
</body>
</html>
