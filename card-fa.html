<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        
        /* ===== نمونه کارت واقعی ===== */
        .real-card-sample {
            width: 100%; 
            background: #0a0a0a; 
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.1);
            border-radius: 18px; 
            padding: 1.5rem 1rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            gap: 1rem;
            position: relative;
        }
        
        /* لوگو در بالاترین نقطه */
        .rc-logo-container { 
            width: 70px; height: 70px; 
            border-radius: 50%; 
            border: 2px solid #d4af37; 
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 0.5rem;
        }
        .rc-logo { width: 45px; height: 45px; object-fit: contain; }
        .rc-title { font-size: 0.9rem; font-weight: 800; color: #d4af37; line-height: 1.3; }
        
        /* ===== بخش کد ===== */
        .rc-code-section {
            width: 100%;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 0.8rem;
        }
        .rc-code { 
            font-family: 'Courier New', monospace; 
            font-size: 1.1rem; 
            color: #f0f0f0; 
            letter-spacing: 1px; 
            font-weight: bold; 
            direction: ltr; 
        }
        
        /* عناوین کوتاه ارزش‌ها */
        .rc-values { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            justify-content: center; 
            width: 100%; 
        }
        .rc-tag { 
            background: rgba(212, 175, 55, 0.15); 
            border: 1px solid #d4af37; 
            border-radius: 5px; 
            padding: 4px 10px; 
            font-size: 0.7rem; 
            color: #d4af37; 
            white-space: nowrap; 
            font-weight: 600; 
        }

        /* QR Code جایگزین هولوگرام در پایین */
        .qr-section {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }
        #qrcode {
            background: white;
            padding: 4px;
            border-radius: 6px;
        }
        .qr-label {
            font-size: 0.55rem;
            color: #d4af37;
            opacity: 0.8;
            text-align: center;
        }

        /* سه ماژول دکمه */
        .btn-group { display: flex; gap: 0.8rem; margin-top: 2rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary {
            background: rgba(255, 255, 255, 0.02);
            color: #f9e79f;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        body.dark .btn-primary:hover { background: rgba(255, 255, 255, 0.04); }
        
        .note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 1.5rem;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .note { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle {
            color: #f9e79f;
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .theme-toggle:hover { transform: scale(1.1); }
        @font-face { font-family: 'Vazir'; src: local('Vazir'), local('IRANSans'); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>🪪 شناسنامه فرهنگی شما</h1>
        <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="real-card-sample">
            <!-- لوگو در بالا -->
            <div class="rc-logo-container">
                <img src="assets/logo-fa.png" alt="لوگو" class="rc-logo" onerror="this.style.display='none'">
            </div>
            <div class="rc-title">کارت جهانی هویت<br>هوشمند فرهنگی</div>
            
            <!-- کد کارت -->
            <div class="rc-code-section">
                <div class="rc-code" id="cardCodeDisplay">CIM - .... - .... - ....</div>
            </div>
            
            <!-- عناوین کوتاه ارزش‌ها (بدون محتوا) -->
            <div class="rc-values">
                <span class="rc-tag">ارزش‌های بومی</span>
                <span class="rc-tag">دانش فردی</span>
                <span class="rc-tag">همکاری جمعی</span>
                <span class="rc-tag">تنوع فرهنگی</span>
                <span class="rc-tag">صلح پایدار</span>
                <span class="rc-tag">محو خشونت</span>
                <span class="rc-tag">اتحاد فرهنگی</span>
            </div>

            <!-- QR Code در پایین (جای هولوگرام) -->
            <div class="qr-section">
                <div id="qrcode"></div>
                <div class="qr-label">مشاهده منشور و مستندات</div>
            </div>
        </div>

        <!-- سه ماژول: پشت کارت / بازگشت / ذخیره -->
        <div class="btn-group">
            <a href="#" class="btn btn-primary" onclick="alert('صفحه پشت کارت به زودی اضافه می‌شود')">↩️ پشت کارت</a>
            <a href="index.html" class="btn btn-primary">🏠 بازگشت به خانه</a>
            <button class="btn btn-primary" onclick="window.print()">💾 ذخیره کارت</button>
        </div>

        <div class="note">
            🔒 کاملاً ناشناس • بدون اطلاعات هویتی • فقط اطلاعات فرهنگی
        </div>
    </div>

    <script>
        // Theme Toggle
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // Load Card Data
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            
            if (!code) {
                document.querySelector('.container').innerHTML = '<h2 style="text-align:center; color:red;">کد کارت یافت نشد!</h2>';
                return;
            }

            // QR Code
            const qrUrl = window.location.origin + '/about-fa.html';
            new QRCode(document.getElementById("qrcode"), {
                text: qrUrl,
                width: 70,
                height: 70,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Fetch & Display Code
            fetch(`/api/get-user?code=${encodeURIComponent(code)}`)
                .then(res => res.json())
                .then(data => {
                    const displayElement = document.getElementById('cardCodeDisplay');
                    if (data.user && data.user.displayCode) {
                        displayElement.textContent = data.user.displayCode;
                    } else {
                        displayElement.textContent = code.replace(/-/g, ' - ');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('cardCodeDisplay').textContent = code.replace(/-/g, ' - ');
                });
        });
    </script>
</body>
</html>
