<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی | Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Vazir', 'IRANSans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        /* کانتینر اصلی شفاف */
        .card-container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.0);
            backdrop-filter: blur(0px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            position: relative;
            display: none;
        }
        
        /* لوگو */
        .card-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 1.5rem;
            display: block;
        }
        
        /* عنوان کارت */
        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }
        
        /* باکس کد اصلی */
        .card-code-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .card-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2a1a0a;
            letter-spacing: 2px;
        }
        
        /* باکس کد اختیاری */
        .optional-code-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }
        
        .optional-code-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
        
        .optional-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            color: #2a1a0a;
            letter-spacing: 1px;
        }
        
        /* بخش ارزش‌های فرهنگی */
        .values-section {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }
        
        .values-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #2a1a0a;
            margin-bottom: 0.8rem;
            text-align: center;
        }
        
        .values-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        
        .value-item {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            color: #2a1a0a;
            line-height: 1.5;
        }
        
        .value-item::before {
            content: "• ";
            color: #d4af37;
            font-weight: bold;
            margin-left: 0.3rem;
        }
        
        /* هولوگرام */
        .hologram {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            display: block;
            opacity: 0.9;
        }
        
        /* پیام خطا */
        .error-message {
            color: #dc2626;
            background: rgba(254, 226, 226, 0.95);
            padding: 1.5rem;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 600;
            max-width: 450px;
            width: 100%;
            border: 2px solid #dc2626;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContent">
        <!-- ۱. لوگوی فارسی -->
        <img src="assets/logo-fa.png" alt="Logo" class="card-logo" id="cardLogo" onerror="this.style.display='none'">
        
        <!-- ۲. نام کارت -->
        <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>

        <!-- ۳. باکس کد اصلی -->
        <div class="card-code-box">
            <div class="card-code" id="displayCardCode">---</div>
        </div>

        <!-- ۴. باکس کد اختیاری -->
        <div class="optional-code-box" id="optionalCodeBox">
            <div class="optional-code-label">کد اختیاری:</div>
            <div class="optional-code" id="displayOptionalCode">---</div>
        </div>

        <!-- ۵. بخش ارزش‌های فرهنگی -->
        <div class="values-section">
            <div class="values-title">ارزش‌های فرهنگی ثبت شده:</div>
            <div class="values-list" id="displayValues"></div>
        </div>

        <!-- ۶. هولوگرام در پایین -->
        <img src="assets/hologram.png" alt="Hologram" class="hologram" onerror="this.style.display='none'">
    </div>

    <div class="error-message" id="cardErrorMessage">
        ❌ کارت با این کد یافت نشد.
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardCode = urlParams.get('code');

        async function loadCardData() {
            if (!cardCode || cardCode === 'undefined') {
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = '❌ کد کارت نامعتبر است.';
                return;
            }

            try {
                const response = await fetch(`/api/get-user?code=${cardCode}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'خطا در دریافت اطلاعات');
                }

                const user = data.user;

                // نمایش کد اصلی
                document.getElementById('displayCardCode').textContent = user.cardCode || '---';
                
                // نمایش کد اختیاری (اگر وجود داشته باشد)
                if (user.optionalCode && user.optionalCode.trim() !== '') {
                    document.getElementById('displayOptionalCode').textContent = user.optionalCode;
                    document.getElementById('optionalCodeBox').style.display = 'block';
                }

                // نمایش ارزش‌های فرهنگی
                const valuesContainer = document.getElementById('displayValues');
                valuesContainer.innerHTML = '';
                if (user.values && user.values.length > 0) {
                    user.values.forEach(v => {
                        const div = document.createElement('div');
                        div.className = 'value-item';
                        div.textContent = v;
                        valuesContainer.appendChild(div);
                    });
                } else {
                    valuesContainer.innerHTML = '<div class="value-item">ثبت نشده</div>';
                }

                // نمایش کارت و مخفی کردن خطا
                document.getElementById('cardErrorMessage').style.display = 'none';
                document.getElementById('cardContent').style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cardErrorMessage').style.display = 'block';
                document.getElementById('cardErrorMessage').textContent = `❌ ${error.message}`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
