<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: url('assets/pisa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1a0a0a;
        }
        body.dark { color: #f0e8e0; }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(0px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a1a0a;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        body.dark h1 { color: #f9e79f; }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #4a2a1a;
            opacity: 0.8;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(30, 10, 0, 0.05);
            padding-bottom: 1rem;
        }
        body.dark .subtitle { color: #d0c0b0; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(30, 10, 0, 0.02);
            text-align: center;
        }
        body.dark .card { border-color: rgba(255, 255, 255, 0.02); }
        .card-logo {
            max-height: 60px;
            width: auto;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2a1a0a;
            margin-bottom: 0.5rem;
        }
        body.dark .card-title { color: #f9e79f; }
        .card-code {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: inline-block;
            margin: 0.5rem 0;
            direction: ltr;
            color: #2a1a0a;
            border: 1px solid rgba(30, 10, 0, 0.02);
        }
        body.dark .card-code { color: #f9e79f; border-color: rgba(255, 255, 255, 0.02); }
        .card-optional {
            font-size: 0.9rem;
            opacity: 0.7;
            margin: 0.3rem 0;
            color: #4a2a1a;
        }
        body.dark .card-optional { color: #b0a090; }
        .card-values {
            text-align: right;
            margin: 1.5rem 0;
            padding: 0 1rem;
        }
        .card-values .value-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 0.85rem;
            color: #2a1a0a;
        }
        body.dark .card-values .value-item { color: #e8d8c8; border-bottom-color: rgba(255, 255, 255, 0.02); }
        .card-values .value-number {
            font-weight: 700;
            color: #4a2a1a;
            min-width: 24px;
        }
        body.dark .card-values .value-number { color: #f9e79f; }
        .card-qr {
            margin: 1rem auto;
            padding: 0.5rem;
            background: white;
            display: inline-block;
            border-radius: 8px;
        }
        .card-qr canvas { display: block; margin: 0 auto; }
        .card-footer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            opacity: 0.4;
            color: #1a0a0a;
            border-top: 1px solid rgba(30, 10, 0, 0.02);
            padding-top: 1rem;
        }
        body.dark .card-footer { color: #b0a090; border-top-color: rgba(255, 255, 255, 0.02); }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        .btn-primary {
            background: rgba(60, 30, 10, 0.02);
            color: #2a1a0a;
            border: 1px solid rgba(60, 30, 10, 0.02);
        }
        body.dark .btn-primary { background: rgba(255, 255, 255, 0.02); color: #f9e79f; border-color: rgba(255, 255, 255, 0.02); }
        .btn-primary:hover { background: rgba(60, 30, 10, 0.04); transform: scale(1.02); }
        body.dark .btn-primary:hover { background: rgba(255, 255, 255, 0.04); }
        .btn-secondary {
            background: rgba(60, 30, 10, 0.01);
            color: #3a2a1a;
            border: 1px solid rgba(60, 30, 10, 0.01);
        }
        body.dark .btn-secondary { background: rgba(255, 255, 255, 0.01); color: #a09080; border-color: rgba(255, 255, 255, 0.01); }
        .btn-secondary:hover { background: rgba(60, 30, 10, 0.03); transform: scale(1.02); }
        body.dark .btn-secondary:hover { background: rgba(255, 255, 255, 0.03); }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(30, 10, 0, 0.02);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: 0.3s;
            color: #1a0a0a;
        }
        body.dark .theme-toggle { color: #f9e79f; background: rgba(0, 0, 0, 0.05); border-color: rgba(255, 255, 255, 0.02); }
        .theme-toggle:hover { transform: scale(1.1); }
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('IRANSans');
        }
        .hidden { display: none; }
        .loading {
            text-align: center;
            padding: 2rem;
            opacity: 0.6;
        }
        .message-box {
            display: none;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .message-box.error {
            display: block;
            background: rgba(200, 50, 50, 0.05);
            border: 1px solid rgba(200, 50, 50, 0.05);
            color: #5a0a0a;
        }
        body.dark .message-box.error { color: #b08080; background: rgba(200, 50, 50, 0.01); border-color: rgba(200, 50, 50, 0.01); }
        .message-box.success {
            display: block;
            background: rgba(50, 200, 50, 0.05);
            border: 1px solid rgba(50, 200, 50, 0.05);
            color: #0a5a0a;
        }
        body.dark .message-box.success { color: #80b080; background: rgba(50, 200, 50, 0.01); border-color: rgba(50, 200, 50, 0.01); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>🪪 کارت جهانی هویت هوشمند فرهنگی</h1>
        <div class="subtitle">شناسنامه‌ی فرهنگی شما</div>

        <div id="messageBox" class="message-box"></div>

        <div id="loading" class="loading">⏳ در حال بارگذاری کارت...</div>

        <div id="cardContainer" class="hidden">
            <div class="card">
                <img src="assets/logo-fa.png" alt="لوگو" class="card-logo" />
                <div class="card-title">کارت جهانی هویت هوشمند فرهنگی</div>
                <div class="card-code" id="cardCode">CIM-XXXX-XXXX-X</div>
                <div class="card-optional" id="cardOptional">کد اختیاری: ---</div>

                <div class="card-values" id="cardValues"></div>

                <div class="card-qr" id="qrContainer"></div>

                <div class="card-footer">
                    🌍 تنوع فرهنگی حفظ شود؛ انسان‌ها خودشان اشتراکات فرهنگی‌شان را پیدا کنند.
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-secondary">↩ بازگشت به صفحه اصلی</a>
            <a href="card-back-fa.html" class="btn btn-primary">🔍 پشت کارت</a>
        </div>
    </div>

    <script>
        // ===== تم =====
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // ===== نمایش پیام =====
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.style.display = 'none';
            box.className = 'message-box';
        }

        // ===== تولید QR Code =====
        function generateQRCode(text, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            try {
                if (typeof QRCode !== 'undefined') {
                    new QRCode(container, {
                        text: text,
                        width: 120,
                        height: 120,
                        colorDark: '#1a0a0a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    const fallback = document.createElement('div');
                    fallback.style.cssText = `padding:1rem; background:white; border-radius:8px; display:inline-block; font-size:0.7rem; color:#1a0a0a; direction:ltr;`;
                    fallback.textContent = `📱 کد: ${text}`;
                    container.appendChild(fallback);
                }
            } catch(e) {
                const fallback = document.createElement('div');
                fallback.style.cssText = `padding:1rem; background:white; border-radius:8px; display:inline-block; font-size:0.7rem; color:#1a0a0a; direction:ltr;`;
                fallback.textContent = `📱 کد: ${text}`;
                container.appendChild(fallback);
            }
        }

        // ===== خواندن از مخزن با استفاده از GitHub API =====
        async function loadFromRepository(cardCode) {
            const REPO_OWNER = 'ghrezaei1399-code';
            const REPO_NAME = 'cultural-id';
            const FILE_PATH = `data/active/${cardCode}.json`;

            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const response = await fetch(url, {
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('کارت با این کد یافت نشد.');
                }
                const errorData = await response.json();
                throw new Error(`خطا در خواندن فایل: ${errorData.message || 'ناشناخته'}`);
            }

            const data = await response.json();
            const content = JSON.parse(atob(data.content));
            return content;
        }

        // ===== بارگذاری کارت =====
        (async function() {
            const loading = document.getElementById('loading');
            const cardContainer = document.getElementById('cardContainer');
            hideMessage();

            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');

            let cardCode = codeFromUrl || localStorage.getItem('culturalCardCode');

            if (!cardCode) {
                loading.classList.add('hidden');
                showMessage('❌ کد کارت یافت نشد. لطفاً از طریق ثبت‌نام اقدام کنید.', 'error');
                return;
            }

            try {
                let cardData = await loadFromRepository(cardCode);

                document.getElementById('cardCode').textContent = cardData.cardCode;
                document.getElementById('cardOptional').textContent = cardData.optionalCode ? 
                    `کد اختیاری: ${cardData.optionalCode}` : 'کد اختیاری: ---';

                const valuesContainer = document.getElementById('cardValues');
                valuesContainer.innerHTML = '';
                const valueLabels = [
                    'ارزش‌های بومی',
                    'دانش فردی',
                    'همکاری جمعی',
                    'تنوع فرهنگی',
                    'صلح پایدار جهانی',
                    'محو خشونت',
                    'اتحاد فرهنگی'
                ];

                if (cardData.values && Array.isArray(cardData.values)) {
                    cardData.values.forEach((value, index) => {
                        if (value && value.trim()) {
                            const div = document.createElement('div');
                            div.className = 'value-item';
                            div.innerHTML = `
                                <span class="value-number">${index + 1}.</span>
                                <span>${value}</span>
                            `;
                            valuesContainer.appendChild(div);
                        }
                    });
                } else {
                    const stored = localStorage.getItem('culturalCardData');
                    if (stored) {
                        const localData = JSON.parse(stored);
                        if (localData.values) {
                            localData.values.forEach((value, index) => {
                                if (value && value.trim()) {
                                    const div = document.createElement('div');
                                    div.className = 'value-item';
                                    div.innerHTML = `
                                        <span class="value-number">${index + 1}.</span>
                                        <span>${value}</span>
                                    `;
                                    valuesContainer.appendChild(div);
                                }
                            });
                        }
                    }
                }

                generateQRCode(cardData.cardCode, 'qrContainer');

                loading.classList.add('hidden');
                cardContainer.classList.remove('hidden');

                localStorage.setItem('culturalCardData', JSON.stringify(cardData));
                localStorage.setItem('culturalCardCode', cardData.cardCode);

            } catch (error) {
                console.error('Error loading card:', error);
                
                const stored = localStorage.getItem('culturalCardData');
                if (stored) {
                    try {
                        const cardData = JSON.parse(stored);
                        document.getElementById('cardCode').textContent = cardData.cardCode || cardCode;
                        document.getElementById('cardOptional').textContent = cardData.optionalCode ? 
                            `کد اختیاری: ${cardData.optionalCode}` : 'کد اختیاری: ---';

                        const valuesContainer = document.getElementById('cardValues');
                        valuesContainer.innerHTML = '';
                        if (cardData.values) {
                            cardData.values.forEach((value, index) => {
                                if (value && value.trim()) {
                                    const div = document.createElement('div');
                                    div.className = 'value-item';
                                    div.innerHTML = `
                                        <span class="value-number">${index + 1}.</span>
                                        <span>${value}</span>
                                    `;
                                    valuesContainer.appendChild(div);
                                }
                            });
                        }
                        generateQRCode(cardData.cardCode || cardCode, 'qrContainer');
                        loading.classList.add('hidden');
                        cardContainer.classList.remove('hidden');
                        showMessage('⚠️ اطلاعات از حافظه موقت نمایش داده شد. اتصال به مخزن برقرار نیست.', 'success');
                    } catch(e2) {
                        loading.classList.add('hidden');
                        showMessage(`❌ خطا: ${error.message}`, 'error');
                    }
                } else {
                    loading.classList.add('hidden');
                    showMessage(`❌ خطا: ${error.message}`, 'error');
                }
            }
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
