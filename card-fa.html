<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کارت هویت فرهنگی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-header .badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .badge.golden {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #78350f;
        }

        .badge.normal {
            background: #e2e8f0;
            color: #475569;
        }

        .card-header h1 {
            font-size: 22px;
            color: #1e293b;
        }

        .card-header .card-id {
            font-size: 14px;
            color: #64748b;
            font-family: monospace;
            letter-spacing: 2px;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        .info-value {
            color: #0f172a;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
        }

        .values-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        .values-section h3 {
            font-size: 16px;
            color: #334155;
            margin-bottom: 12px;
        }

        .value-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .value-tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #fff;
            font-size: 18px;
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #fff;
            font-size: 18px;
        }

        .error a {
            color: #fbbf24;
            text-decoration: underline;
        }

        .back-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .footer-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-actions a {
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-edit {
            background: #6366f1;
            color: #fff;
        }

        .btn-edit:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-request {
            background: #10b981;
            color: #fff;
        }

        .btn-request:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }
            .info-row {
                flex-direction: column;
                gap: 4px;
            }
            .info-value {
                text-align: right;
            }
        }
    </style>
</head>
<body>
    <div class="card-container" id="app">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>در حال بارگیری اطلاعات...</div>
        </div>

        <div id="cardContent" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span class="badge" id="badge">نشان</span>
                    <h1>🌍 کارت هویت فرهنگی</h1>
                    <div class="card-id" id="cardId">CID-XXXXXXXX</div>
                </div>

                <div class="info-row">
                    <span class="info-label">👤 نام و نام خانوادگی</span>
                    <span class="info-value" id="fullName">---</span>
                </div>

                <div class="info-row">
                    <span class="info-label">🌍 کشور</span>
                    <span class="info-value" id="country">---</span>
                </div>

                <div class="info-row">
                    <span class="info-label">🏙️ شهر</span>
                    <span class="info-value" id="city">---</span>
                </div>

                <div class="info-row">
                    <span class="info-label">📧 ایمیل</span>
                    <span class="info-value" id="email">---</span>
                </div>

                <div class="info-row">
                    <span class="info-label">📅 تاریخ ثبت</span>
                    <span class="info-value" id="registeredAt">---</span>
                </div>

                <div class="values-section">
                    <h3>🌟 ارزش‌های فرهنگی</h3>
                    <div class="value-tags" id="values"></div>
                </div>

                <div class="footer-actions">
                    <a href="edit-fa.html?cardId=CID-XXXXXXXX" class="btn-edit" id="editLink">✏️ ویرایش</a>
                    <a href="request-fa.html?cardId=CID-XXXXXXXX" class="btn-request" id="requestLink">🤝 ارتباط با هم‌فکران</a>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="index.html" class="back-btn">🏠 بازگشت به صفحه اصلی</a>
                </div>
            </div>
        </div>

        <div class="error" id="error" style="display: none;">
            <div style="font-size: 48px; margin-bottom: 16px;">😕</div>
            <p id="errorMessage">خطا در بارگیری اطلاعات</p>
            <a href="index.html" class="back-btn">🏠 بازگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        function getCardIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('cardId') || sessionStorage.getItem('cardId');
        }

        const cardId = getCardIdFromUrl();

        if (!cardId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = 'کد کارت یافت نشد. لطفاً از صفحه ثبت‌نام اقدام کنید.';
            throw new Error('No card ID found');
        }

        document.getElementById('editLink').href = `edit-fa.html?cardId=${cardId}`;
        document.getElementById('requestLink').href = `request-fa.html?cardId=${cardId}`;

        async function fetchUserData() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/ghrezaei1399-code/cultural-id/contents/data/active/${cardId}.json`,
                    { headers: { 'Accept': 'application/vnd.github.v3+json' } }
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('کارت با این کد یافت نشد. ممکن است حذف شده باشد.');
                    }
                    throw new Error(`خطا در دریافت اطلاعات: ${response.status}`);
                }

                const data = await response.json();
                const content = atob(data.content);
                const user = JSON.parse(content);
                return user;
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }

        async function renderCard() {
            const loading = document.getElementById('loading');
            const cardContent = document.getElementById('cardContent');
            const errorDiv = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');

            try {
                const user = await fetchUserData();

                document.getElementById('cardId').textContent = user.cardId || cardId;
                document.getElementById('fullName').textContent = user.fullName || '---';
                document.getElementById('country').textContent = user.country || '---';
                document.getElementById('city').textContent = user.city || '---';
                document.getElementById('email').textContent = user.email || '---';
                document.getElementById('registeredAt').textContent =
                    user.registeredAt ? new Date(user.registeredAt).toLocaleDateString('fa-IR') : '---';

                const badge = document.getElementById('badge');
                if (user.badge === 'golden') {
                    badge.textContent = '🌟 نشان طلایی';
                    badge.className = 'badge golden';
                } else {
                    badge.textContent = 'نشان نقره‌ای';
                    badge.className = 'badge normal';
                }

                const valuesContainer = document.getElementById('values');
                const valueLabels = {
                    honesty: '🔹 راستی و صداقت',
                    justice: '⚖️ عدالت',
                    peace: '🕊️ صلح‌جویی',
                    knowledge: '📚 دانش‌ورزی',
                    art: '🎨 هنر و زیبایی',
                    nature: '🌿 طبیعت‌دوستی',
                    family: '👨‍👩‍👧‍👦 خانواده‌گرایی',
                    freedom: '🕊️ آزادگی',
                    respect: '🤝 احترام به دیگران',
                    progress: '🚀 پیشرفت و نوآوری'
                };

                valuesContainer.innerHTML = '';
                if (user.values && user.values.length > 0) {
                    user.values.forEach(val => {
                        const tag = document.createElement('span');
                        tag.className = 'value-tag';
                        tag.textContent = valueLabels[val] || val;
                        valuesContainer.appendChild(tag);
                    });
                } else {
                    valuesContainer.innerHTML = '<span style="color: #94a3b8;">ارزشی انتخاب نشده است</span>';
                }

                loading.style.display = 'none';
                cardContent.style.display = 'block';

            } catch (error) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorMessage.textContent = error.message || 'خطا در بارگیری اطلاعات';
            }
        }

        renderCard();
    </script>
</body>
</html>
