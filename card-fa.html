<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>کارت هویت فرهنگی | Global Smart Cultural ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            /* پس‌زمینه متحرک و مدرن */
            background: linear-gradient(-45deg, #fdf6e3, #e8f4f8, #f5e6d3, #e0f7fa);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #2a1a0a;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body.dark { 
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #232526);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f0e8e0; 
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 48px;
            padding: 3rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
        }
        body.dark .container { background: rgba(0, 0, 0, 0.45); border-color: rgba(255, 255, 255, 0.1); }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #8a6d1f;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }
        body.dark h1 { color: #ffd700; }
        
        .subtitle {
            text-align: center;
            font-size: 1rem;
            color: #6a5a3a;
            opacity: 0.9;
            margin-bottom: 2.5rem;
            border-bottom: 2px dashed rgba(138, 109, 31, 0.2);
            padding-bottom: 1.5rem;
            font-weight: 600;
        }
        body.dark .subtitle { color: #c8b890; }

        /* زیباسازی کارت هویت */
        .real-card-sample {
            width: 100%; 
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.1);
            border-radius: 24px; 
            padding: 2rem 1.5rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            gap: 1.2rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .real-card-sample:hover { transform: scale(1.02); }
        
        .rc-logo-container { 
            width: 80px; height: 80px; 
            border-radius: 50%; 
            border: 3px solid #d4af37; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .rc-logo { width: 50px; height: 50px; object-fit: contain; }
        
        .rc-title { 
            font-size: 1.1rem; 
            font-weight: 900; 
            color: #d4af37; 
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        
        .rc-code-section {
            width: 100%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .rc-code { 
            font-family: 'Courier New', monospace; 
            font-size: 1rem; 
            color: #fff; 
            letter-spacing: 1px; 
            font-weight: bold; 
            direction: ltr; 
            flex: 1;
        }
        
        /* دکمه کپی کد */
        .copy-btn {
            background: #d4af37;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .copy-btn:hover { background: #f9e79f; transform: scale(1.05); }
        .copy-btn:active { transform: scale(0.95); }

        .rc-values { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            justify-content: center; 
            width: 100%; 
        }
        .rc-tag { 
            background: rgba(212, 175, 55, 0.2); 
            border: 1px solid rgba(212, 175, 55, 0.5); 
            border-radius: 20px; 
            padding: 5px 12px; 
            font-size: 0.75rem; 
            color: #f9e79f; 
            white-space: nowrap; 
            font-weight: 600; 
            transition: 0.3s;
        }
        .rc-tag:hover { background: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }

        .qr-section {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 12px;
        }
        #qrcode { background: white; padding: 5px; border-radius: 8px; }
        .qr-label { font-size: 0.6rem; color: #d4af37; opacity: 0.9; }

        /* دکمه‌های متحرک */
        .btn-group { display: flex; gap: 1rem; margin-top: 2.5rem; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #f9e79f);
            color: #2a1a0a;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4); }
        
        .note {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 2.5rem;
            color: #6a5a3a;
            font-weight: 600;
        }
        
        .theme-toggle {
            position: fixed; top: 1.5rem; right: 1.5rem;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(212, 175, 55, 0.3);
            font-size: 1.6rem; cursor: pointer;
            padding: 0.6rem 1.2rem; border-radius: 60px;
            transition: 0.4s; color: #8a6d1f;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }
        .theme-toggle:hover { transform: rotate(30deg) scale(1.15); background: #fff; }
        body.dark .theme-toggle { background: rgba(0,0,0,0.5); color: #ffd700; border-color: rgba(255,255,255,0.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <h1>🪪 شناسنامه فرهنگی شما</h1>
        <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>

        <div class="real-card-sample" id="cardToSave">
            <div class="rc-logo-container">
                <img src="assets/logo-fa.png" alt="لوگو" class="rc-logo" onerror="this.style.display='none'">
            </div>
            <div class="rc-title">کارت جهانی هویت هوشمند فرهنگی</div>
            
            <div class="rc-code-section">
                <div class="rc-code" id="cardCodeDisplay">CIM - .... - .... - ....</div>
                <!-- دکمه کپی کد -->
                <button class="copy-btn" onclick="copyCode()" title="کپی کردن کد">
                    📋 کپی
                </button>
            </div>
            
            <div class="rc-values">
                <span class="rc-tag">ارزش‌های بومی</span>
                <span class="rc-tag">دانش فردی</span>
                <span class="rc-tag">همکاری جمعی</span>
                <span class="rc-tag">تنوع فرهنگی</span>
                <span class="rc-tag">صلح پایدار</span>
                <span class="rc-tag">محو خشونت</span>
                <span class="rc-tag">اتحاد فرهنگی</span>
            </div>

            <div class="qr-section">
                <div id="qrcode"></div>
                <div class="qr-label">مشاهده منشور و مستندات</div>
            </div>
        </div>

        <div class="btn-group">
            <a href="#" id="backCardLink" class="btn btn-primary">↩️ پشت کارت</a>
            <a href="index.html" class="btn btn-primary"> بازگشت به خانه</a>
            <button class="btn btn-primary" id="saveBtn">💾 ذخیره کارت</button>
        </div>

        <div class="note">
            🔒 کاملاً ناشناس • بدون اطلاعات هویتی • فقط اطلاعات فرهنگی
        </div>
    </div>

    <script>
        // Theme Toggle Logic
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                toggle.textContent = '☀️';
            }
            toggle.addEventListener('click', function() {
                body.classList.toggle('dark');
                if (body.classList.contains('dark')) {
                    toggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    toggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        })();

        // Copy Code Function
        function copyCode() {
            const codeText = document.getElementById('cardCodeDisplay').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ کپی شد!';
                btn.style.background = '#2ed573';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '#d4af37';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('کد شما: ' + codeText);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            
            if (!code) {
                document.querySelector('.container').innerHTML = '<h2 style="text-align:center; color:red;">کد کارت یافت نشد!</h2>';
                return;
            }

            // تنظیم لینک پویا برای پشت کارت
            const backLink = document.getElementById('backCardLink');
            if (backLink) {
                backLink.href = `card-back-fa.html?code=${encodeURIComponent(code)}`;
            }

            const qrUrl = window.location.origin + '/about-fa.html';
            new QRCode(document.getElementById("qrcode"), {
                text: qrUrl,
                width: 70,
                height: 70,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            fetch(`/api/get-user?code=${encodeURIComponent(code)}`)
                .then(res => res.json())
                .then(data => {
                    const displayElement = document.getElementById('cardCodeDisplay');
                    if (data.user && data.user.displayCode) {
                        displayElement.textContent = data.user.displayCode;
                    } else {
                        displayElement.textContent = code.replace(/-/g, ' - ');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('cardCodeDisplay').textContent = code.replace(/-/g, ' - ');
                });

            document.getElementById('saveBtn').addEventListener('click', async function() {
                const cardElement = document.getElementById('cardToSave');
                try {
                    const canvas = await html2canvas(cardElement, { 
                        backgroundColor: '#0a0a0a',
                        scale: 2 
                    });
                    const link = document.createElement('a');
                    link.download = `Cultural-ID-${code}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    alert('خطا در ذخیره کارت: ' + err.message);
                }
            });
        });
    </script>
</body>
</html>
