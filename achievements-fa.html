<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>ثبت دستاورد | نام‌آوران آزمایشگاه ظهور</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazir', sans-serif; min-height: 100vh; padding: 3rem 1rem; background: #fdf6e3; color: #2a1a0a; display: flex; justify-content: center; }
        .container { max-width: 700px; width: 100%; background: white; border-radius: 32px; padding: 3rem 2rem; border: 2px solid rgba(212,175,55,0.4); box-shadow: 0 20px 60px rgba(212,175,55,0.15); }
        h1 { color: #8a6d1f; font-size: 1.6rem; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { text-align: center; color: #6a5a3a; font-size: 0.9rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 1rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 800; margin-bottom: 0.5rem; color: #2a1a0a; }
        input, textarea { width: 100%; padding: 1rem; border-radius: 16px; border: 2px solid rgba(212,175,55,0.2); font-family: inherit; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: #d4af37; outline: none; }
        
        .upload-area { border: 2px dashed rgba(212,175,55,0.4); border-radius: 16px; padding: 2rem; text-align: center; cursor: pointer; transition: 0.3s; background: rgba(212,175,55,0.03); }
        .upload-area:hover { background: rgba(212,175,55,0.08); border-color: #d4af37; }
        
        .btn-submit { width: 100%; padding: 1rem; border-radius: 40px; border: none; background: linear-gradient(135deg, #d4af37, #f9e79f); color: #2a1a0a; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
        .note { font-size: 0.75rem; opacity: 0.6; margin-top: 1.5rem; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 ثبت دستاورد ظهور</h1>
        <div class="subtitle">مستندسازی نتیجه عملی کنشگری فرهنگی</div>
        
        <form id="achievementForm">
            <div class="form-group">
                <label>عنوان دستاورد</label>
                <input type="text" required placeholder="مثال: تشکیل شبکه محلی حفظ میراث شفاهی" />
            </div>
            
            <div class="form-group">
                <label>شرح کامل اقدام و نتایج</label>
                <textarea rows="5" required placeholder="چه کاری انجام دادید؟ چه تغییری ایجاد شد؟"></textarea>
            </div>
            
            <div class="form-group">
                <label>بارگذاری مستندات (متن، تصویر، ویدیو)</label>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    📎 کلیک کنید یا فایل‌ها را اینجا رها کنید<br>
                    <small style="opacity:0.6;">حداکثر ۵ فایل (jpg, png, mp4, pdf)</small>
                </div>
                <input type="file" id="fileInput" multiple style="display:none;" accept=".jpg,.png,.mp4,.pdf" />
            </div>
            
            <button type="submit" class="btn-submit"> ارسال برای بررسی ادمین</button>
        </form>
        
        <div class="note">
            دستاورد شما پس از بررسی کیفی توسط ناظر آزمایشگاه، در صورت تایید در بخش «نام‌آوران ظهور» نمایش داده خواهد شد.
        </div>
    </div>
</body>
</html>
