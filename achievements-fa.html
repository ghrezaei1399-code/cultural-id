<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>گالری نام‌آوران | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            color: #2a1a0a;
        }
        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-title {
            font-size: 2rem;
            font-weight: 900;
            color: #8a6d1f;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        body.dark .page-title { color: #f9e79f; }
        .page-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #6a5a3a;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            padding-bottom: 1rem;
        }
        body.dark .page-subtitle { color: #c8b890; }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .stat-item {
            text-align: center;
            padding: 0.5rem 1.5rem;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.15);
        }
        body.dark .stat-item { background: rgba(0,0,0,0.1); }
        .stat-item .number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #8a6d1f;
            display: block;
        }
        body.dark .stat-item .number { color: #f9e79f; }
        .stat-item .label {
            font-size: 0.7rem;
            color: #6a5a3a;
        }
        body.dark .stat-item .label { color: #c8b890; }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #8a6d1f;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(212,175,55,0.2);
        }
        body.dark .section-title { color: #f9e79f; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .ach-card, .obs-card {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
            transition: 0.3s;
            position: relative;
        }
        body.dark .ach-card, body.dark .obs-card { background: rgba(0,0,0,0.15); border-color: rgba(212,175,55,0.1); }
        .ach-card:hover, .obs-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(212,175,55,0.12);
        }
        body.dark .ach-card:hover, body.dark .obs-card:hover { box-shadow: 0 8px 30px rgba(212,175,55,0.05); }

        .obs-card { border-color: rgba(212,175,55,0.4); }
        .obs-card .obs-header {
            padding: 1rem 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .obs-card .obs-number {
            font-weight: 800;
            color: #8a6d1f;
            font-size: 0.9rem;
        }
        body.dark .obs-card .obs-number { color: #f9e79f; }
        .obs-card .obs-score {
            background: rgba(39,174,96,0.15);
            color: #0a6a0a;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        body.dark .obs-card .obs-score { color: #82e0aa; background: rgba(39,174,96,0.08); }

        .obs-card .obs-body {
            padding: 1rem 1.5rem 1.5rem;
        }
        .obs-card .obs-text {
            font-size: 0.85rem;
            color: #4a3a2a;
            line-height: 1.6;
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.dark .obs-card .obs-text { color: #d0c0b0; }
        .obs-card .obs-meta {
            font-size: 0.7rem;
            color: #888;
        }

        .ach-media {
            height: 200px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.dark .ach-media { background: rgba(0,0,0,0.1); }
        .ach-media img, .ach-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ach-media .no-media {
            font-size: 3rem;
            color: #888;
        }

        .ach-content { padding: 1.5rem; }
        .ach-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #2a1a0a;
            margin-bottom: 0.5rem;
        }
        body.dark .ach-title { color: #f0e8e0; }
        .ach-desc {
            font-size: 0.85rem;
            color: #4a3a2a;
            line-height: 1.6;
            margin-bottom: 0.8rem;
        }
        body.dark .ach-desc { color: #d0c0b0; }
        .ach-meta {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .badge-golden { background: rgba(212,175,55,0.2); color: #8a6d1f; }
        .badge-silver { background: rgba(192,192,192,0.2); color: #4a4a5a; }
        .badge-bronze { background: rgba(205,127,50,0.2); color: #6a4a0a; }

        .category-tag {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 700;
            background: rgba(40,116,166,0.1);
            color: #2874a6;
            border: 1px solid rgba(40,116,166,0.15);
        }
        body.dark .category-tag { color: #85c1e9; background: rgba(40,116,166,0.05); }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #888;
            grid-column: 1 / -1;
        }

        .back-row { display: flex; justify-content: center; margin-top: 2rem; gap: 1rem; flex-wrap: wrap; }
        .btn-back {
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            background: rgba(255,255,255,0.3);
            color: #0a0a1a;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        body.dark .btn-back { color: #f0e8d0; background: rgba(0,0,0,0.1); }
        .btn-back:hover { background: rgba(255,255,255,0.5); transform: translateY(-2px); }
        body.dark .btn-back:hover { background: rgba(255,255,255,0.05); }

        .btn-detail {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.5rem;
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #8a6d1f;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-detail:hover { background: rgba(212,175,55,0.2); }
        body.dark .btn-detail { color: #f9e79f; border-color: #f9e79f; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .gallery-grid { grid-template-columns: 1fr; }
            .stats-bar { gap: 0.8rem; }
            .stat-item { padding: 0.3rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">🏆 گالری نام‌آوران</h1>
        <div class="page-subtitle">دستاوردهای فرهنگی تأییدشده و مشاهدات برگزیده • سفیران فرهنگی جهان</div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="number" id="totalObs">۰</span>
                <span class="label">مشاهدات برگزیده</span>
            </div>
            <div class="stat-item">
                <span class="number" id="totalCount">۰</span>
                <span class="label">کل دستاوردها</span>
            </div>
            <div class="stat-item">
                <span class="number" id="goldenCount">۰</span>
                <span class="label">نشان طلایی</span>
            </div>
        </div>

        <h2 class="section-title">🏛️ مشاهدات برگزیده (اطلس ظهور - امتیاز ۵)</h2>
        <div id="observationsGrid" class="gallery-grid">
            <div class="empty-state">در حال بارگذاری...</div>
        </div>

        <h2 class="section-title">🏆 دستاوردهای نام‌آوران</h2>
        <div id="galleryGrid" class="gallery-grid">
            <div class="empty-state">در حال بارگذاری...</div>
        </div>

        <div class="back-row">
            <a href="index.html" class="btn-back">↩ بازگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        let allAchievements = [];
        let allObservations = [];

        const categoryLabels = {
            'art': '🎨 هنری',
            'science': '📄 علمی',
            'cultural': '🌍 فرهنگی',
            'media': '🎬 رسانه',
            'other': '📌 سایر'
        };

        const badgeLabels = {
            'golden': '🌟 طلایی',
            'silver': '🥈 نقره‌ای',
            'bronze': '🥉 برنزی'
        };

        async function loadObservations() {
            try {
                const res = await fetch('/api/get-connection-requests?type=observations&filter=gallery&t=' + Date.now());
                const data = await res.json();
                if (res.ok) {
                    allObservations = (data.observations || []).filter(o => o.status === 'approved');
                } else {
                    allObservations = [];
                }
            } catch (e) {
                console.error('Observations fetch error:', e);
                allObservations = [];
            }
            renderObservations();
        }

        async function loadGallery() {
            try {
                const response = await fetch('/api/get-users?t=' + new Date().getTime());
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');

                const data = await response.json();
                const users = data.users || [];

                allAchievements = [];
                users.forEach(user => {
                    if (user.achievements && Array.isArray(user.achievements)) {
                        user.achievements.forEach(ach => {
                            if (ach.status === 'approved') {
                                allAchievements.push({
                                    ...ach,
                                    ownerCode: user.cardCode,
                                    ownerRank: user.rank || 0,
                                    ownerBadge: user.badge || 'bronze'
                                });
                            }
                        });
                    }
                });

                updateStats();
                renderGallery();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('galleryGrid').innerHTML =
                    `<div class="empty-state" style="color:red;">خطا: ${error.message}</div>`;
            }
        }

        function updateStats() {
            document.getElementById('totalObs').textContent = allObservations.length.toLocaleString('fa-IR');
            const total = allAchievements.length;
            const golden = allAchievements.filter(a => a.ownerBadge === 'golden').length;
            document.getElementById('totalCount').textContent = total.toLocaleString('fa-IR');
            document.getElementById('goldenCount').textContent = golden.toLocaleString('fa-IR');
        }

              function renderObservations() {
            const container = document.getElementById('observationsGrid');
            if (!allObservations || allObservations.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ مشاهده‌ی برگزیده‌ای وجود ندارد.</div>`;
                return;
            }
            container.innerHTML = allObservations.map((obs, idx) => {
                const isAchievement = obs.labels && obs.labels.includes('achievement');
                const title = isAchievement && obs.title ? obs.title : ('مشاهده #' + obs.number);
                const text = isAchievement && obs.description ? obs.description : (obs.observation || '---');

                let mediaHtml = '';
                if (isAchievement && obs.fileUrl) {
                    const ext = (obs.fileUrl || '').split('.').pop().toLowerCase();
                    if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        mediaHtml = `<video controls src="${obs.fileUrl}" style="width:100%; border-radius:10px; margin-bottom:0.6rem;"></video>`;
                    } else {
                        mediaHtml = `<img src="${obs.fileUrl}" alt="${title}" style="width:100%; border-radius:10px; margin-bottom:0.6rem;" onerror="this.style.display='none'" />`;
                    }
                }

                return `
                <div class="obs-card">
                    <div class="obs-header">
                        <span class="obs-number">🏛️ ${isAchievement ? 'دستاورد' : 'مشاهده'} #${obs.number}</span>
                        <span class="obs-score">⭐ امتیاز ${obs.score || '---'}</span>
                    </div>
                    <div class="obs-body">
                        ${mediaHtml}
                        <div class="obs-text">${title}</div>
                        <div class="obs-text" style="font-size:0.85rem; opacity:0.8;">${text}</div>
                        <div class="obs-meta">👤 ${obs.cardCode || 'ناشناس'} • ${obs.createdAt ? new Date(obs.createdAt).toLocaleDateString('fa-IR') : '---'}</div>
                        <button class="btn-detail" onclick="showObservationDetail(${idx})">📊 مشاهده پرونده کامل</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderGallery() {
            const container = document.getElementById('galleryGrid');

            if (allAchievements.length === 0) {
                container.innerHTML = `<div class="empty-state">هیچ دستاوردی یافت نشد.</div>`;
                return;
            }

            container.innerHTML = allAchievements.map(ach => {
                let mediaHtml = '';
                if (ach.fileUrl) {
                    const ext = ach.fileName ? ach.fileName.split('.').pop().toLowerCase() : '';
                    if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        mediaHtml = `<video controls src="${ach.fileUrl}"></video>`;
                    } else {
                        mediaHtml = `<img src="${ach.fileUrl}" alt="${ach.title}" onerror="this.parentElement.innerHTML='<span class=\\'no-media\\'>📄</span>'" />`;
                    }
                } else if (ach.fileData) {
                    mediaHtml = `<img src="${ach.fileData}" alt="${ach.title}" />`;
                } else {
                    mediaHtml = `<span class="no-media">📄</span>`;
                }

                const badgeClass = ach.ownerBadge === 'golden' ? 'badge-golden' :
                                   ach.ownerBadge === 'silver' ? 'badge-silver' : 'badge-bronze';
                const badgeLabel = badgeLabels[ach.ownerBadge] || '🥉 برنزی';

                return `
                    <div class="ach-card">
                        <div class="ach-media">${mediaHtml}</div>
                        <div class="ach-content">
                            <div class="ach-title">${ach.title || 'بدون عنوان'}</div>
                            <div class="ach-desc">${ach.description || 'توضیحاتی ثبت نشده است.'}</div>
                            <div class="ach-meta">
                                <span class="badge ${badgeClass}">${badgeLabel}</span>
                                <span class="category-tag">${categoryLabels[ach.category] || '📌 سایر'}</span>
                                <br>
                                <span style="font-size:0.65rem; color:#888;">${ach.ownerCode} • رتبه ${ach.ownerRank}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showObservationDetail(idx) {
            const item = allObservations[idx];
            if (!item) return;

            const clusterNames = {
                'human': 'انسان', 'knowledge': 'دانش و فناوری',
                'governance': 'حکمرانی و تمدن', 'survival': 'بقا و آینده', 'other': 'نامشخص'
            };

            const guide = item.guide || {};
            const matrix = {
                emergence: item.matrix_emergence,
                layer: item.matrix_layers,
                connection: item.matrix_connections,
                scale: item.matrix_scale,
                capacity: item.matrix_capacity
            };

            let html = `
                <div style="text-align:right; direction:rtl; line-height:1.8; max-height:70vh; overflow-y:auto;">
                    <h3 style="color:#8a6d1f; border-bottom:2px solid #d4af37; padding-bottom:0.5rem; margin-bottom:1rem;">
                        🏛️ پرونده ظهور #${item.number}
                    </h3>
                    <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(212,175,55,0.08); border-radius:10px; border-right:4px solid #d4af37;">
                        <div style="font-weight:800; font-size:0.85rem; color:#8a6d1f; margin-bottom:0.4rem;">📝 مشاهده ثبت‌شده</div>
                        <div style="font-size:0.85rem; line-height:1.8;">${item.observation || '---'}</div>
                    </div>
            `;

            if (guide.individual || guide.network || guide.policy) {
                html += `
                    <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(16,185,129,0.06); border-radius:10px; border-right:4px solid #10b981;">
                        <div style="font-weight:800; font-size:0.85rem; color:#047857; margin-bottom:0.4rem;">🤖 راهنمای سه‌سطحی (AI-1)</div>
                        ${guide.individual ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>📍 سطح فردی:</strong> ${guide.individual}</div>` : ''}
                        ${guide.network ? `<div style="margin-bottom:0.4rem; font-size:0.82rem; line-height:1.7;"><strong>🌐 سطح اجتماعی:</strong> ${guide.network}</div>` : ''}
                        ${guide.policy ? `<div style="font-size:0.82rem; line-height:1.7;"><strong>🏛️ سطح نهادی:</strong> ${guide.policy}</div>` : ''}
                    </div>
                `;
            }

            if (matrix.emergence || matrix.layer || matrix.connection || matrix.scale || matrix.capacity) {
                html += `
                    <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(99,102,241,0.06); border-radius:10px; border-right:4px solid #6366f1;">
                        <div style="font-weight:800; font-size:0.85rem; color:#4338ca; margin-bottom:0.4rem;">
                            🧠 ماتریس ۵ سطحی (AI-2)
                            ${item.cluster ? `<span style="background:rgba(212,175,55,0.15); padding:0.1rem 0.6rem; border-radius:10px; font-size:0.7rem; margin-right:0.3rem;">📂 ${clusterNames[item.cluster] || item.cluster}</span>` : ''}
                        </div>
                        ${matrix.emergence ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ظهورها:</strong> ${matrix.emergence}</div>` : ''}
                        ${matrix.layer ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 لایه‌ها:</strong> ${matrix.layer}</div>` : ''}
                        ${matrix.connection ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ارتباطات:</strong> ${matrix.connection}</div>` : ''}
                        ${matrix.scale ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 مقیاس:</strong> ${matrix.scale}</div>` : ''}
                        ${matrix.capacity ? `<div style="margin-bottom:0.35rem; font-size:0.8rem; line-height:1.7;"><strong>📊 ظرفیت:</strong> ${matrix.capacity}</div>` : ''}
                    </div>
                `;
            }

            if (item.ai3Final) {
                html += `
                    <div style="margin-bottom:0.8rem; padding:0.7rem; background:rgba(236,72,153,0.06); border-radius:10px; border-right:4px solid #ec4899;">
                        <div style="font-weight:800; font-size:0.85rem; color:#be185d; margin-bottom:0.4rem;">💎 تحلیل نهایی (AI-3)</div>
                        <div style="font-size:0.85rem; line-height:1.9;">${item.ai3Final}</div>
                    </div>
                `;
            }

            html += `</div>`;
            showCustomModal(`🏛️ پرونده ظهور #${item.number}`, html);
        }

        function showCustomModal(title, bodyHtml) {
            let modal = document.getElementById('customModal');
            if (modal) modal.remove();

            modal = document.createElement('div');
            modal.id = 'customModal';
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px);';
            modal.innerHTML = `
                <div style="background:#fff;color:#2a1a0a;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px;padding:1.5rem;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.3);">
                    <button onclick="document.getElementById('customModal').remove()" style="position:absolute;top:0.5rem;left:0.5rem;background:rgba(0,0,0,0.1);border:none;width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer;">✕</button>
                    <h2 style="color:#8a6d1f;margin-bottom:1rem;font-size:1.1rem;padding-left:2.5rem;">${title}</h2>
                    <div>${bodyHtml}</div>
                </div>
            `;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        loadObservations();
        loadGallery();
        setInterval(loadObservations, 60000);
        setInterval(loadGallery, 60000);
    </script>
</body>
</html>
