<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ویرایش اطلاعات | کارت جهانی هویت هوشمند فرهنگی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazir', 'IRANSans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 0.8rem;
            background: linear-gradient(135deg, #fdf6e3 0%, #e8f4f8 50%, #f5e6d3 100%);
            background-attachment: fixed;
            color: #2a1a0a;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #3a2f20 0%, #2a2418 50%, #4a3a28 100%);
            color: #f0e8d0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(253, 246, 227, 0.8));
            border-radius: 20px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
            margin-bottom: 0.8rem;
            position: relative;
            overflow: hidden;
        }
        body.dark .header {
            background: linear-gradient(135deg, rgba(74, 58, 40, 0.7), rgba(58, 47, 32, 0.8));
            border-color: rgba(212, 175, 55, 0.5);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(212, 175, 55, 0.08), transparent 30%);
            animation: rotateGlow 15s linear infinite;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .header > * { position: relative; z-index: 2; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            color: #8a6d1f;
        }
        body.dark .theme-toggle {
            background: rgba(0, 0, 0, 0.3);
            color: #f9e79f;
            border-color: rgba(212, 175, 55, 0.4);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .main-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.4));
        }

        .title-wrap h1 {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8a6d1f 0%, #d4af37 50%, #8a6d1f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }
        body.dark .title-wrap h1 {
            background: linear-gradient(135deg, #f9e79f 0%, #d4af37 50%, #f9e79f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #6a5a3a;
            margin-top: 0.3rem;
        }
        body.dark .subtitle { color: #c8b890; }

        .message-box {
            display: none;
            padding: 0.8rem;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .message-box.success {
            display: block;
            background: rgba(39, 174, 96, 0.15);
            border: 2px solid rgba(39, 174, 96, 0.4);
            color: #1e7a1e;
        }
        body.dark .message-box.success { color: #82e0aa; }
        .message-box.error {
            display: block;
            background: rgba(220, 80, 60, 0.15);
            border: 2px solid rgba(220, 80, 60, 0.4);
            color: #a93226;
        }
        body.dark .message-box.error { color: #f1948a; }
        .message-box.info {
            display: block;
            background: rgba(52, 152, 219, 0.15);
            border: 2px solid rgba(52, 152, 219, 0.4);
            color: #2874a6;
        }
        body.dark .message-box.info { color: #85c1e9; }

        .value-box {
            border-radius: 18px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.6rem;
            border: 2px solid;
            transition: all 0.3s ease;
        }
        .value-box:hover { transform: translateY(-2px); }

        .value-box .value-title {
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .value-box textarea {
            width: 100%;
            min-height: 90px;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 0.85rem;
            color: #2a1a0a;
            resize: vertical;
            line-height: 1.7;
        }
        body.dark .value-box textarea {
            background: rgba(0, 0, 0, 0.3);
            color: #f0e8d0;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .value-box textarea:focus {
            outline: none;
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .value-1 {
            background: linear-gradient(135deg, rgba(255, 248, 220, 0.85), rgba(253, 246, 227, 0.9));
            border-color: rgba(212, 175, 55, 0.5);
        }
        body.dark .value-1 {
            background: linear-gradient(135deg, rgba(74, 58, 40, 0.7), rgba(58, 47, 32, 0.8));
            border-color: rgba(212, 175, 55, 0.5);
        }
        .value-1 .value-title { color: #8a6d1f; }
        body.dark .value-1 .value-title { color: #f9e79f; }

        .value-2 {
            background: linear-gradient(135deg, rgba(220, 240, 255, 0.85), rgba(200, 230, 250, 0.9));
            border-color: rgba(100, 170, 220, 0.5);
        }
        body.dark .value-2 {
            background: linear-gradient(135deg, rgba(40, 60, 80, 0.7), rgba(50, 70, 90, 0.8));
            border-color: rgba(133, 193, 233, 0.5);
        }
        .value-2 .value-title { color: #2874a6; }
        body.dark .value-2 .value-title { color: #85c1e9; }

        .value-3 {
            background: linear-gradient(135deg, rgba(220, 245, 220, 0.85), rgba(200, 235, 200, 0.9));
            border-color: rgba(100, 180, 100, 0.5);
        }
        body.dark .value-3 {
            background: linear-gradient(135deg, rgba(40, 70, 40, 0.7), rgba(50, 80, 50, 0.8));
            border-color: rgba(130, 224, 170, 0.5);
        }
        .value-3 .value-title { color: #1e7a1e; }
        body.dark .value-3 .value-title { color: #82e0aa; }

        .value-4 {
            background: linear-gradient(135deg, rgba(240, 225, 250, 0.85), rgba(230, 215, 245, 0.9));
            border-color: rgba(160, 120, 200, 0.5);
        }
        body.dark .value-4 {
            background: linear-gradient(135deg, rgba(70, 50, 90, 0.7), rgba(80, 60, 100, 0.8));
            border-color: rgba(210, 180, 222, 0.5);
        }
        .value-4 .value-title { color: #6a3d9a; }
        body.dark .value-4 .value-title { color: #d2b4de; }

        .value-5 {
            background: linear-gradient(135deg, rgba(220, 245, 245, 0.85), rgba(200, 235, 235, 0.9));
            border-color: rgba(80, 180, 180, 0.5);
        }
        body.dark .value-5 {
            background: linear-gradient(135deg, rgba(40, 70, 70, 0.7), rgba(50, 80, 80, 0.8));
            border-color: rgba(130, 220, 220, 0.5);
        }
        .value-5 .value-title { color: #148f77; }
        body.dark .value-5 .value-title { color: #76d7c4; }

        .value-6 {
            background: linear-gradient(135deg, rgba(255, 225, 215, 0.85), rgba(250, 210, 200, 0.9));
            border-color: rgba(220, 120, 100, 0.5);
        }
        body.dark .value-6 {
            background: linear-gradient(135deg, rgba(90, 50, 50, 0.7), rgba(100, 60, 60, 0.8));
            border-color: rgba(241, 148, 138, 0.5);
        }
        .value-6 .value-title { color: #a93226; }
        body.dark .value-6 .value-title { color: #f1948a; }

        .value-7 {
            background: linear-gradient(135deg, rgba(255, 235, 200, 0.85), rgba(250, 225, 180, 0.9));
            border-color: rgba(230, 160, 50, 0.5);
        }
        body.dark .value-7 {
            background: linear-gradient(135deg, rgba(80, 60, 30, 0.7), rgba(90, 70, 40, 0.8));
            border-color: rgba(243, 196, 106, 0.5);
        }
        .value-7 .value-title { color: #b7791f; }
        body.dark .value-7 .value-title { color: #f3c46a; }

        .form-group {
            background: linear-gradient(135deg, rgba(220, 240, 255, 0.85), rgba(200, 230, 250, 0.9));
            border-radius: 18px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.6rem;
            border: 2px solid rgba(100, 170, 220, 0.4);
        }
        body.dark .form-group {
            background: linear-gradient(135deg, rgba(40, 60, 80, 0.7), rgba(50, 70, 90, 0.8));
            border-color: rgba(133, 193, 233, 0.4);
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2874a6;
            margin-bottom: 0.4rem;
        }
        body.dark .form-group label { color: #85c1e9; }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 0.85rem;
            color: #2a1a0a;
        }
        body.dark .form-group input {
            background: rgba(0, 0, 0, 0.3);
            color: #f0e8d0;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .form-group small {
            display: block;
            margin-top: 0.3rem;
            font-size: 0.7rem;
            color: #6a5a3a;
            opacity: 0.8;
        }
        body.dark .form-group small { color: #c8b890; }

        .readonly-field {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.4);
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #8a6d1f;
            font-weight: 700;
            text-align: center;
        }
        body.dark .readonly-field {
            background: rgba(212, 175, 55, 0.15);
            color: #f9e79f;
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.9rem;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #f9e79f 50%, #d4af37 100%);
            color: #2a1a0a;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            color: #2a1a0a;
            border: 2px solid rgba(212, 175, 55, 0.4);
        }
        body.dark .btn-secondary {
            background: rgba(0, 0, 0, 0.3);
            color: #f9e79f;
            border-color: rgba(212, 175, 55, 0.5);
        }
        .btn-secondary:hover {
            transform: scale(1.02);
        }

        .note {
            text-align: center;
            font-size: 0.7rem;
            color: #6a5a3a;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        body.dark .note { color: #c8b890; }

        @media (min-width: 768px) {
            body { padding: 1.5rem; }
            .header { padding: 1.5rem; border-radius: 24px; margin-bottom: 1rem; }
            .main-logo { width: 80px; height: 80px; }
            .title-wrap h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.85rem; }
            .value-box { padding: 1.2rem 1.4rem; margin-bottom: 0.8rem; }
            .value-box .value-title { font-size: 1.1rem; }
            .value-box textarea { min-height: 110px; font-size: 0.9rem; }
            .form-group { padding: 1rem 1.2rem; }
            .form-group label { font-size: 0.9rem; }
            .form-group input { font-size: 0.9rem; }
            .btn { font-size: 1rem; padding: 0.9rem 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="top-bar">
            <div></div>
            <button class="theme-toggle" id="themeToggle"></button>
        </div>

        <div class="logo-wrap">
            <img src="assets/logo-fa.png" alt="لوگو" class="main-logo" />
            <div class="title-wrap">
                <h1>ویرایش اطلاعات فرهنگی</h1>
                <div class="subtitle">کارت جهانی هویت هوشمند فرهنگی</div>
            </div>
        </div>
    </div>

    <div id="messageBox" class="message-box"></div>

    <form id="editForm">
        <!-- کد کارت - فقط خواندنی -->
        <div class="form-group">
            <label>🔑 کد کارت شما (غیر قابل تغییر)</label>
            <div class="readonly-field" id="displayCardCode">---</div>
            <small>کد کارت منحصربه‌فرد شماست و قابل تغییر نیست</small>
        </div>

        <!-- ارزش ۱ -->
        <div class="value-box value-1">
            <label class="value-title">🪪 ۱. ارزش‌های بومی</label>
            <textarea id="v1" placeholder="مثلاً: صلح‌دوستی، مهمان‌نوازی، احترام به بزرگان..." required></textarea>
        </div>

        <!-- ارزش ۲ -->
        <div class="value-box value-2">
            <label class="value-title">📚 . دانش فردی</label>
            <textarea id="v2" placeholder="مثلاً: دانش بومی، مهارت‌های سنتی، تجربه کاری..." required></textarea>
        </div>

        <!-- ارزش ۳ -->
        <div class="value-box value-3">
            <label class="value-title">🤝 ۳. همکاری جمعی</label>
            <textarea id="v3" placeholder="مثلاً: کار گروهی، مشارکت اجتماعی، فعالیت داوطلبانه..." required></textarea>
        </div>

        <!-- ارزش ۴ -->
        <div class="value-box value-4">
            <label class="value-title">🌍 ۴. تنوع فرهنگی</label>
            <textarea id="v4" placeholder="مثلاً: احترام به فرهنگ‌های مختلف، یادگیری از دیگران..." required></textarea>
        </div>

        <!-- ارزش ۵ -->
        <div class="value-box value-5">
            <label class="value-title">☮️ ۵. صلح پایدار جهانی</label>
            <textarea id="v5" placeholder="مثلاً: گفت‌وگو، حل تعارض، دیپلماسی فرهنگی..." required></textarea>
        </div>

        <!-- ارزش ۶ -->
        <div class="value-box value-6">
            <label class="value-title">️ ۶. محو خشونت</label>
            <textarea id="v6" placeholder="مثلاً: کاهش تعصب، ترویج مدارا، مبارزه با تبعیض..." required></textarea>
        </div>

        <!-- ارزش ۷ -->
        <div class="value-box value-7">
            <label class="value-title">🔗 . اتحاد فرهنگی</label>
            <textarea id="v7" placeholder="مثلاً: پل‌های ارتباطی میان فرهنگ‌ها، هم‌افزایی..." required></textarea>
        </div>

        <!-- کد اختیاری -->
        <div class="form-group">
            <label>🔑 کد اختیاری (۵ کاراکتر دلخواه)</label>
            <input type="text" id="optionalCode" maxlength="5" placeholder="مثلاً: الف-ب-ج-د-ه" />
            <small>اختیاری - می‌توانید خالی بگذارید</small>
        </div>

        <!-- ایمیل -->
        <div class="form-group">
            <label> ایمیل ارتباطی (اختیاری)</label>
            <input type="email" id="communicationEmail" placeholder="ایمیل خود را وارد کنید" />
            <small>فقط برای ارتباط با هم‌فرهنگان استفاده می‌شود</small>
        </div>

        <!-- دکمه‌ها -->
        <div class="btn-group">
            <button type="submit" class="btn btn-primary" id="submitBtn">💾 ثبت تغییرات</button>
            <a href="index.html" class="btn btn-secondary">↩ بازگشت</a>
        </div>
    </form>

    <div class="note">
        ⚠️ توجه: تغییرات شما توسط ادمین بررسی و در صورت تأیید، اعمال خواهد شد
    </div>

</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const cardCode = urlParams.get('code') || localStorage.getItem('culturalCardCode');

    // تم
    (function() {
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', function() {
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) {
                toggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                toggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });
    })();

    // بارگذاری اطلاعات کاربر
    async function loadUserData() {
        if (!cardCode) {
            showMessage(' کد کارت یافت نشد. لطفاً ابتدا ثبت‌نام کنید.', 'error');
            return;
        }

        try {
            const response = await fetch(`/api/get-user?code=${cardCode}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'خطا در دریافت اطلاعات');
            }

            const user = data.user;

            // نمایش کد کارت
            document.getElementById('displayCardCode').textContent = user.cardCode || cardCode;

            // پر کردن فیلدها با اطلاعات موجود
            if (user.values && user.values.length === 7) {
                document.getElementById('v1').value = user.values[0];
                document.getElementById('v2').value = user.values[1];
                document.getElementById('v3').value = user.values[2];
                document.getElementById('v4').value = user.values[3];
                document.getElementById('v5').value = user.values[4];
                document.getElementById('v6').value = user.values[5];
                document.getElementById('v7').value = user.values[6];
            }

            if (user.optionalCode) {
                document.getElementById('optionalCode').value = user.optionalCode;
            }

            if (user.communicationEmail) {
                document.getElementById('communicationEmail').value = user.communicationEmail;
            }

        } catch (error) {
            console.error('Error:', error);
            showMessage(`❌ خطا: ${error.message}`, 'error');
        }
    }

    // پیام
    function showMessage(text, type) {
        const box = document.getElementById('messageBox');
        box.textContent = text;
        box.className = 'message-box ' + type;
        box.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hideMessage() {
        const box = document.getElementById('messageBox');
        box.style.display = 'none';
    }

    // ارسال فرم
    document.getElementById('editForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessage();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ در حال ثبت...';

        try {
            const values = [
                document.getElementById('v1').value.trim(),
                document.getElementById('v2').value.trim(),
                document.getElementById('v3').value.trim(),
                document.getElementById('v4').value.trim(),
                document.getElementById('v5').value.trim(),
                document.getElementById('v6').value.trim(),
                document.getElementById('v7').value.trim()
            ];

            for (let v of values) {
                if (!v) throw new Error('لطفاً تمام ۷ ارزش فرهنگی را وارد کنید.');
            }

            const optionalCode = document.getElementById('optionalCode').value.trim() || '';
            const communicationEmail = document.getElementById('communicationEmail').value.trim() || '';

            const userData = {
                values: values,
                optionalCode: optionalCode,
                communicationEmail: communicationEmail,
                status: 'pending' // وضعیت را به در انتظار تغییر می‌دهیم
            };

            // ارسال به API برای بروزرسانی
            const response = await fetch(`/api/update-user?code=${cardCode}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData),
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showMessage('✅ تغییرات شما با موفقیت ثبت شد و توسط ادمین بررسی خواهد شد.', 'success');
                submitBtn.textContent = '✅ ثبت شد';
                
                setTimeout(() => {
                    window.location.href = `card-fa.html?code=${cardCode}`;
                }, 3000);
            } else {
                throw new Error(result.error || 'خطا در ذخیره‌سازی');
            }

        } catch (error) {
            console.error('Error:', error);
            showMessage(`❌ خطا: ${error.message}`, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '💾 ثبت تغییرات';
        }
    });

    // بارگذاری اولیه
    document.addEventListener('DOMContentLoaded', loadUserData);
</script>
</body>
</html>
